packages:
  - web
  - supervisor
  - mcp
  - site
  - site-docs

dangerouslyAllowAllBuilds: true

# Remove these scoped security pins when the direct owners adopt patched ranges.
overrides:
  '@mintlify/cli>sharp': 0.35.5
  '@mintlify/package-builder>js-yaml': 4.3.2
  # Drizzle Kit 0.31.11 embeds tsx and never imports this obsolete loader.
  'drizzle-kit@0.31.11>@esbuild-kit/esm-loader': '-'
  'archiver-utils>glob': 14.0.4
  '@typescript-eslint/typescript-estree>minimatch': 11.0.8
  'eslint>minimatch': 11.0.8
  '@eslint/config-array>minimatch': 11.0.8
  'eslint-plugin-jsx-a11y-x>minimatch': 11.0.8

minimumReleaseAgeExclude:
  - icu-minify@4.13.0
  - next-intl-swc-plugin-extractor@4.13.0
  - next-intl@4.13.0
  - use-intl@4.13.0
  - '@xyflow/react@12.11.0'
  - '@xyflow/system@0.0.77'
  - '@mintlify/cli@4.1.17'
  - '@mintlify/package-builder@0.0.147'
  - mint@4.3.17
  - minimatch@11.0.8
  - '@eslint-react/ast@5.30.2'
  - '@eslint-react/core@5.30.2'
  - '@eslint-react/eslint@5.30.2'
  - '@eslint-react/jsx@5.30.2'
  - '@eslint-react/shared@5.30.2'
  - '@eslint-react/var@5.30.2'
  - eslint-plugin-react-x@5.30.2
  - eslint-plugin-react-dom@5.30.2
  - eslint-plugin-react-jsx@5.30.2

# Keep native crypto and CPU detection compatible until upstream adopts the current Node/V8 API.
patchedDependencies:
  cpu-features@0.0.10: patches/cpu-features@0.0.10.patch
  ssh2@1.17.0: patches/ssh2@1.17.0.patch
