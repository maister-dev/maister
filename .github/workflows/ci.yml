name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened, labeled]

jobs:
  lint-typecheck-unit:
    name: Docker-free lint + typecheck + unit (web + supervisor)
    runs-on: ubuntu-latest
    env:
      # This lane must prove build/unit safety without a Docker daemon. Database
      # suites run in the separate integration and mandatory A/B jobs.
      DOCKER_HOST: tcp://127.0.0.1:1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (monorepo root)
        run: pnpm install --frozen-lockfile

      # These were local-only gates: `validate:docs` is not reachable from any
      # hook this repo actually ships, so a schema change could land with a stale
      # generated ERD — and did (`execution_event_skips` in `schema.ts` with no
      # `docs/db/erd.dbml` row, found during M51's rebase). Docker-free: the ERD
      # check reads the Drizzle schema, not a database.
      - name: Validate docs (repo-wide) + API contracts
        run: |
          pnpm validate:docs:all
          pnpm validate:contracts

      - name: Lint (web)
        run: pnpm --filter maister-web lint

      - name: Typecheck (web)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm --filter maister-web typecheck

      - name: Unit tests (web)
        run: pnpm --filter maister-web test:unit

      - name: Lint (supervisor)
        run: pnpm --filter @maister/supervisor lint

      - name: Typecheck (supervisor)
        run: pnpm --filter @maister/supervisor typecheck

      - name: Unit tests (supervisor)
        run: pnpm --filter @maister/supervisor test:unit

      - name: Integration tests (supervisor)
        run: pnpm --filter @maister/supervisor test:integration

  integration:
    name: integration tests (web testcontainers)
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'integration')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (monorepo root)
        run: pnpm install --frozen-lockfile

      - name: Integration tests (web)
        run: pnpm --filter maister-web test:integration

  librarian-acceptance:
    name: Librarian browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter maister-web exec playwright install --with-deps chromium
      - run: pnpm --filter maister-web test:e2e:librarian
        env:
          # Runtime client initialization includes Docker, Compose discovery and DNS.
          # Keep container/exec output namespaces disabled; diagnose the unchanged probe deadline.
          DEBUG: testcontainers

  execution-data-plane:
    name: A/B web (Node ${{ matrix.node }}, shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # The 2–4 vCPU runner uses one worker; each explicit half gets its own 60-minute budget.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: [24.15.0, 24.19.0]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm runtime:check
      - run: pnpm --filter maister-web test:integration:ab --shard ${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: execution-data-plane-node-${{ matrix.node }}-shard-${{ matrix.shard }}-of-2
          path: /tmp/maister-ab-*/vitest.json
          if-no-files-found: error

  execution-runtime-supervisor:
    name: A/B runtime + supervisor (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: [24.15.0, 24.19.0]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm runtime:check
      - run: pnpm test:runtime
      - run: pnpm test:stage-ab-lane
      - run: pnpm --filter @maister/supervisor test:integration:ab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: execution-runtime-supervisor-node-${{ matrix.node }}
          path: /tmp/maister-ab-*/vitest.json
          if-no-files-found: error

  execution-isolation:
    name: A/B isolation (macOS Intel, Node 24.19.0)
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      MAISTER_TEST_DOCKER_PROBE_TIMEOUT_MS: "30000"
    steps:
      - name: Record runner and evidence location
        shell: bash
        run: |
          evidence_dir="$RUNNER_TEMP/maister-isolation-evidence"
          mkdir -p "$evidence_dir"
          echo "MAISTER_TEST_EVIDENCE_DIR=$evidence_dir" >> "$GITHUB_ENV"
          echo "S52_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          printf 'commit=%s\nimage=%s\nimage_version=%s\narchitecture=%s\nrun_url=%s\n' \
            "$GITHUB_SHA" "$ImageOS" "$ImageVersion" "$RUNNER_ARCH" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$evidence_dir/runner.txt"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm runtime:check
      - name: Provision pinned isolated container runtime
        timeout-minutes: 15
        shell: bash
        run: |
          set -o pipefail
          trap 'status=$?; printf "runtime_setup_exit_code=%s\nruntime_setup_end_seconds=%s\n" "$status" "$(( $(date +%s) - S52_JOB_STARTED_AT ))" >> "$MAISTER_TEST_EVIDENCE_DIR/timing.txt"' EXIT
          bash scripts/setup-isolation-ci-runtime.sh 2>&1 | tee "$MAISTER_TEST_EVIDENCE_DIR/runtime-setup.log"
          echo "runtime_ready_seconds=$(( $(date +%s) - S52_JOB_STARTED_AT ))" >> "$MAISTER_TEST_EVIDENCE_DIR/timing.txt"
      - name: Prove filesystem driver and Testcontainers before production build
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          trap 'status=$?; printf "preflight_exit_code=%s\npreflight_end_seconds=%s\n" "$status" "$(( $(date +%s) - S52_JOB_STARTED_AT ))" >> "$MAISTER_TEST_EVIDENCE_DIR/timing.txt"' EXIT
          node --input-type=module -e 'import {runStageAbLane} from "./scripts/run-stage-ab-tests.mjs"; await runStageAbLane({slice:"isolation",files:["test-support/__tests__/execution-ab-preflight.integration.test.ts"]});' 2>&1 | tee "$MAISTER_TEST_EVIDENCE_DIR/preflight.log"
          echo "preflight_complete_seconds=$(( $(date +%s) - S52_JOB_STARTED_AT ))" >> "$MAISTER_TEST_EVIDENCE_DIR/timing.txt"
      - name: Run the complete production isolation slice
        timeout-minutes: 40
        shell: bash
        run: |
          set -o pipefail
          trap 'status=$?; printf "isolation_exit_code=%s\nisolation_end_seconds=%s\n" "$status" "$(( $(date +%s) - S52_JOB_STARTED_AT ))" >> "$MAISTER_TEST_EVIDENCE_DIR/timing.txt"' EXIT
          elapsed=$(( $(date +%s) - S52_JOB_STARTED_AT ))
          remaining=$(( 3240 - elapsed ))
          if test "$remaining" -gt 2340; then remaining=2340; fi
          printf 'suite_start_seconds=%s\nremaining_suite_budget_seconds=%s\n' "$elapsed" "$remaining" >> "$MAISTER_TEST_EVIDENCE_DIR/timing.txt"
          if test "$remaining" -le 0; then
            echo "No isolation budget remains before the cleanup and upload reserve" >&2
            exit 1
          fi
          gtimeout --signal=TERM --kill-after=30s "${remaining}s" pnpm --filter maister-web test:integration:isolation 2>&1 | tee "$MAISTER_TEST_EVIDENCE_DIR/isolation.log"
          echo "isolation_complete_seconds=$(( $(date +%s) - S52_JOB_STARTED_AT ))" >> "$MAISTER_TEST_EVIDENCE_DIR/timing.txt"
      - name: Upload actual isolation reports
        id: isolation_reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-isolation-reports
          path: ${{ runner.temp }}/maister-isolation-evidence/**/vitest.json
          if-no-files-found: error
      - name: Stop the job-owned container runtime
        if: always()
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          reports_upload_outcome='${{ steps.isolation_reports.outcome }}'
          record_cleanup_result() {
            local status=$?
            local elapsed=$(( $(date +%s) - S52_JOB_STARTED_AT ))
            if ! printf 'reports_upload_outcome=%s\nruntime_cleanup_exit_code=%s\nruntime_cleanup_end_seconds=%s\n' \
              "$reports_upload_outcome" "$status" "$elapsed" >> "$MAISTER_TEST_EVIDENCE_DIR/timing.txt"; then
              echo "Failed to record container runtime cleanup outcome" >&2
              if test "$status" -eq 0; then status=1; fi
            fi
            exit "$status"
          }
          trap record_cleanup_result EXIT
          runtime_dir="$RUNNER_TEMP/maister-isolation-runtime"
          if test -x "$runtime_dir/bin/colima" && test -f "$runtime_dir/maister-s52.start-attempted"; then
            COLIMA_HOME="$runtime_dir/colima" "$runtime_dir/bin/colima" --profile maister-s52 delete --force
          fi
      - name: Preserve isolation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-isolation-diagnostics
          path: ${{ runner.temp }}/maister-isolation-evidence/
          if-no-files-found: error

  execution-image:
    name: Production image transport and shutdown
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: docker build --target production --tag maister-ab:ci .
      - name: Binary HTTP against the real supervisor in the image
        run: docker run --rm --workdir /app/web --entrypoint node maister-ab:ci node_modules/vitest/vitest.mjs run lib/__tests__/supervisor-client-binary.integration.test.ts --project=integration
      - name: Production HTTP and SIGTERM against real PostgreSQL
        working-directory: web
        # The two steps above just built and ran a container, so Docker's
        # presence is this step's precondition, not its question. The default
        # 3 s probe guards the absent-Docker hang; a runtime client handing
        # itself back slowly right after a layer export is not that case, and
        # tripping it aborts the smoke before it starts.
        env:
          MAISTER_TEST_DOCKER_PROBE_TIMEOUT_MS: "30000"
        run: pnpm exec tsx --import ./scripts/_register-shim.mjs scripts/smoke-production-image.ts maister-ab:ci
