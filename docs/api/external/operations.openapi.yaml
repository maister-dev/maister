        taskId:
          type: string
          format: uuid
          nullable: true
        taskKey:
          type: string
          nullable: true
        hitlRequestId:
          type: string
          format: uuid
          nullable: true
        gateId:
          type: string
          nullable: true

    ExtActivityHappenedBlock:
      type: object
      description: Persisted fact replay block of the assistant pulse.
      required: [items, nextCursor, hasMore]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExtActivityPulseItem"
        nextCursor:
          type: string
          description: |
            Opaque cursor for the next pulse call. When `since` is omitted, this
            is seeded to the current project tail and `items` is empty.
        hasMore:
          type: boolean
          description: True when additional persisted facts remain after `nextCursor`.

    ExtActivityNowBlock:
      type: object
      description: Full active-run snapshot for the token-bound project.
      required: [generatedAt, runs]
      additionalProperties: false
      properties:
        generatedAt:
          type: string
          format: date-time
        runs:
          type: array
          items:
            $ref: "#/components/schemas/ExtActivityRunSnapshot"

    ExtNeedsYouItem:
      type: object
      description: One pending project-scoped human-attention item.
      required: [runId, hitlRequestId, kind, title, summary, requestedAt]
      additionalProperties: false
      properties:
        runId:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
          nullable: true
        taskKey:
          type: string
          nullable: true
        taskTitle:
          type: string
          nullable: true
        hitlRequestId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            [
              permission,
              form,
              human,
              agent_question,
              infra_recovery,
              budget_breach,
              hook_trip,
              decision_request,
            ]
        title:
          type: string
        summary:
          type: string
        requestedAt:
          type: string
          format: date-time
        criticality:
          type: string
          nullable: true
          enum: [low, medium, high, critical]

    ExtPromotionReadyItem:
      type: object
      description: |
        (ADR-152) One `Review` flow run that is readiness-green and waiting only
        on a human promote decision. Membership is a TWO-layer predicate:
        **Layer 1 (mechanical)** `run_kind='flow'` ∧ `status='Review'` ∧
        `isPhaseReady(readiness)` over an exported allow-list; **Layer 2
        (operator-intent suppression)** additionally excludes
        `runs.promotion_hold IS NOT NULL` and launched evaluation-lineage
        participants. Layer 2 is a DELIBERATE divergence — a human `promoteRun`
        would accept those runs (its hold/lineage refusals are conditional on
        unattended attribution) and the pulse withholds them anyway.
      required:
        [runId, taskId, taskKey, taskTitle, targetBranch, readiness, inReviewSince]
      additionalProperties: false
      properties:
        runId:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
          nullable: true
        taskKey:
          type: string
          nullable: true
        taskTitle:
          type: string
          nullable: true
        targetBranch:
          type: string
          nullable: true
          description: |
            `workspaces.target_branch`. `null` means the branch is resolved from
            the task/project default at promote time.
        readiness:
          type: string
          enum: [ready, overridden]
          description: |
            The rolled-up `ReadinessState`. Only `ready` and `overridden` can
            appear here — `isPhaseReady` admits exactly those two, and
            `overridden` outranks `ready` in `READINESS_PRIORITY`, so a run with
            one waived blocking gate reports `overridden`.
        inReviewSince:
          type: string
          format: date-time
          nullable: true
          description: |
            `runs.review_entered_at`. Ordering is `inReviewSince` ascending with
            `runId` ascending as tiebreak; `null` sorts last.

    ExtActivityNeedsYouBlock:
      type: object
      description: Project-scoped pending human-attention snapshot.
      required: [generatedAt, items, promotable]
      additionalProperties: false
      properties:
        generatedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExtNeedsYouItem"
        promotable:
          type: array
          description: |
            (ADR-152) Runs waiting on a promote decision. REQUIRED and always
            emitted — `[]` when nothing qualifies, never omitted and never
            `null`. A parallel array rather than a widened `ExtNeedsYouItem`,
            whose `hitlRequestId` stays non-null for every existing consumer.
          items:
            $ref: "#/components/schemas/ExtPromotionReadyItem"

    ExtPulseAgentItem:
      type: object
      description: |
        (ADR-152) One `agent_project_links` row for the token-bound project.
        Non-summonable agents are REPORTED with a reason, never filtered out.
        Carries no memory content, size, or hash.
      required:
        [agentId, stem, displayName, enabled, summonable, summonBlockedReason]
      additionalProperties: false
      properties:
        agentId:
          type: string
          description: Qualified agent id, `<packageName>:<stem>`.
        stem:
          type: string
          description: The bare stem — the id minus its package prefix.
        displayName:
          type: string
        enabled:
          type: boolean
          description: |
            The **attachment** axis (`agent_project_links.enabled`), NOT
            `agents.enabled`. A catalog-disabled agent on an enabled link
            reports `enabled: true` with
            `summonBlockedReason: "agent_disabled"`.
        summonable:
          type: boolean
          description: True exactly when `summonBlockedReason` is `null`.
        summonBlockedReason:
          type: string
          nullable: true
          description: |
            The highest-precedence failing conjunct of the ADR-151 summonability
            predicate. Precedence is exactly the declared member order.
          enum:
            [
              link_disabled,
              agent_disabled,
              quarantined,
              trigger_missing,
              mention_binding_missing,
            ]

    ExtActivityAgentsBlock:
      type: object
      description: |
        (ADR-152) Full snapshot of the project's attached agents with
        summonability. Shaped identically to `now`/`needsYou`.
      required: [generatedAt, items]
      additionalProperties: false
      properties:
        generatedAt:
          type: string
          format: date-time
        items:
          type: array
          description: |
            Exactly the project's `agent_project_links` rows — `[]` when nothing
            is attached, never omitted.
          items:
            $ref: "#/components/schemas/ExtPulseAgentItem"

    ExtActivityPulseResponse:
      type: object
      description: Project-scoped assistant pulse.
      required: [happened, now, needsYou, agents]
      additionalProperties: false
      properties:
        happened:
          $ref: "#/components/schemas/ExtActivityHappenedBlock"
        now:
          $ref: "#/components/schemas/ExtActivityNowBlock"
        needsYou:
          $ref: "#/components/schemas/ExtActivityNeedsYouBlock"
        agents:
          $ref: "#/components/schemas/ExtActivityAgentsBlock"

    ExtRunActivityKind:
      type: string
      enum:
        [
          message,
          reasoning,
          tool_call,
          file_change,
          command,
          test,
          hitl,
          lifecycle,
          generic,
        ]

    ExtRunActivityItem:
      type: object
      description: One semantic assistant-safe item from a run activity feed.
      required: [id, lastMutationId, ts, runId, kind, salience, summary, action]
      additionalProperties: false
      properties:
        id:
          type: string
          description: Stable item identity within the run activity feed.
        lastMutationId:
          type: string
          description: Monotonic mutation horizon used for replay.
        ts:
          type: string
          format: date-time
          nullable: true
        runId:
          type: string
          format: uuid
        nodeId:
          type: string
          nullable: true
        kind:
          $ref: "#/components/schemas/ExtRunActivityKind"
        salience:
          $ref: "#/components/schemas/ExtActivitySalience"
        summary:
          type: string
        action:
          $ref: "#/components/schemas/ExtActivityAction"

    ExtRunActivityResponse:
      type: object
      description: Semantic assistant activity for one run.
      required: [items, nextSinceId, hasMore, now]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExtRunActivityItem"
        nextSinceId:
          type: string
          description: Opaque forward-only mutation horizon for the next poll.
        hasMore:
          type: boolean
          description: True when additional matching items remain after `nextSinceId`.
        now:
          $ref: "#/components/schemas/ExtActivityRunSnapshot"

    ExtRunSyncResult:
      type: object
      description: Result of an ext branch-sync operation (ADR-141).
      required: [runId, attemptId, outcome, behind, pushed]
      additionalProperties: false
      properties:
        runId:
          type: string
          minLength: 1
          description: |
            Echoes the requested run. NOT declared `format: uuid`, for the same
            reason as the request field above: the handler validates
            `z.string().min(1)` and resolves the run by lookup.
        attemptId:
          type: string
          description: |
            The `run_sync_attempts` row id for this attempt. NEVER null — a
            result exists only once the attempt row has been minted.
        outcome:
          type: string
          enum: [noop, synced, conflict, agent_launched]
          description: "`noop` = already up to date; `synced` = clean mechanical sync; `conflict` = aborted (agent=false); `agent_launched` = resolver session started."
        behind:
          type: integer
          description: |
            Commits the run branch was behind the target before the sync. NEVER
            null: it is measured before any decision is made, so every outcome
            (including the 202 `agent_launched` cut) carries the real count.
        pushed:
          type: boolean
          description: |
            Whether the branch was force-with-lease pushed. NEVER null — the
            push decision is resolved on every outcome.

    ReadinessDTO:
      type: object
      description: |
        Readiness roll-up for a run at the review chokepoint. Produced by
        `assertEvidenceReady` extended with `external_check` gate awareness.
      required:
        - readiness
        - externalGates
        - requiredArtifacts
        - reasons
      properties:
        readiness:
          type: string
          description: |
            Overall readiness verdict.
            - `ready` — all required gates passed, all required artifacts present and valid.
            - `blocked` — one or more external gates are `pending`, `failed`, or `stale`.
            - `stale` — previously ready but a downstream change made it stale.
            - `failed` — a required gate or artifact failed irrecoverably.
            - `waiting` — run has not yet reached the review chokepoint.
            - `overridden` — a human override cleared an otherwise-blocking gate; promotion is permitted.
          enum: [ready, blocked, stale, failed, waiting, overridden]
        externalGates:
          type: array
          items:
            type: object
            required: [gateId, status]
            properties:
              gateId:
                type: string
                description: Gate id from the flow manifest.
              status:
                type: string
                enum: [pending, passed, failed, stale, overridden, skipped]
              description:
                type: string
                nullable: true
                description: Gate description from `flow.yaml` `gates[].external.description`.
              externalRunUrl:
                type: string
                nullable: true
                description: URL of the external CI/CD run that reported this gate.
              commitSha:
                type: string
                nullable: true
                description: Commit SHA the last gate report was against.
        requiredArtifacts:
          type: array
          items:
            type: object
            required: [defId, kind, present, validity]
            properties:
              defId:
                type: string
                description: Artifact definition id from the flow manifest.
              kind:
                type: string
                description: Artifact kind.
              present:
                type: boolean
                description: Whether the artifact exists in the evidence index.
              validity:
                type: string
                nullable: true
                description: Validity state of the artifact, if present.
                enum: [current, stale, superseded, failed, skipped]
        reasons:
          type: array
          description: Human-readable reasons explaining the readiness verdict.
          items:
            type: string

    ExtCreateTaskBody:
      type: object
      required: [title, prompt]
      properties:
        title:
          type: string
          minLength: 1
        prompt:
          type: string
          minLength: 1
        flowId:
          type: string
          minLength: 1
          description: |
            ID of a `flows` row belonging to the project identified by the URL
            `slug`. Any other flow ID returns 422. (M34 — Implemented) OPTIONAL:
            a task created without `flowId` is a simple-intent task — it
            classifies as `unconfigured` (not launchable) until a triage
            verdict (`POST .../triage`) or a human fills the flow.
    ExtUpdateTaskBody:
      type: object
      description: |
        Partial update for a `Backlog` task. At least one field must be present.
        Fields absent from the body are left unchanged.
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
        prompt:
          type: string
          minLength: 1

    ExtLaunchRunBody:
      type: object
      required: [taskId]
      additionalProperties: false
      properties:
        taskId:
          type: string
          format: uuid
          description: |
            ID of a task owned by the token's project. The `projectId` is
            derived server-side from the task row and re-validated against the
            token's project before launchability is evaluated.
        runnerId:
          type: string
          minLength: 1
          description: |
            Optional per-launch platform ACP runner override. Highest priority
            in the fail-closed runner resolution chain.
        executorOverrideId:
          type: string
          minLength: 1
          deprecated: true
          description: |
            Legacy alias for `runnerId`. New external clients should send
            `runnerId`. The route refuses both fields when they conflict.
        baseBranch:
          type: string
          minLength: 1
          description: |
            (M18, Implemented) Optional base branch the run worktree is created
            from. Same semantics as the session-auth `POST /api/runs`
            `baseBranch`: server-validated against the project's branch
            allow-list before use as a git `startPoint` — unknown branch →
            `PRECONDITION` (409). Defaults to the project's `default_branch`.
        targetBranch:
          type: string
          minLength: 1
          description: |
            (M18, Implemented) Optional branch the run is promoted into after
            review. Server-validated against the same branch allow-list;
            unknown branch → `PRECONDITION` (409). Defaults to `baseBranch`.
            Promotion itself stays internal/UI-only in M18 — the external
            surface gains branch targeting on **launch** only.

    ExtGateReportBody:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [passed, failed]
          description: Outcome of the external check.
        externalRunUrl:
          type: string
          nullable: true
          description: |
            URL of the external CI/CD run or check suite that produced this
            report. Surfaced in `ReadinessDTO.externalGates[].externalRunUrl`.
        commitSha:
          type: string
          nullable: true
          description: |
            Commit SHA this report applies to. When `staleOnNewCommit` is set
            on the gate manifest config, a subsequent report with a different
            `commitSha` supersedes this one and re-stales the gate.
        summary:
          type: string
          nullable: true
          description: Human-readable summary of the check result.
        payload:
          type: object
          description: |
            Arbitrary structured payload from the external reporter (e.g. test
            counts, lint findings). Stored in the `test_report` artifact. Must
            be a JSON-serializable object when present.
          nullable: true
          additionalProperties: true

    ExtGateReportResponse:
      type: object
      required: [gateId, status, artifactId]
      properties:
        gateId:
          type: string
          description: The gate id that was updated.
        status:
          type: string
          enum: [passed, failed]
          description: The status the gate was set to.
        artifactId:
          type: string
          format: uuid
          description: ID of the `test_report` artifact created for this report.

    ExtHitlInboxItem:
      type: object
      description: |
        (0063 Implemented) Cross-project pending HITL item visible to a global
        personal-token owner. The route projects each item to EXACTLY these
        fields — web-internal inbox data (assignment/actor/agent/schema) never
        crosses this boundary. NEVER includes `acp_session_id`, absolute
        worktree paths, token material, or supervisor-internal handles.
      required:
        [projectId, projectSlug, runId, hitlRequestId, kind, title, createdAt]
      properties:
        projectId:
          type: string
          format: uuid
        projectSlug:
          type: string
        runId:
          type: string
          format: uuid
        hitlRequestId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            [
              permission,
              form,
              human,
              agent_question,
              infra_recovery,
              budget_breach,
              hook_trip,
            ]
          description: |
            Any pending HITL kind is surfaced, mirroring the web inbox —
            `permission`/`form` items are answerable via the run-scoped
            `hitl_list`/`hitl_respond` routes.
        title:
          type: string
          description: Human-readable prompt/title for inbox display.
        createdAt:
          type: string
          format: date-time

    ExtHitlRequestDTO:
      type: object
      description: |
        (M17) External projection of a pending HITL request. NEVER includes
        `acp_session_id`, absolute worktree paths, `token_hash`, or
        supervisor-internal handles.
      required:
        - hitlRequestId
        - stepId
        - kind
        - prompt
        - requestedAt
      properties:
        hitlRequestId:
          type: string
          format: uuid
        stepId:
          type: string
          description: The flow step/node id that raised this request.
        kind:
          type: string
          description: |
            Request kind. Project/agent/project-scoped user token actors may
            answer only `permission` and `form`; human-only kinds, including
            `agent_question`, require a
            global personal user token with exact `hitl:respond:human`.
          enum:
            [
              permission,
              form,
              human,
              agent_question,
              infra_recovery,
              budget_breach,
            ]
        prompt:
          type: string
          description: Prompt text shown to the responder.
        schema:
          type: object
          nullable: true
          description: |
            Form/decision schema the `response` is validated against, when the
            request carries one (`form` / `human`). Null for `permission`.
          additionalProperties: true
        options:
          type: array
          description: |
            Allowed options for a `permission` request (the supervisor's
            declared choices), each as an `{ optionId, label }` object. Always an
            array — empty (`[]`) for `form` / `human`, never null.
          items:
            type: object
            required:
              - optionId
              - label
            properties:
              optionId:
                type: string
              label:
                type: string
        criticality:
          type: string
          nullable: true
          description: |
            Flow-author-declared criticality of the request, when set on the
            `human` node/step. Null when undeclared. Annotation only — it does
            NOT re-gate readiness.
          enum: [low, medium, high, critical]
        requestedAt:
          type: string
          format: date-time
          description: When the request was created.

    ExtHitlRespondBody:
      type: object
      description: |
        (M17) HITL response payload. Supply `optionId` for a `permission`
        request, `response` for a `form` or `human` request, or the
        kind-specific option for `human` gates that use decision schemas.
        `infra_recovery` and `budget_breach` rows may be listed but are not
        externally respondable in ADR-125. Project/agent/project-scoped user
        tokens cannot answer human-only kinds; global personal tokens need exact
        `hitl:respond:human` for `human` and `agent_question`.
      properties:
        optionId:
          type: string
          minLength: 1
          description: |
            Required iff the HITL row has `kind == "permission"`. MUST match one
            of the supervisor-declared options.
        response:
          type: object
          description: |
            Required iff the HITL row has `kind == "form"`, a schema-backed
            `human`, or `agent_question` request. Validated against the row's `schema`
            (server-state, never body-trusted); 422 on failure.
          additionalProperties: true
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: |
            Optional responder self-reported certainty (`0..1`) for a `form`
            response. Bounded server-side; echoed into the stored
            `hitl_requests.response` jsonb and written to
            `hitl_requests.human_confidence`. Ignored for `permission`.

    ExtHitlRespondResponse:
      type: object
      required: [ok, runStatus]
      description: |
        (M17) Result of an ext HITL response. Mirrors the session route — the
        runner (not this route) owns the `NeedsInput → Running` transition.
        (ADR-136 Implemented) a human answer to `agent_question` returns the
        terminal source `runStatus: Done`; it writes no artifact and never
        resumes ACP.
      properties:
        ok:
          type: boolean
          enum: [true]
        runStatus:
          type: string
          enum: [NeedsInput, Done]
          description: Row state at response time.
        state:
          type: string
          enum: [resume-in-progress]
          description: Present only on the 202 idle-resume branch.

    FormSchemaV1:
      type: object
      description: Existing MAIster `formSchemaSchema` grammar; validated again by `validateFormSchemaVersion`.
      required: [schemaVersion, fields]
      additionalProperties: true
      properties:
        schemaVersion: { type: integer, minimum: 1 }
        fields:
          type: array
          items: { $ref: "#/components/schemas/FormFieldV1" }
    FormFieldV1:
      type: object
      required: [name, type]
      additionalProperties: true
      properties:
        name: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
        type:
          { type: string, enum: [string, number, boolean, enum, array, object] }
        required: { type: boolean }
        default: {}
        options:
          type: array
          items: { type: string }
        fields:
          type: array
          items: { $ref: "#/components/schemas/FormFieldV1" }
    ExtHumanAskBody:
      type: object
      required: [question, schema]
      additionalProperties: false
      properties:
        question: { type: string, minLength: 1, maxLength: 10000 }
        schema: { $ref: "#/components/schemas/FormSchemaV1" }
        reTriggerMode:
          type: string
          enum: [agent, triage]
          default: agent
          description: "triage is accepted only for the server-recognized core:triager agent."
    ExtHumanAskResponse:
      type: object
      required: [hitlRequestId, taskId, sourceRunId, activationState]
      additionalProperties: false
      properties:
        hitlRequestId: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        sourceRunId: { type: string, format: uuid }
        activationState:
          type: string
          enum: [pending_termination, active, failed]

    ExtDelegationTarget:
      type: object
      description: |
        (M37 — Implemented, ADR-098) The catalog-resolved child to spawn. Exactly
        one of `agentId` / `flowId` is supplied; both are body-controlled and
        resolved through the project's enabled + trusted catalog (pinned
        revision). A target not resolvable through that catalog is refused
        (`PRECONDITION` → 409); no child run is created.
      additionalProperties: false
      properties:
        agentId:
          type: string
          minLength: 1
          description: Package-qualified platform-agent id (`<flowRefId>:<stem>`).
        flowId:
          type: string
          minLength: 1
          description: Flow id, resolved against the project's enabled flows.

    ExtRunDelegateBody:
      type: object
      description: |
        (M37 — Implemented, ADR-098) `run_delegate` payload. `projectId` and the
        parent `runId` are token-derived, never carried here.
      required: [target, mode, prompt]
      additionalProperties: false
      properties:
        target:
          $ref: "#/components/schemas/ExtDelegationTarget"
        mode:
          type: string
          enum: [task, run]
          description: |
            `task` = child task (`parent_of` Kanban card) + child run; `run` =
            child run only (`runs.parent_run_id`, no board card).
        prompt:
          type: string
          minLength: 1
          description: Free-text prompt handed to the child unit.
        title:
          type: string
          minLength: 1
          description: Optional title for the child task (used only for `mode == "task"`).
        workspace:
          type: string
          enum: [none, repo_read, worktree]
          description: |
            Workspace axis for the child run (M34). Defaults to the resolved
            definition's recommended workspace when omitted.
        workspaceMode:
          type: string
          enum: [own, shared]
          description: |
            (M37 — ADR-099) Worktree allocation mode for a
            `workspace: worktree` child. `own` (default) = a per-run worktree;
            `shared` = all children of this orchestrator tree share one
            pre-allocated tree with serialized writers (one active writer per
            tree). `shared` requires a delegated child (a `rootRunId`); a top-level
            run is refused with `CONFIG`. A `shared` writable tree is ONE branch =
            ONE Review = ONE tree-level promote that settles all shared siblings
            (Implemented — ADR-102, via `POST /api/v1/ext/runs/promote`); ADR-102
            supersedes ADR-099 §4's launch gate for shared writable worktrees.
        persistent:
          type: boolean
          description: |
            (M37 Phase 8 — ADR-099) Spawn a PERSISTENT addressable swarm member
            that parks (`NeedsInputIdle`, ACP session retained) between turns
            instead of running to terminal; re-message it via `run_message` by its
            `addressableKey`. Requires `addressableKey`.
        addressableKey:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._-]+$"
          description: |
            (M37 Phase 8 — ADR-099) Stable key, unique within the orchestrator
            tree (`root_run_id`), used to address a persistent child via
            `run_message`. Required when `persistent` is true.
        runnerOverride:
          type: string
          minLength: 1
          description: |
            Optional per-launch platform ACP runner override; highest priority in
            the fail-closed runner resolution chain. Snapshotted onto the child
            run's `runner_snapshot`.

    ExtRunPlanTask:
      type: object
      description: |
        (M37 — Implemented, ADR-098) One node of a submitted task DAG. `key` is the
        in-batch identifier referenced by other tasks' `dependsOn`.
      required: [key, target, prompt, dependsOn]
      additionalProperties: false
      properties:
        key:
          type: string
          minLength: 1
          description: |
            In-batch unique key. Referenced by other tasks' `dependsOn`; not
            persisted as the task identity (the task gets its own `KEY-N`).
        target:
          $ref: "#/components/schemas/ExtDelegationTarget"
        prompt:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
          description: |
            Optional title for the created task; defaults to the prompt's first
            line when omitted.
        workspace:
          type: string
          enum: [none, repo_read, worktree]
          description: Optional workspace axis for the task's run.
        runnerOverride:
          type: string
          minLength: 1
          description: Optional per-launch runner override.
        dependsOn:
          type: array
          description: |
            In-batch `key`s this task `requires`. Validated acyclic and
            in-batch BEFORE the transaction (cross-batch/unknown ref →
            `PRECONDITION` → 409; cycle → `CONFIG` → 422). `requires` releases a
            dependent only on the producer's `Done`.
          items:
            type: string
            minLength: 1

    ExtRunPlanBody:
      type: object
      description: |
        (M37 — Implemented, ADR-098) `run_plan` payload. `projectId` and the parent
        `runId` are token-derived. The batch size is bounded by
        `MAISTER_MAX_ORCHESTRATOR_FANOUT`.
      required: [tasks]
      additionalProperties: false
      properties:
        tasks:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ExtRunPlanTask" }

    ExtRunPlanResultItem:
      type: object
      description: |
        (M37 — Implemented, ADR-098) Per-task result of a submitted DAG. `childRunId`
        is present only for a task that was immediately launchable (its
        dependencies were already clear) and folded into `promoteNextPending`.
      required: [key, taskId]
      additionalProperties: false
      properties:
        key:
          type: string
          description: The submitted in-batch key, echoed back.
        taskId:
          type: string
          format: uuid
          description: The created task's id.
        childRunId:
          type: string
          format: uuid
          description: Present only when the task was immediately launchable.

    ExtRunCollectBody:
      type: object
      description: |
        (M37 — Implemented, ADR-098) `run_collect` selector. Exactly one of
        `childRunId` / `all` MUST be supplied.
      additionalProperties: false
      properties:
        childRunId:
          type: string
          format: uuid
          description: Collect one named child (must be a child of the caller).
        all:
          type: boolean
          description: Collect every child of the calling orchestrator.

    ExtChildRunSummary:
      type: object
      description: |
        (M37 — Implemented, ADR-098) Terminal-result summary for one orchestrator
        child. `artifacts` is the produced-artifact manifest from
        `artifact_instances`; `diffRef` locates the base→run diff. NEVER exposes
        the child worktree, `acp_session_id`, or any supervisor-internal handle.
      required: [childRunId, status, artifacts]
      additionalProperties: false
      properties:
        childRunId:
          type: string
          format: uuid
        status:
          type: string
          description: |
            The child's run status (a run-status string per the run state
            machine; a nested orchestrator child may be `WaitingOnChildren`).
        outputText:
          type: string
          nullable: true
          description: |
            The child's terminal stdout var (`{{ steps.<id>.output }}`), when
            available.
        artifacts:
          type: array
          description: Produced-artifact manifest for the child run.
          items:
            type: object
            required: [id, kind, name]
            additionalProperties: false
            properties:
              id:
                type: string
                format: uuid
              kind:
                type: string
                description: Artifact kind.
              name:
                type: string
                description: Artifact name / locator label.
        diffRef:
          type: string
          nullable: true
          description: Opaque ref locating the child's base→run diff (never the worktree).

    ExtRunCancelBody:
      type: object
      description: |
        (M37 — Implemented, ADR-098) `run_cancel` payload. `childRunId` must be a
        child of the calling orchestrator.
      required: [childRunId]
      additionalProperties: false
      properties:
        childRunId:
          type: string
          format: uuid
