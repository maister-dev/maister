    ExtActivityRunSnapshot:
      type: object
      description: One run snapshot used by the pulse and per-run activity response. The project pulse reports only active runs; the per-run route may return non-active statuses with `liveness.state = inactive`.
      required: [runId, runKind, status, liveness]
      additionalProperties: false
      properties:
        runId:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
          nullable: true
        taskKey:
