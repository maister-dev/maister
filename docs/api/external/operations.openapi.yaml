    ExtPulseEventKind:
      type: string
      enum:
        - task.created
        - task.comment_added
        - task.triage_requeued
        - task.clarification_answered
        - run.done
        - run.failed
        - run.crashed
        - run.abandoned
        - run.review
        - run.escalated
        - gate.failed

    ExtActivityPulseItem:
      type: object
      description: One persisted project fact replayed through the assistant pulse.
      required: [id, ts, kind, salience, summary, action]
      additionalProperties: false
      properties:
        id:
          type: string
          description: Opaque fact identifier returned as part of the pulse cursor progression.
        ts:
          type: string
          format: date-time
        kind:
          $ref: "#/components/schemas/ExtPulseEventKind"
        salience:
          $ref: "#/components/schemas/ExtActivitySalience"
        summary:
          type: string
        action:
          $ref: "#/components/schemas/ExtActivityAction"
        runId:
