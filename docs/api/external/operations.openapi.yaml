        currentStepId:
          type: string
          nullable: true
        currentAttemptNumber:
          type: integer
          minimum: 1
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        lastAction:
          allOf:
            - $ref: "#/components/schemas/ExtActivityLastAction"
