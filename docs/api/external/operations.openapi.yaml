openapi: 3.0.3
info:
  title: MAIster External Operations API
  version: "1.0.0"
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: |
    Token-authenticated external surface for MAIster (M16). All routes are
    under `/api/v1/ext/` and require a bearer token issued via the
    token-management routes in `docs/api/web.openapi.yaml`. Tokens may be
    project-bound (`project_id` set) or global personal user tokens
    (`project_id = NULL`, Implemented by 0063).

    **Security model.** Every call is authenticated by the `projectToken`
    bearer scheme. The token is 256-bit random (`mai_` + base64url(32 bytes)),
    stored as sha256 at rest, looked up by prefix, and compared with
    `timingSafeEqual`. Token failure kinds map to 401. Project-bound tokens
    must match the addressed project. Global personal user tokens derive the
    target project from URL/server-state, load the owner account, require the
    owner to be active and password-clear, and authorize through current
    project membership/global admin. Cross-project or inaccessible-project
    access hides existence (404). Every route enforces its scope label unless
    the token holds `*`; `*` does not satisfy exact-only
    `hitl:respond:human`.

    **Audit.** Every call writes a `token_audit_log` row. The gate-report
    endpoint writes the success audit row inside the same database transaction
    as the gate update and artifact; failure-path audit rows are written after
    and do not mutate gate or artifact state.

    **DTO policy.** Response DTOs NEVER include `acp_session_id`, absolute
    worktree paths, `token_hash`, or supervisor-internal handles.

    See also:
      - [`../web.openapi.yaml`](../web.openapi.yaml) — token-management routes and session-auth surface
      - [`../../decisions.md`](../../decisions.md) — ADR-045, ADR-046, ADR-047

    **Milestone status: M16 (Implemented), as of 2026-06-02.**

    **ADR-137 (Implemented) restriction.** External HITL list endpoints omit
    `decision_request`; a direct external response to one returns `403
    UNAUTHORIZED` without mutation. Typed Plan decisions are session-auth-only.

servers:
  - url: "{origin}"
    description: |
      Origin (scheme + host, no trailing path) of the MAIster deployment; for
      local development this is `http://localhost:3000`.
    variables:
      origin:
        default: http://localhost:3000
        description: Scheme and host of the MAIster deployment.

security:
  - projectToken: []

tags:
  - name: tasks
    description: Project task management via token auth.
  - name: runs
    description: Run launch and status via token auth.
  - name: readiness
    description: Run readiness check via token auth.
  - name: gates
    description: External gate report submission via token auth.
  - name: hitl
    description: |
      Human-in-the-loop list + respond via token auth (M17, 0063 Implemented).
      Run-scoped list enforces `hitl:read`; cross-project personal inbox
      enforces `hitl:inbox:read`; permission/form responses enforce
      `hitl:respond`; human responses require a global personal user token with
      exact `hitl:respond:human`. (ADR-136 Implemented) an attached agent with
      exact `hitl:request` may create a task-bound `agent_question`; only a
      session responder or a global personal user token with exact
      `hitl:respond:human` may answer it. `infra_recovery` and `budget_breach`
      responses remain session-auth-only in ADR-125 and are not opened to
      external token actors. ADR-137 Implemented `decision_request` rows are
      omitted from external list projections and always reject external answer
      attempts with `403 UNAUTHORIZED`.
  - name: comments
    description: |
      (ADR-078, Implemented) Task comment list + create via token auth. The
      routes enforce `comments:read` / `comments:create` or `*` and call the
      SAME `addTaskComment` / `listTaskComments` domain functions as the
      session-auth routes — no parallel write path.
  - name: discovery
    description: |
      (ADR-112, Implemented) Read-only catalog discovery for an agent verdict —
      the project's launchable flows (`flows:read`) and enabled platform ACP
      runners (`runners:read`). Backs the triager's `flow_list` / `runner_list`
      MCP tools so it can only assign flows/runners that will actually launch.
  - name: memory
    description: |
      (ADR-122/127/128) Project Brain operations exposed to project/global
      tokens and mirrored by the MCP facade. Recall returns the implemented
      owned/indexed union; clusters and proposals are implemented Sub-project C
      contracts.
  - name: agent-memory
    description: |
      (ADR-152) Per-attachment agent memory — a single `memory.md` per
      `(agent, project)` that the agent reads at launch and rewrites through a
      content-hash CAS. A SEPARATE store from Project Brain: the
      `agent_memory:write` scope and the `agent_project_links.memory_enabled`
      flag gate it, and neither `memory:read`/`memory:write` nor
      `can_read_brain`/`can_write_brain` grants it.
  - name: evaluations
    description: |
      (ADR-145, Implemented) Evaluation Lab evaluator facade. A judge attempt runs
      as a dedicated workspace:none agent Run with an attempt-bound token carrying
      only `evaluations:context:read` / `evaluations:evidence:read` /
      `evaluations:objective:read` / `evaluations:result:submit`. Every route is
      token-bound: the judge attempt, execution, evidence snapshot, and method are
      derived server-side from the token, so the request carries no study/run/
      snapshot/participant id and the response exposes no real participant id, peer
      judge result, host path, or session handle (D10/D12). A judge can browse
      nothing, mutate no task/comment, and submit exactly one result.

paths:
  /api/v1/ext/projects/{slug}/tasks:
    post:
      tags: [tasks]
      summary: Create a task on a project board
      description: |
        Scope `tasks:create`. Creates a task in `Backlog` on the project
        identified by `slug`. The `projectId` is derived server-side from the
        URL slug and compared against the token's project — mismatch → 404.

        Validates that `flowId` belongs to the project — accepted as either the
        `flows.id` UUID or the project's `flows.flow_ref_id`, both resolving to
        the same flow (the resolved UUID is persisted). The check returns 422 on
        failure, naming the expected forms, the received value, and the
        project's valid refs.

        Writes a `token_audit_log` row with scope `tasks:create` after success.
      operationId: extCreateTask
      security:
        - projectToken: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtCreateTaskBody" }
      responses:
        "201":
          description: Task created in `Backlog`.
          content:
            application/json:
              schema:
                type: object
                required: [taskId]
                properties:
                  taskId:
                    type: string
                    format: uuid
        "401":
          $ref: "#/components/responses/TokenUnauthorized"
        "403":
          $ref: "#/components/responses/HitlForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/EmbeddingUnavailable"

    get:
      tags: [tasks]
      summary: List tasks on a project board
      description: |
        Scope `tasks:read`. Returns all tasks for the project identified by
        `slug`. The `projectId` is derived server-side from the URL slug and
        compared against the token's project — mismatch → 404.

        Writes a `token_audit_log` row with scope `tasks:read` after success.
      operationId: extListTasks
      security:
        - projectToken: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Task list.
          content:
            application/json:
              schema:
                type: object
                required: [tasks]
                properties:
                  tasks:
                    type: array
                    items: { $ref: "#/components/schemas/TaskDTO" }
        "401":
          $ref: "#/components/responses/TokenUnauthorized"
        "403":
          $ref: "#/components/responses/HitlForbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/ext/projects/{slug}/tasks/{taskId}:
    get:
      tags: [tasks]
      summary: Get a single task
      description: |
        Scope `tasks:read`. Returns the task identified by `taskId` on the
        project identified by `slug`. The `projectId` is derived server-side
        from the URL slug and compared against the token's project — mismatch
        → 404. `taskId` ownership is re-validated against the token's project.

        Writes a `token_audit_log` row with scope `tasks:read` after success.
      operationId: extGetTask
      security:
        - projectToken: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Task detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskDTO" }
        "401":
          $ref: "#/components/responses/TokenUnauthorized"
        "403":
          $ref: "#/components/responses/HitlForbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [tasks]
      summary: Update a task (Backlog-only fields)
      description: |
        Scope `tasks:update`. Updates `title` and/or `prompt` on a task in
        `Backlog` status. Fields not present
        in the body are left unchanged. The `projectId` is derived server-side;
        `taskId` ownership is re-validated against the token's project.

        Returns the full updated `TaskDTO` on success. Writes a
        `token_audit_log` row with scope `tasks:update` after success.
      operationId: extUpdateTask
      security:
        - projectToken: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtUpdateTaskBody" }
      responses:
        "200":
          description: Updated task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskDTO" }
        "401":
          $ref: "#/components/responses/TokenUnauthorized"
        "403":
          $ref: "#/components/responses/HitlForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/ext/projects/{slug}/tasks/{taskId}/comments:
    get:
      tags: [comments]
      summary: (ADR-078, Implemented) List comments on a task
      description: |
        Scope `comments:read`. Returns comments for the task identified by
        `taskId` on the project identified by `slug`, ascending by
        `created_at`. The `projectId` is derived server-side from the URL
        slug and compared against the token's project — mismatch → 404;
        `taskId` ownership is re-validated against the same project
        (existing ext idiom). Bodies are returned as stored: markdown with
        `KEY-N` mentions already expanded at write time.

        Calls the same `listTaskComments` domain function as the
        session-auth route. Writes a `token_audit_log` row with scope
        `comments:read` after success.
      operationId: extListTaskComments
      security:
        - projectToken: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Comment list (ascending `created_at`).
          content:
            application/json:
              schema:
                type: object
                required: [comments]
                properties:
                  comments:
                    type: array
                    items: { $ref: "#/components/schemas/CommentDTO" }
        "401":
          $ref: "#/components/responses/TokenUnauthorized"
        "403":
          $ref: "#/components/responses/HitlForbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      tags: [comments]
      summary: (ADR-078, Implemented) Add a comment to a task
      description: |
        Scope `comments:create`. Adds a markdown comment through the SAME
        `addTaskComment` domain pipeline as the session-auth route (ONE
        transaction: mention expansion → comment insert → activity →
        subscription upserts → inbox fanout).

        Actor mapping (ADR-078 D12, extended by ADR-089): the actor comes
        from `socialActorForToken` — an **agent token** acts as
        `('agent', agentId)`, a user-owned token as `('user', ownerUserId)`,
        and an ownerless project token as `('system', NULL)` with
        `{via: 'ext', tokenId}` recorded in the comment-activity payload.
        (Earlier revisions of this spec documented only user/system; agent
        tokens have written `actor.type = "agent"` since M34.)

        (ADR-151, Implemented) `@<agentId>` handles in the body resolve at write
        time exactly as on the session-auth route and are echoed back in
        `mentionedAgents`. An agent MUST NEVER summon itself: a mention whose
        resolved id equals this token's own `agentId` still expands in the
        body but never launches.

        Writes a `token_audit_log` row with scope `comments:create` inside
        the same transaction (success-audit-in-work, ext idiom).
      operationId: extCreateTaskComment
      security:
        - projectToken: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtCreateCommentBody" }
      responses:
        "201":
          description: Comment created; stored body has mentions expanded.
          content:
            application/json:
              schema:
                type: object
                required: [comment]
                properties:
                  comment: { $ref: "#/components/schemas/CommentDTO" }
                  mentionedAgents:
                    type: array
                    description: |
                      (ADR-151, Implemented) Agent handles that RESOLVED in this
                      body, with their write-time summonability. Omitted
                      entirely when no handle resolved.
                    items: { $ref: "#/components/schemas/MentionedAgentDTO" }
        "401":
          $ref: "#/components/responses/TokenUnauthorized"
        "403":
          $ref: "#/components/responses/HitlForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/ext/projects/{slug}/tasks/{taskId}/triage:
    post:
      summary: (M34 — Implemented; ADR-112 flag/enqueue — Implemented) Submit a triage verdict
      description: |
        Scope `tasks:triage`. The triager's verdict op — ONE transactional
        update of the task's launch-verdict fields plus the triage-status
        stamp. At least one body field is required; every provided field is
        validated against server state (`flowId` ∈ project flows — the
        `flows.id` UUID **or** the project's `flows.flow_ref_id`, `runnerId`
        ∈ enabled runner catalog, `promotionMode` ∈ enum, `targetBranch` =
        git ref-name shape). Records a `triage_set` activity entry carrying
        the payload. Writes a `token_audit_log` row with scope `tasks:triage`;
        agent tokens record `actor_label = agent:<id>` and the activity
        actor is the polymorphic `agent` pair (ADR-083).

        **Verdict path (default).** A verdict body (`flowId` / `runnerId` /
        `baseBranch` / `targetBranch` / `promotionMode`) sets
        `tasks.triage_status = 'triaged'`; the task becomes launchable.

        **(ADR-112, Implemented) `flag` — hand to a human.** When `flag: true`,
        the task is marked `tasks.triage_status = 'flagged'` (held — NOT
        launchable; the board shows a "needs review" chip). `flag` is
        **mutually exclusive** with the verdict fields (`flowId` / `runnerId` /
        `baseBranch` / `targetBranch` / `promotionMode`): sending `flag`
        alongside any verdict field is refused 422 `CONFIG`. `flag: true` alone
        is a valid body (the "≥1 field" rule is still met).

        **(ADR-112, Implemented) `enqueue` — auto-launch after triage.** When
        `enqueue: true`, the task's enqueue intent is set
        (`tasks.launch_mode = 'auto'`) so the `auto_launch_triaged` scheduler
        tick launches it once it is launchable (dependencies cleared, global
        cap permitting). `enqueue` is valid ONLY alongside a verdict that
        yields a `flowId` (an existing `tasks.flow_id` or a `flowId` in this
        body); `enqueue` with no resolvable flow, or together with `flag`, is
        refused 422 `CONFIG`. The triager never launches directly — the tick
        performs the launch through the standard precondition choke point.

        **Write-side launchability re-validation (ADR-112, Implemented).** When a
        verdict carries a `flowId` (most relevant with `enqueue`), the flow's
        enablement + trust are re-validated (`enablementState ∈ {Enabled,
        UpdateAvailable}` ∧ `trustStatus ≠ untrusted`); a disabled / untrusted
        / pin-divergent flow is refused 422 `CONFIG` rather than stamped
        `triaged` + `auto` and left to stall the tick.
      operationId: extTriageTask
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - {
            name: taskId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtTriageBody" }
            examples:
              verdict:
                summary: Verdict only — flow + runner, task becomes launchable
                value:
                  flowId: "bugfix"
                  runnerId: "claude-code"
                  targetBranch: "main"
                  promotionMode: "local_merge"
              flag-only:
                summary: (ADR-112) Flag for human review — no verdict fields
                value:
                  flag: true
              verdict-enqueue:
                summary: (ADR-112) Verdict + auto-enqueue after triage
                value:
                  flowId: "bugfix"
                  runnerId: "claude-code"
                  enqueue: true
      responses:
        "200":
          description: |
            Triage applied. `triageStatus` is `triaged` for a verdict body or
            `flagged` for a `flag: true` body.
          content:
            application/json:
              schema:
                type: object
                required: [ok, triageStatus]
                properties:
                  ok: { type: boolean }
                  triageStatus: { type: string, enum: [triaged, flagged] }
        "401": { $ref: "#/components/responses/TokenUnauthorized" }
        "403": { $ref: "#/components/responses/HitlForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: |
            Request body failed schema validation, or a `CONFIG` precondition
            was violated (ADR-112, Implemented) — `flag` sent with a verdict field
            (mutually exclusive), `enqueue` with no resolvable `flowId` (or with
            `flag`), a verdict `flowId` matching neither `flows.id` nor the
            project's `flows.flow_ref_id` (the message names the expected forms,
            the received value, and the project's valid refs), or a verdict
            `flowId` that is disabled / untrusted / pin-divergent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtErrorBody" }
  /api/v1/ext/projects/{slug}/tasks/{taskId}/relations:
    get:
      summary: (M34 — Implemented) List a task's typed relations
      description: |
        Scope `relations:read`. Returns every relation touching the task,
        with the canonical direction resolved into a per-row `role`
        (`from` = the URL task is the relation's from-end). Inverse labels
        are render-time concerns; the wire carries the canonical kind.
      operationId: extListTaskRelations
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - {
            name: taskId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        "200":
          description: Relations touching the task.
          content:
            application/json:
              schema:
                type: object
                required: [relations]
                properties:
                  relations:
                    type: array
                    items: { $ref: "#/components/schemas/ExtRelationView" }
        "401": { $ref: "#/components/responses/TokenUnauthorized" }
        "403": { $ref: "#/components/responses/HitlForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: (M34 — Implemented) Add a typed relation from this task
      description: |
        Scope `relations:create`. Mirrors the web route: creates the
        canonical one-direction relation `(from = URL task, kind, to)`.
        `toNumber` is resolved STRICTLY within the URL-param project via
        `(project_id, number)` — that arm cannot reach another project.
        Duplicates are idempotent no-ops. The relation actor is token-derived
        (`agent` for agent tokens).

        **(Implemented — ADR-155) Cross-project targets.** The alternative
        `toTaskKey` addresses the counterpart by its platform-unique `KEY-N`
        and MAY resolve to a task in a different project. `task_relations`
        rows stay owned by the FROM-end project; only the to-end may differ.
        Authorization is dual: `handleExt` authorizes the URL-param project,
        and the RESOLVED TARGET project is authorized separately for
        `manageTaskRelations`. A **project-bound** token
        (`token.project_id IS NOT NULL`, not reach-granted) is refused **403**
        on a cross-project target; a NULL-project user token is re-checked
        against the owner's RBAC on both ends. Relations may cross projects,
        but the automation driven by them (auto-launch, abandon cascade) stays
        same-project.
      operationId: extAddTaskRelation
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - {
            name: taskId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtRelationOpBody" }
            examples:
              sameProjectByNumber:
                summary: This task blocks task 5 of the same project
                value: { kind: blocks, toNumber: 5 }
              crossProjectByKey:
                summary: (Implemented — ADR-155) This task depends on API-42
                value: { kind: depends_on, toTaskKey: "API-42" }
              successGatedRequires:
                summary: (Implemented — ADR-155) Success-gated `requires` edge
                value: { kind: requires, toTaskKey: "API-42" }
      responses:
        "201":
          description: Relation created (or already existed).
          content:
            application/json:
              schema:
                type: object
                required: [ok, created]
                properties:
                  ok: { type: boolean }
                  created: { type: boolean }
        "401": { $ref: "#/components/responses/TokenUnauthorized" }
        "403":
          description: |
            Access refused (`UNAUTHORIZED`). The shared
            `HitlForbidden` cases apply (missing scope, wrong token kind), plus
            **(Implemented — ADR-155)** a project-bound token whose `toTaskKey`
            resolves to a task in a DIFFERENT project, and a NULL-project user
            token whose owner lacks `manageTaskRelations` on the resolved
            target project.

            This arm is deliberately **403, not the existence-hiding 404**
            used elsewhere for project scoping: the caller supplied a
            platform-unique key it already holds, so hiding existence would
            leak nothing and would make the refusal unactionable. The failure
            path writes its own `token_audit_log` row before responding.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtErrorBody" }
        "404":
          description: |
            Task not found in the URL-param project, or the token's project
            does not own it (existence-hidden). **(Implemented — ADR-155)** Also
            returned when `toTaskKey` resolves to nothing (unknown key or
            unknown number) or resolves into an ARCHIVED project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtErrorBody" }
        "409":
          description: |
            (ADR-121) The gating-kind (`blocks`/`depends_on`/`requires`)
            relation would close a dependency cycle (`CONFLICT`), evaluated
            inside the insert transaction. **(Implemented — ADR-155)** The cycle
            check is platform-global and serialized by ONE platform-wide
            advisory lock (a per-project lock cannot see a cycle whose edges
            are spread over four projects), and it also refuses `CONFLICT`
            when the traversal exceeds its node bound.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtErrorBody" }
        "422":
          description: |
            Request body failed schema validation (`CONFIG`) — including
            **(Implemented — ADR-155)** supplying BOTH `toNumber` and `toTaskKey`,
            or NEITHER (exactly one is required), and a `toTaskKey` that does
            not match `^[A-Za-z][A-Za-z0-9]*-[0-9]+$`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtErrorBody" }
    delete:
      summary: (M34 — Implemented) Remove a typed relation from this task
      description: |
        Scope `relations:delete`. Removes the canonical relation
        `(from = URL task, kind, to)`. Same body shape as create (mirrors
        the web `deleteTaskRelation`). Missing relation is an idempotent
        no-op (`removed: false`).

        **(Implemented — ADR-155)** `toTaskKey` and the `requires` kind are
        accepted here on the same terms as on POST — the body schema is
        shared. Removal is the half that closes a real hole: `requires` is
        success-gated and never releases on `Abandoned`/`Failed`, so before
        this change an orchestrator-minted `requires` edge could not be
        undone over ext/MCP at all. The dual authorization and the 403
        project-bound refusal below are identical to POST.

        **(Implemented — ADR-156)** An AGENT token acting ACROSS a project
        boundary through the cross-project reach grant may remove only edges
        it authored itself (`actor_type='agent'` and `actor_id` = the calling
        agent). The constraint rides the DELETE's own predicate, so a refused
        removal is reported as the ordinary idempotent `removed: false` and
        stays indistinguishable from a missing relation — an outside agent
        never learns whether the edge exists. Same-project agent tokens and
        user tokens are unaffected.
      operationId: extRemoveTaskRelation
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - {
            name: taskId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtRelationOpBody" }
            examples:
              sameProjectByNumber:
                summary: Drop the `blocks` edge onto task 5
                value: { kind: blocks, toNumber: 5 }
              crossProjectRequires:
                summary: (Implemented — ADR-155) Undo a wedged `requires` onto API-42
                value: { kind: requires, toTaskKey: "API-42" }
      responses:
        "200":
          description: Removal outcome.
          content:
            application/json:
              schema:
                type: object
                required: [ok, removed]
                properties:
                  ok: { type: boolean }
                  removed: { type: boolean }
        "401": { $ref: "#/components/responses/TokenUnauthorized" }
        "403":
          description: |
            Access refused (`UNAUTHORIZED`) — the shared `HitlForbidden`
            cases, plus **(Implemented — ADR-155)** a project-bound token whose
            `toTaskKey` resolves into a different project, and a NULL-project
            user token whose owner lacks `manageTaskRelations` on the resolved
            target project. Deliberately 403 rather than the existence-hiding
            404, for the reason given on POST. Audited before responding.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtErrorBody" }
        "404":
          description: |
            Task not found in the URL-param project, or the token's project
            does not own it (existence-hidden). **(Implemented — ADR-155)** Also
            returned when `toTaskKey` resolves to nothing or resolves into an
            ARCHIVED project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtErrorBody" }
        "422":
          description: |
            Request body failed schema validation (`CONFIG`) — including
            **(Implemented — ADR-155)** supplying BOTH `toNumber` and `toTaskKey`,
            or NEITHER, and a malformed `toTaskKey`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtErrorBody" }

  /api/v1/ext/projects/{slug}/flows:
    get:
      tags: [discovery]
      summary: (ADR-112, Implemented) List the project's launchable flows
      description: |
        Scope `flows:read`. Returns the flows of every package attached to the
        project identified by `slug`, projected to the routing metadata a
        triager matches against (`metadata.route_when` / `summary` / `title` /
        `labels`). The `projectId` is derived server-side from the URL slug and
        compared against the token's project — mismatch → 404.

        **Launchable-only projection.** This route returns ONLY flows the
        triager may actually assign: `enablementState ∈ {Enabled,
        UpdateAvailable}` ∧ `trustStatus ≠ untrusted`. Disabled, pin-divergent,
        and untrusted flows are omitted, so a verdict built from this list can
        never stall an `enqueue` on an unlaunchable flow (the write-side
        `triage_set` re-validates the same enablement + trust and returns 422
        `CONFIG` otherwise).

        Writes a `token_audit_log` row with scope `flows:read` after success.
      operationId: extListProjectFlows
      security:
        - projectToken: ["flows:read"]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Launchable flows for the project.
          content:
            application/json:
              schema:
                type: object
                required: [flows]
                properties:
                  flows:
                    type: array
                    items: { $ref: "#/components/schemas/ExtFlowSummary" }
        "401":
          $ref: "#/components/responses/TokenUnauthorized"
        "403":
          $ref: "#/components/responses/HitlForbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/ext/projects/{slug}/runners:
    get:
      tags: [discovery]
      summary: (ADR-112, Implemented) List enabled platform ACP runners
      description: |
        Scope `runners:read`. Returns the enabled platform ACP runners a
        triager may pick for a verdict — `id`, `adapter`, `model`,
        `capabilityAgent`, `readinessStatus`. Runners are **platform-scoped**,
        not project-scoped: the URL `slug` is used only for auth/scope
        enforcement (cross-project or inaccessible project → 404), and the
        returned set is the global enabled-runner catalog (`enabled = true`),
        not filtered by project.

        Writes a `token_audit_log` row with scope `runners:read` after success.
      operationId: extListProjectRunners
      security:
        - projectToken: ["runners:read"]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Enabled platform ACP runners.
          content:
            application/json:
              schema:
                type: object
                required: [runners]
                properties:
                  runners:
                    type: array
                    items: { $ref: "#/components/schemas/ExtRunnerSummary" }
        "401":
          $ref: "#/components/responses/TokenUnauthorized"
        "403":
          $ref: "#/components/responses/HitlForbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/ext/evaluations/context:
    get:
      tags: [evaluations]
      summary: (ADR-142, Implemented) Get the token-bound judge attempt context
      description: |
        Scope `evaluations:context:read`. Returns the server-derived judge
        attempt context — attempt identity, the method rubric, the blind
        candidate order, and evidence/digest summary. The judge attempt is bound
        by the token; the request carries no ids and the response exposes no real
        participant id, peer judge result, host path, or session handle (D10). A
        token not bound to a live judge attempt returns 403 `UNAUTHORIZED`; a
        terminal attempt returns 409.

        **(ADR-147/150) Pairwise attempts:** `match` maps the attempt's match
        sides to blinded candidate labels — the submitted `winner` pick refers
        to `match.a`/`match.b`, never to candidate list position. `candidates`
        and the evidence summary are scoped to the pair under comparison
        (shared, participant-less items stay visible). A pairwise attempt whose
        match side has no captured evidence in the bound snapshot is refused
        with 409 (`PRECONDITION`) — never served half-blind. `match` is null
        for a scalar attempt.
      operationId: extEvaluationContext
      security:
        - projectToken: ["evaluations:context:read"]
      responses:
        "200":
          description: Judge attempt context.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtEvaluationContext" }
        "401":
          $ref: "#/components/responses/TokenUnauthorized"
        "403":
          $ref: "#/components/responses/HitlForbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/ext/evaluations/evidence:
    get:
      tags: [evaluations]
      summary: (ADR-142, Implemented) List the bound snapshot's evidence metadata
      description: |
        Scope `evaluations:evidence:read`. Cursor-paginated metadata for the
        token-bound evidence snapshot. Each item's real participant id is replaced
        by its blind candidate label; the logical locator and host blob key are
        never exposed (D10). For a pairwise attempt the listing is scoped to the
        attempt's match pair plus shared (participant-less) items (ADR-147/150).
      operationId: extEvaluationEvidenceList
      security:
        - projectToken: ["evaluations:evidence:read"]
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: A page of bound evidence metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtEvaluationEvidenceList" }
        "401":
          $ref: "#/components/responses/TokenUnauthorized"
        "403":
          $ref: "#/components/responses/HitlForbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/ext/evaluations/evidence/{itemId}:
    get:
      tags: [evaluations]
      summary: (ADR-142, Implemented) Read a bounded window of one evidence item
      description: |
        Scope `evaluations:evidence:read`. Reads a server-capped window of one
        evidence item. The `itemId` MUST belong to the token-bound snapshot (an
        item id from `evaluation_evidence_list`); `offset`/`length` are clamped and
        a read that hits the cap is flagged `truncated` (D10). For a pairwise
        attempt only items of the attempt's match pair (or shared,
        participant-less items) are readable — anything else is 409
        `PRECONDITION` (ADR-147/150).
      operationId: extEvaluationEvidenceRead
      security:
        - projectToken: ["evaluations:evidence:read"]
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: length
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: A bounded window of the evidence item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtEvaluationEvidenceRead" }
        "401":
          $ref: "#/components/responses/TokenUnauthorized"
        "403":
          $ref: "#/components/responses/HitlForbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/ext/evaluations/objective-results:
    get:
      tags: [evaluations]
      summary: (ADR-142, Implemented) Get structured objective facts for the execution
      description: |
        Scope `evaluations:objective:read`. Structured objective check and metric
        facts for the token-bound execution (D11). A judge may reference these but
        never infer PASS from source appearance; a missing/absent status carries
        its reason verbatim, never converted to a pass or a zero. For a pairwise
        attempt the facts are scoped to the attempt's match pair plus shared
        (participant-less) rows (ADR-147/150).
      operationId: extEvaluationObjectiveResults
      security:
        - projectToken: ["evaluations:objective:read"]
      responses:
        "200":
          description: Objective checks + metrics for the bound execution.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/ExtEvaluationObjectiveResults" }
        "401":
          $ref: "#/components/responses/TokenUnauthorized"
        "403":
          $ref: "#/components/responses/HitlForbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/ext/evaluations/result:
    post:
      tags: [evaluations]
      summary: (ADR-142, Implemented) Submit a strict judge result for the bound attempt
      description: |
        Scope `evaluations:result:submit`. Seals a strict per-criterion result for
        the token-bound judge attempt. Attribution (attempt/execution/judge/runner/
        model/evidence) is entirely server-derived — the body carries only the
        per-criterion scores and rejects any extra key (D12). Per-criterion
        strictness (unknown/out-of-range/missing-required criterion) is enforced
        against the snapshotted method: an invalid result seals a terminal `invalid`
        attempt (returned as `valid:false`, HTTP 200 — a recorded outcome, never a
        4xx). A malformed envelope returns 422. When the seal completes the panel
        (quorum or terminal), the execution advances to aggregation.
      operationId: extEvaluationResultSubmit
      security:
        - projectToken: ["evaluations:result:submit"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtEvaluationResultBody" }
      responses:
        "200":
          description: Result sealed (valid or terminal-invalid).
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/ExtEvaluationResultResponse" }
        "401":
          $ref: "#/components/responses/TokenUnauthorized"
        "403":
          $ref: "#/components/responses/HitlForbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/ext/projects/{slug}/memory:
    get:
      tags: [memory]
      summary: (ADR-122/127, Implemented) Recall project-brain memories
      description: |
        Scope `memory:read`. Hybrid recall (pgvector cosine over the active
        embedding generation + `tsvector` lexical + a confidence term;
        `created_at DESC` is a tie-break, not a boost) over
        the project's active owned-tier items and indexed source chunks. NO LLM
        call at read time.

        `projectId` is derived server-side from the URL `slug` and compared against
        the token's project — mismatch → 404 (the body carries no project id). For
        an **agent** token, the agent's `agent_project_links.can_read_brain` must be
        true (else 403). The project's `projects.brain_enabled` must be true (else
        422 `CONFIG`). An unprovisioned Brain migration lineage returns 409
        `PRECONDITION`.

        Writes a `brain_snapshots` row (`trigger='explicit'`, `run_id` set only when
        the token is run-bound, actor always set) recording the query and the
        returned owned/indexed union for audit.
      operationId: extRecallProjectMemory
      security:
        - projectToken: ["memory:read"]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: q
          in: query
          required: true
          description: Recall query text (embedded with the active model at read).
          schema:
            type: string
            minLength: 1
            maxLength: 2000
        - name: limit
          in: query
          required: false
          description: Max items to return. Defaults to the policy K (5).
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 5
        - name: kinds
          in: query
          required: false
          description: |
            Restrict to these Brain kinds. `decision`/`direction` are indexed
            when a canonical source is registered, otherwise owned per project
            home resolution. An unknown value → 422 `CONFIG`.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [lesson, observation, state_fact, decision, direction]
        - name: minConfidence
          in: query
          required: false
          description: Drop items below this confidence.
          schema:
            type: number
            minimum: 0
            maximum: 1
      responses:
        "200":
          description: Ranked active memories for the project.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ExtMemoryItem" }
        "401":
          $ref: "#/components/responses/TokenUnauthorized"
        "403":
          $ref: "#/components/responses/HitlForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/EmbeddingUnavailable"
    post:
      tags: [memory]
      summary: (ADR-122/127, Implemented) Retain a project-brain memory
      description: |
        Scope `memory:write`. Retains owned-tier memory only. Identical active
        `content_hash` is an idempotent no-op. For `lesson`/`observation`,
        semantically-near active items of the same kind reinforce in place
        (cosine > τ=0.85 → confidence +0.1, push `expires_at`). For changed
        near `state_fact`, the newer fact is inserted active and the prior active
        fact becomes `superseded`. `decision`/`direction` are accepted only when
        project home-resolution has no canonical source; a covering source
        returns 422 `CONFIG` naming the source and proposal path. Provenance actor
        is derived from the token — the body carries NO project id.

        For an **agent** token, `agent_project_links.can_write_brain` must be true
        (else 403) — `can_read_brain`/`memory:read` alone NEVER grant write. The
        project's `brain_enabled` must be true (else 422 `CONFIG`); an
        unprovisioned Brain migration lineage returns 409 `PRECONDITION`;
        embedding-provider outage → 503 `EMBEDDING_UNAVAILABLE`.
      operationId: extRetainProjectMemory
      security:
        - projectToken: ["memory:write"]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtMemoryRetainBody" }
      responses:
        "200":
          description: The retained, reinforced, or superseding item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtMemoryRetainResult" }
        "401":
          $ref: "#/components/responses/TokenUnauthorized"
        "403":
          $ref: "#/components/responses/HitlForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/EmbeddingUnavailable"

  /api/v1/ext/projects/{slug}/memory/clusters:
    get:
      tags: [memory]
      summary: (ADR-128, Implemented) List recurring Project Brain evidence clusters
      description: |
        Scope `memory:read`. Computes recurring lesson/observation/state_fact
        clusters server-side from embedding proximity and shared provenance. The route is
        read-only; the improver agent decides whether to call
        `memory_propose`. For an agent token, `can_read_brain` must be true.
      operationId: extListProjectMemoryClusters
      security:
        - projectToken: ["memory:read"]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: kinds
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [lesson, observation, state_fact]
        - name: minRecurrence
          in: query
          required: false
          schema:
            type: integer
            minimum: 2
            maximum: 20
            default: 3
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: Recurring evidence clusters for the project.
          content:
            application/json:
              schema:
                type: object
                required: [clusters]
                properties:
                  clusters:
                    type: array
                    items: { $ref: "#/components/schemas/ExtMemoryCluster" }
        "401":
          $ref: "#/components/responses/TokenUnauthorized"
        "403":
          $ref: "#/components/responses/HitlForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/ext/projects/{slug}/memory/proposals:
    post:
      tags: [memory]
      summary: (ADR-128, Implemented) Propose a Project Brain improvement
      description: |
        Scope `memory:write`. Creates a `brain_proposals` row from evidence
        and a draft payload. Project autonomy policy may immediately
        auto-draft an allowed low-risk catalog proposal into an unpublished M25
        authored draft. This route never publishes or writes repo files. For an
        agent token, `can_write_brain` must be true. Duplicate `clusterHash`
        values are idempotent and return the existing proposal with its current
        status.
      operationId: extCreateProjectMemoryProposal
      security:
        - projectToken: ["memory:write"]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtMemoryProposalBody" }
      responses:
        "201":
          description: Proposal created; may be pending or already auto-drafted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtMemoryProposalResult" }
        "200":
          description: Duplicate `clusterHash`; existing proposal returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtMemoryProposalResult" }
        "401":
          $ref: "#/components/responses/TokenUnauthorized"
        "403":
          $ref: "#/components/responses/HitlForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/ext/agent/memory:
    get:
      tags: [agent-memory]
      summary: Read this agent's memory file for its bound project
      description: |
        (ADR-152) Scope `agent_memory:write` — v1 ships exactly ONE agent-memory
        scope, and an agent that may maintain its memory may read it back. The
        content is already injected into the agent's own prompt at launch, so
        this route exposes nothing new; it exists for symmetry and diagnostics
        and ships no MCP tool.

        **No body-controlled identifier and no `slug` path segment.**
        `projectId` and `agentId` come from the run-bound token, and the
        project slug is a server-state lookup by `projectId`.

        An absent file is NOT a 404: it returns `200` with `content: ""`,
        `hash: null`, `sizeChars: 0`, `updatedAt: null`, which is exactly the
        first-writer state (`ifHash: null`).
      operationId: extAgentMemoryGet
      security:
        - projectToken: []
      responses:
        "200":
          description: Current memory state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtAgentMemoryState"
        "401":
          $ref: "#/components/responses/TokenUnauthorized"
        "403":
          $ref: "#/components/responses/AgentMemoryForbidden"
    post:
      tags: [agent-memory]
      summary: Replace this agent's memory file through a content-hash CAS
      description: |
        (ADR-152) Scope `agent_memory:write`, mapped to the dedicated
        `writeAgentMemory` project action (minimum `member`) — never the
        `readBoard` fallback. BOTH the scope and the per-attachment
        `agent_project_links.memory_enabled` flag must pass; neither alone
        authorizes a write.

        **No body-controlled identifier and no `slug` path segment** (the one
        MAIster facade tool without `slug` — the project comes from the
        run-bound token). `content` and `ifHash` are payload, never locators:
        neither reaches a path or a cross-resource lookup.

        Ordering is read-current → compare CAS → atomic write → return the
        **post-write** hash. `ifHash: null` is the first-writer form (an absent
        file hashes to `null`). A stale `ifHash` returns `409 CONFLICT` whose
        body carries the current `{content, hash}` so the caller can merge and
        retry rather than clobber. Two concurrent writers leave the file
        containing exactly one writer's bytes.

        The write targets `.maister/<project-slug>/agents/…`, never the
        worktree, so it works in every workspace mode including `none` and
        leaves the read-only enforcement contour untouched.
      operationId: extAgentMemoryWrite
      security:
        - projectToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content]
              properties:
                content:
                  type: string
                  maxLength: 32768
                  description: |
                    Full replacement body. Capped by
                    `MAISTER_AGENT_MEMORY_MAX_CHARS` (default `32768`
                    characters); over-cap returns `422 CONFIG`.
                ifHash:
                  type: string
                  nullable: true
                  description: |
                    The hash this write is based on. `null` (or omitted) is the
                    first-writer form and succeeds only while the file is
                    absent.
            example:
              content: "# Project notes\n\n- Tests run with `pnpm test:unit`.\n"
              ifHash: null
      responses:
        "200":
          description: Written. `hash` is the POST-write hash.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtAgentMemoryState"
        "401":
          $ref: "#/components/responses/TokenUnauthorized"
        "403":
          $ref: "#/components/responses/AgentMemoryForbidden"
        "409":
          description: |
            CAS loss (`CONFLICT`) — `ifHash` did not match the current on-disk
            hash. The body carries the current state so the caller can merge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtAgentMemoryConflictBody"
        "422":
          description: |
            Body failed schema validation, or `content` exceeds
            `MAISTER_AGENT_MEMORY_MAX_CHARS` (`CONFIG`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtErrorBody" }

  /api/v1/ext/runs:
    post:
      tags: [runs]
      summary: Launch a run for a task
      description: |
        Scope `runs:launch`. Launches a run for a task owned by the token's
        project. ADR-085 keeps this route v1-compatible: the body accepts only
        `taskId`, runner override, `baseBranch`, and `targetBranch`. It does
        not accept `flowId` or `deliveryPolicy`; those richer overrides are
        session-auth UI/API-only until a future versioned external contract.

        The route still funnels through the same `launchRun` service and the
        same server launchability classifier, executor resolution, supervisor
        readiness gate, worktree creation, and scheduler claim. The `projectId`
        is derived from the task row; `taskId` ownership is re-validated
        against the token's project.

        Returns 202 (may be `Pending` if the global concurrency cap is full,
        or `Running` if a slot was free). Writes a `token_audit_log` row with
        scope `runs:launch` after success.
      operationId: extLaunchRun
      x-maister-m43-legacy-steps:
        status: 422
        code: CONFIG
        sideEffects: none
        message: "legacy steps[] flows are not supported since engine 3.0.0; republish the package with nodes[]"
      security:
        - projectToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtLaunchRunBody" }
      responses:
        "202":
          description: Run accepted. May be `Pending` (queued) or `Running`.
          content:
            application/json:
              schema:
                type: object
                required: [runId, status]
                properties:
                  runId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [Pending, Running]
                  queuePosition:
                    type: integer
                    minimum: 1
                    description: Present iff `status == "Pending"`.
        "401":
          $ref: "#/components/responses/TokenUnauthorized"
        "403":
          $ref: "#/components/responses/HitlForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          description: |
            Executor or platform unavailable (`EXECUTOR_UNAVAILABLE`).
            Supervisor unreachable or the executor is not registered/available.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtErrorBody" }

  /api/v1/ext/runs/delegate:
    post:
      tags: [runs]
      summary: (M37 — Implemented) Delegate a child unit from an orchestrator
      description: |
        (M37 — Implemented, ADR-098.) Scope `runs:delegate`. Spawns ONE governed
        child unit from the calling orchestrator run. Backs the `run_delegate`
        delegation tool exposed over the maister MCP facade to `orchestrator`
        nodes only.

        **Identifiers (trust contour).** The `projectId` and the **parent**
        `runId` are derived SERVER-SIDE from the ephemeral `agent:<id>` token
        minted for the orchestrator launch (scoped `runs:delegate`) — NEVER body
        fields. `target.agentId` / `target.flowId` are body-controlled and
        resolved through that project's enabled + trusted catalog
        (`resolveEffectiveAgentDefinition` + pinned revision); a target not
        resolvable through the enabled+trusted catalog is refused
        (`PRECONDITION` → 409) and **no child run is created** (resolve+trust is
        physically separate from launch). `prompt` / `title` are body free-text.

        `mode = "task"` creates a child task (Kanban card) linked by `parent_of`
        plus a child run; `mode = "run"` creates a child run only
        (`runs.parent_run_id`, workbench subtree, no board card). Child creation
        funnels through `POST /api/v1/ext/runs` so the web tier owns the
        transaction; the supervisor `POST /sessions` happens after commit, and an
        orphan (committed run, no session) reconciles to `Crashed`. The launch
        snapshots the resolved effective definition + runner onto the child run
        row. Over-depth (`MAISTER_ORCHESTRATOR_MAX_DEPTH`) is rejected pre-tx
        (`CONFIG` → 422).

        Writes a `token_audit_log` row with scope `runs:delegate` (audit identity
        `agent:<id>`) after success.
      operationId: extDelegateRun
      security:
        - projectToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtRunDelegateBody" }
      responses:
        "202":
          description: |
            Child unit created (the run row is committed; the supervisor
            `POST /sessions` happens after commit, so the child may still be
            `Pending` when this returns). `childTaskId` is present only for
            `mode = "task"`.
          content:
            application/json:
              schema:
                type: object
                required: [childRunId]
                properties:
                  childRunId:
                    type: string
                    format: uuid
                  childTaskId:
                    type: string
                    format: uuid
                    description: Present only for `mode == "task"`.
        "401":
          $ref: "#/components/responses/TokenUnauthorized"
        "403":
          $ref: "#/components/responses/HitlForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: |
            Request body failed schema validation, or a `CONFIG` precondition was
            violated — over-depth (`MAISTER_ORCHESTRATOR_MAX_DEPTH`), engine floor
            below `1.6.0`, or a `strict` path-scope declaration (refused until the
            deferred policy layer lands, ADR-099).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtErrorBody" }
        "503":
          description: |
            Executor or platform unavailable (`EXECUTOR_UNAVAILABLE`) — supervisor
            unreachable, the agent pool cap is exhausted, or the child spawn
            failed retryably.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtErrorBody" }

  /api/v1/ext/runs/plan:
    post:
      tags: [runs]
      summary: (M37 — Implemented) Submit a success-gated task DAG from an orchestrator
      description: |
        (M37 — Implemented, ADR-098.) Scope `runs:delegate`. Writes a DAG of child
        tasks wired by the success-gated `requires` relation in ONE transaction.
        Backs the `run_plan` delegation tool. `requires` releases a dependent
        ONLY on a producer's `Done` (Failed/Abandoned keeps dependents blocked and
        wakes the orchestrator), unlike `depends_on`/`blocks`; it is wired into
        the shared launchability classifier so it gates at every launch entry
        point.

        **Identifiers (trust contour).** The `projectId` and the parent `runId`
        are derived SERVER-SIDE from the orchestrator's `agent:<id>` token — NEVER
        body fields. Each task's `target.agentId` / `target.flowId` is
        body-controlled and resolved through the project's enabled + trusted
        catalog (unresolvable/untrusted → `PRECONDITION` → 409, no tasks
        created). `dependsOn` edges are body-controlled and validated BEFORE the
        transaction: each entry MUST reference an in-batch `key` (cross-batch or
        unknown ref → `PRECONDITION` → 409) and the edge set MUST be acyclic.

        **Pre-transaction `CONFIG` bounds (→ 422):** a cyclic `dependsOn`, a batch
        larger than `MAISTER_MAX_ORCHESTRATOR_FANOUT`, or a run-tree depth past
        `MAISTER_ORCHESTRATOR_MAX_DEPTH`. Validation is all-or-nothing — no
        partial DAG is ever written. Tasks whose dependencies are already clear
        are marked launchable and fold into the advisory-locked
        `promoteNextPending` CAS (the route NEVER launches directly, preserving
        the global cap), so a `childRunId` may be present for those.

        Writes a `token_audit_log` row with scope `runs:delegate` after success.
      operationId: extPlanRuns
      security:
        - projectToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtRunPlanBody" }
      responses:
        "202":
          description: |
            DAG written. One result row per submitted task `key`; `childRunId` is
            present only for tasks that were immediately launchable.
          content:
            application/json:
              schema:
                type: object
                required: [tasks]
                properties:
                  tasks:
                    type: array
                    items: { $ref: "#/components/schemas/ExtRunPlanResultItem" }
        "401":
          $ref: "#/components/responses/TokenUnauthorized"
        "403":
          $ref: "#/components/responses/HitlForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: |
            Request body failed schema validation, or a `CONFIG` precondition was
            violated — cyclic `dependsOn`, over-fanout
            (`MAISTER_MAX_ORCHESTRATOR_FANOUT`), or over-depth
            (`MAISTER_ORCHESTRATOR_MAX_DEPTH`). No partial DAG is written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtErrorBody" }
        "503":
          description: |
            Executor or platform unavailable (`EXECUTOR_UNAVAILABLE`) for an
            immediate launch; the DAG is still committed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtErrorBody" }

  /api/v1/ext/runs/collect:
    post:
      tags: [runs]
      summary: (M37 — Implemented) Collect terminal results of orchestrator children
      description: |
        (M37 — Implemented, ADR-098.) Scope `runs:collect`. Returns
        terminal-result summaries for the calling orchestrator's children. Backs
        the `run_collect` delegation tool. Reads each child's `RunDTO` projection plus
        its produced-artifact manifest (`artifact_instances`) and the base→run
        diff ref — NEVER the child worktree directly, matching the
        reviewer-isolation contract.

        **Identifiers (trust contour).** The `projectId` and the parent `runId`
        are derived SERVER-SIDE from the orchestrator's `agent:<id>` token. With
        `childRunId` set, the named child MUST be a child of the calling
        orchestrator (mismatch → 404, existence-hide); with `all: true`, every
        child of the calling orchestrator is returned. Exactly one of
        `childRunId` / `all` MUST be supplied.

        Writes a `token_audit_log` row with scope `runs:collect` after success.
      operationId: extCollectRuns
      security:
        - projectToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtRunCollectBody" }
      responses:
        "200":
          description: Terminal-result summaries for the requested children.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ExtChildRunSummary" }
        "401":
          $ref: "#/components/responses/TokenUnauthorized"
        "403":
          $ref: "#/components/responses/HitlForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/ext/runs/cancel:
    post:
      tags: [runs]
      summary: (M37 — Implemented) Cancel an orchestrator child run
      description: |
        (M37 — Implemented, ADR-098.) Scope `runs:cancel`. Cancels one child run
        of the calling orchestrator. Backs the `run_cancel` delegation tool.

        **Identifiers (trust contour).** The `projectId` and the parent `runId`
        are derived SERVER-SIDE from the orchestrator's `agent:<id>` token; the
        body `childRunId` MUST be a child of the calling orchestrator (mismatch →
        404, existence-hide). The cancel funnels through the same run-stop path as
        the session-auth surface; the returned `status` is the child's row state
        after the cancel was applied.

        Writes a `token_audit_log` row with scope `runs:cancel` after success.
      operationId: extCancelRun
      security:
        - projectToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtRunCancelBody" }
      responses:
        "200":
          description: Cancel applied; the child's row state is returned.
          content:
            application/json:
              schema:
                type: object
                required: [childRunId, status]
                properties:
                  childRunId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    description: |
                      The child's run status after the cancel was applied (e.g.
                      `Abandoned`). A run-status string per the run state machine.
        "401":
          $ref: "#/components/responses/TokenUnauthorized"
        "403":
          $ref: "#/components/responses/HitlForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/ext/runs/message:
    post:
      tags: [runs]
      summary: (M37 — Implemented) Re-message a persistent swarm child
      description: |
        (M37 — Implemented, ADR-099.) Scope `runs:delegate`. Sends a follow-up
        prompt to a PERSISTENT addressable child in the calling orchestrator's
        run-tree. Backs the `run_message` delegation tool. If the child is parked
        between turns it is respawned and resumed with prior context
        (`session/resume`); if it is live the prompt is delivered to the running
        session. The child re-parks on its next `end_turn`.

        **Identifiers (trust contour).** The `projectId` and the **caller**
        `runId` are derived SERVER-SIDE from the orchestrator's `agent:<id>`
        token — NEVER body fields. The target is resolved by `addressableKey` OR
        `childRunId` (exactly one required) and is SCOPED to the caller's own
        tree (`root_run_id`) — a persistent child in another tree is invisible
        (resolved to `PRECONDITION` → 409). The target MUST be a persistent
        agent child; a non-persistent or non-agent target → `PRECONDITION` → 409.

        Writes a `token_audit_log` row with scope `runs:delegate` after success.
      operationId: extMessageRun
      security:
        - projectToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [prompt]
              description: |
                Exactly one of `addressableKey` / `childRunId` MUST be supplied.
              properties:
                addressableKey:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: "^[A-Za-z0-9._-]+$"
                  description: |
                    The persistent child's stable key, unique within the caller's
                    orchestrator tree.
                childRunId:
                  type: string
                  format: uuid
                  description: The persistent child's run id, in the caller's tree.
                prompt:
                  type: string
                  minLength: 1
                  description: Free-text follow-up prompt delivered to the child.
      responses:
        "200":
          description: Message delivered; the child's row state is returned.
          content:
            application/json:
              schema:
                type: object
                required: [childRunId, status]
                properties:
                  childRunId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    description: The child's run status after delivery (e.g. `Running`).
        "401":
          $ref: "#/components/responses/TokenUnauthorized"
        "403":
          $ref: "#/components/responses/HitlForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/ext/runs/promote:
    post:
      tags: [runs]
      summary: (M37 — Implemented) Promote a reviewed delegated child to Done
      description: |
        (M37 — Implemented, ADR-100.) Scope `runs:promote` — held ONLY by the
        orchestrator's run-bound token (a child agent token does not), so a
        child→child promote is a 403 by scope. For an `own`-mode child this merges
        the reviewed child's branch into its target and flips that child `Done`.
        Backs the `run_promote` delegation tool.

        **Shared-tree promote (Implemented — ADR-102).** When `childRunId` is a
        `workspace_mode='shared'` child, this is a TREE promote, not a per-child
        promote: the operation resolves the shared TREE workspace by the orchestrator
        tree root (`rootRunId`, server-derived) and the
        `workspace_mode='shared'` marker — NOT by the promoting child's own row
        (reuser children have none) — merges the single tree branch ONCE, and settles
        ALL `workspace_mode='shared'` children of that tree `Review → Done` in one
        transaction. It is gated by a promote-time settled re-check: while ANY shared
        sibling is still in a writable status (`Running | NeedsInput | NeedsInputIdle
        | HumanWorking | Pending | WaitingOnChildren`), the promote is refused
        `PRECONDITION` → 409 and merges nothing. Exactly-once: a concurrent shared
        tree-promote that loses the durable-claim CAS, or a re-promote that finds
        nothing in `Review`, is an idempotent no-op (`CONFLICT` / `PRECONDITION` →
        409). This supersedes ADR-099 §4's launch gate for shared writable worktrees.

        **Identifiers (trust contour).** `childRunId` is the ONLY body-controlled
        identifier; it is validated against the bound-run scope — it MUST be a direct
        child of the bound orchestrator, in the token's project, and currently in
        `Review` (otherwise `PRECONDITION` → 409). The `projectId`, the **parent**
        `runId`, and the tree `rootRunId` (used to resolve the shared tree workspace)
        are server-derived run state from the run-bound orchestrator token — NEVER
        body fields. A merge CONFLICT returns `CONFLICT` → 409 and leaves the child
        (and, for a shared tree, ALL shared siblings) in `Review` for a human to
        resolve — the orchestrator NEVER auto-resolves (§8).

        Writes a `token_audit_log` row with scope `runs:promote` after success.
      operationId: extPromoteRun
      security:
        - projectToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [childRunId]
              properties:
                childRunId:
                  type: string
                  format: uuid
                  description: The reviewed child run to promote.
      responses:
        "200":
          description: |
            Merged to the target; the child is now `Done`. For a
            `workspace_mode='shared'` child (Implemented — ADR-102) the single tree
            branch is merged once and ALL shared siblings of the tree are settled
            `Review → Done` in the same transaction; the echoed `childRunId` is the
            one promoted.
          content:
            application/json:
              schema:
                type: object
                required: [childRunId, status]
                properties:
                  childRunId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [Done]
                  commit:
                    type: string
                    description: |
                      The merge commit sha, when the promotion produced one.
        "401":
          $ref: "#/components/responses/TokenUnauthorized"
        "403":
          $ref: "#/components/responses/HitlForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            A `PRECONDITION` (child is not a direct child of the bound
            orchestrator, or not in `Review`, or the token is not run-bound;
            **shared-tree, Implemented — ADR-102**: the settled-gate is unmet because a
            shared sibling is still in a writable status, the target is not a shared
            child / has no resolvable tree workspace, or nothing is in `Review`
            because the tree was already promoted) or a merge `CONFLICT` (the child —
            and, for a shared tree, ALL shared siblings — stay in `Review`; no
            auto-resolve; a lost shared durable-claim CAS is also `CONFLICT`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtErrorBody" }
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/ext/runs/rework:
    post:
      tags: [runs]
      summary: (M37 — Implemented) Re-open a reviewed delegated child for another turn
      description: |
        (M37 — Implemented, ADR-100.) Scope `runs:delegate` (a run-bound
        orchestrator addressing its own child). CAS-flips a reviewed child
        `Review → Running` and resumes its session (`session/resume` on the
        retained `acp_session_id`) with the coordinator's override `prompt`
        against the child's existing worktree; it re-reviews on its next
        `end_turn`. Backs the `run_rework` delegation tool.

        **Identifiers (trust contour).** The `projectId` and the **parent**
        `runId` are derived SERVER-SIDE from the run-bound orchestrator token —
        NEVER body fields. `childRunId` MUST be a direct child of the bound
        orchestrator, in the token's project, and currently in `Review`
        (otherwise `PRECONDITION` → 409).

        **(Implemented — ADR-102.)** Reworking a `workspace_mode='shared'` child
        is refused `CONFLICT` → 409 while the tree promote is in progress / done
        (the rework fences on the allocator workspace's `promotion_state`), so a
        rework cannot mutate the shared branch during the tree-promote merge.

        Writes a `token_audit_log` row with scope `runs:delegate` after success.
      operationId: extReworkRun
      security:
        - projectToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [childRunId, prompt]
              properties:
                childRunId:
                  type: string
                  format: uuid
                  description: The reviewed child run to re-open.
                prompt:
                  type: string
                  minLength: 1
                  description: |
                    Rework instruction delivered to the resumed child session.
      responses:
        "200":
          description: Child re-opened; it is now `Running`.
          content:
            application/json:
              schema:
                type: object
                required: [childRunId, status]
                properties:
                  childRunId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [Running]
        "401":
          $ref: "#/components/responses/TokenUnauthorized"
        "403":
          $ref: "#/components/responses/HitlForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/ext/runs/sync:
    post:
      tags: [runs]
      summary: (ADR-141 — Implemented) Sync a Review run's branch onto its target
      description: |
        (ADR-141 — Implemented.) Scope `runs:sync`. Rebases (default) or merges the
        run branch onto its promotion target inside the run's worktree and, when
        published, force-with-lease pushes. On conflict with `agent=true` a fresh
        resolver ACP session is launched to resolve; with `agent=false` the
        conflicted state is aborted and `outcome:"conflict"` is returned.

        **Identifiers (trust contour).** `runId` in the body identifies the run;
        the `projectId` is derived SERVER-SIDE from the run row
        (`resolveProjectId`), existence-hidden `404` on cross-project mismatch —
        NEVER a body field. Eligible runs: `status='Review'`,
        `run_kind ∈ {flow, agent}`, top-level (`parent_run_id IS NULL`), not a
        shared-tree / experiment / scratch run.

        Writes a `token_audit_log` row with scope `runs:sync` after success.
      operationId: extSyncRun
      security:
        - projectToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [runId]
              properties:
                runId:
                  type: string
                  minLength: 1
                  description: |
                    The Review run whose branch to sync. NOT declared
                    `format: uuid` — the handler validates `z.string().min(1)`
                    and resolves the run by lookup, so a non-UUID is a run-not-
                    found (existence-hidden 404), never a 422. Declaring uuid
                    would promise a validation the server does not perform.
                strategy:
                  type: string
                  enum: [rebase, merge]
                  description: Overrides the project default sync strategy.
                agent:
                  type: boolean
                  description: When true (default) launch the AI resolver on conflict; when false abort with outcome=conflict.
                push:
                  type: boolean
                  description: Overrides the auto push-iff-published policy.
                runnerId:
                  type: string
                  description: Overrides the resolver runner (validated against the platform runner catalog).
      responses:
        "200":
          description: |
            Mechanical sync completed (`outcome` = `synced` | `noop` | `conflict`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtRunSyncResult" }
        "202":
          description: |
            Conflict with `agent=true` — a resolver session was launched
            (`outcome` = `agent_launched`); the run is now `Running`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtRunSyncResult" }
        "401":
          $ref: "#/components/responses/TokenUnauthorized"
        "403":
          $ref: "#/components/responses/HitlForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          description: |
            `EXECUTOR_UNAVAILABLE` — supervisor down or resolver spawn failed on
            the agent path; the conflicted state is aborted first and the run
            stays `Review`. Retryable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtErrorBody" }

  /api/v1/ext/runs/reopen:
    post:
      tags: [runs]
      summary: (ADR-141 — Implemented) Reopen a Done run whose PR is open/conflicted
      description: |
        (ADR-141 — Implemented.) Scope `runs:sync`. Flips `Done → Review` for a
        top-level `flow|agent` run whose workspace has an open or conflicted PR,
        re-arming review + auto-promotion exclusion and reviving a GC'd worktree
        if needed. Re-promotion in `pull_request` mode reuses the SAME provider PR.

        **Identifiers (trust contour).** `runId` in the body identifies the run;
        the `projectId` is derived SERVER-SIDE from the run row, existence-hidden
        `404` on mismatch.

        Writes a `token_audit_log` row with scope `runs:sync` after success.
      operationId: extReopenRun
      security:
        - projectToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [runId]
              properties:
                runId:
                  type: string
                  minLength: 1
                  description: |
                    The Done run to reopen. NOT declared `format: uuid` — the
                    handler validates the identical `z.string().min(1)` its sync
                    sibling does and resolves the run by lookup, so a non-UUID is
                    an existence-hidden 404, never a 422. Declaring uuid would
                    promise a validation the server does not perform.
      responses:
        "200":
          description: Run reopened; it is now `Review`.
          content:
            application/json:
              schema:
                type: object
                required: [runId, status]
                properties:
                  runId:
                    type: string
                    minLength: 1
                  status:
                    type: string
                    enum: [Review]
        "401":
          $ref: "#/components/responses/TokenUnauthorized"
        "403":
          $ref: "#/components/responses/HitlForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/ext/runs/{runId}:
    get:
      tags: [runs]
      summary: Get run status
      description: |
        Scope `runs:read`. Returns the `RunDTO` for the run identified by
        `runId`. The run's `projectId` is re-validated against the token's
        project — mismatch → 404 (existence-hide).

        Writes a `token_audit_log` row with scope `runs:read` after success.
      operationId: extGetRun
      security:
        - projectToken: []
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Run status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunDTO" }
        "401":
          $ref: "#/components/responses/TokenUnauthorized"
        "403":
          $ref: "#/components/responses/HitlForbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/ext/runs/{runId}/readiness:
    get:
      tags: [readiness]
      summary: Get run readiness
      description: |
        Scope `readiness:read`. Returns the `ReadinessDTO` for the run —
        whether the run is ready to be promoted, blocked by outstanding gates,
        stale, failed, still waiting, or overridden. Includes external gate
        status and required artifact presence/validity.

        The run's `projectId` is re-validated against the token's project —
        mismatch → 404. Writes a `token_audit_log` row with scope
        `readiness:read` after success.
      operationId: extGetRunReadiness
      security:
        - projectToken: []
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Run readiness state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadinessDTO" }
        "401":
          $ref: "#/components/responses/TokenUnauthorized"
        "403":
          $ref: "#/components/responses/HitlForbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/ext/activity:
    get:
      tags: [activity]
      summary: Get the assistant pulse for the token-bound project
      description: |
        Scope `runs:read`. Returns one assistant-friendly, project-scoped pulse
        with three blocks:

        - `happened`: persisted domain facts replayed from `domain_events`
          after the supplied `since` cursor.
        - `now`: the current snapshot of every active run in the token-bound
          project.
        - `needsYou`: pending project-scoped human-attention items built from
          HITL and clarification state.

        The route never accepts a project slug, filesystem path, or raw
        protocol payload. No ACP JSON-RPC frames, transport method names,
        supervisor handles, token material, or absolute paths cross this
        boundary.

        Bootstrap rule: when `since` is omitted, `happened.items` is empty and
        `happened.nextCursor` is seeded to the latest project fact currently
        visible below the `domain_events.tx_id` commit horizon, so polling can
        start without replaying historical backlog or skipping an older
        in-flight transaction. `now` and `needsYou` are still fully recomputed
        on that call.

        `salience` is a minimum filter: `high` returns only `high`, `normal`
        returns `high` + `normal`, and `low` returns every emitted item.

        This route requires a project-bound token. A global personal token with
        no bound project returns 403 `UNAUTHORIZED`.
      operationId: extActivityPulse
      security:
        - projectToken: []
      parameters:
        - name: since
          in: query
          required: false
          description: |
            Opaque pulse cursor returned by the previous call. The current
            implementation seeds it from the token project's visible
            `domain_events.id` tail below the current commit horizon, but
            callers must treat it as an opaque string.
          schema:
            type: string
        - name: salience
          in: query
          required: false
          description: |
            Minimum salience to emit. `high` = only `high`; `normal` = `high`
            + `normal`; `low` = all emitted items. `needsYou` entries are
            always included because they are human-attention items by design.
          schema:
            allOf:
              - $ref: "#/components/schemas/ExtActivitySalience"
            default: low
      responses:
        "200":
          description: Project-scoped assistant pulse.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtActivityPulseResponse"
        "401":
          $ref: "#/components/responses/TokenUnauthorized"
        "403":
          $ref: "#/components/responses/HitlForbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/ext/runs/{runId}/activity:
    get:
      tags: [activity]
      summary: Get semantic assistant activity for one run
      description: |
        Scope `runs:read`. Returns a semantic activity feed for the run
        identified by `runId`, plus the current run snapshot using the same
        semantic fields as the project pulse.

        The run's `projectId` is derived server-side from the run row and MUST
        match the token's bound project. Cross-project or inaccessible runs
        return 404 (existence-hide).

        Replay is cursor-based: every item has a stable `id` and a monotonic
        `lastMutationId`. `sinceId` is an opaque forward-only cursor whose
        current encoding combines that mutation horizon with a stable item-id
        tiebreaker, so equal-horizon siblings are not dropped at page
        boundaries. Omitting `sinceId` starts from the beginning of the run's
        semantic history.

        The payload is semantic only. Raw ACP JSON-RPC frames, tool payload
        blobs, diff bodies, token material, supervisor handles, and absolute
        paths never cross this boundary.
      operationId: extRunActivity
      security:
        - projectToken: []
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: sinceId
          in: query
          required: false
          description: |
            Forward-only mutation horizon returned by `nextSinceId`. The current
            implementation derives it from the projected transcript mutation
            horizon, but callers must treat it as opaque.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of activity items to return.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: salience
          in: query
          required: false
          description: Minimum salience to emit in the `items` array.
          schema:
            allOf:
              - $ref: "#/components/schemas/ExtActivitySalience"
            default: low
      responses:
        "200":
          description: Semantic assistant activity for one run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtRunActivityResponse"
        "401":
          $ref: "#/components/responses/TokenUnauthorized"
        "403":
          $ref: "#/components/responses/HitlForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/ext/runs/{runId}/gates/{gateId}/report:
    post:
      tags: [gates]
      summary: Report result for an external gate
      description: |
        Scope `gates:report`. Reports the result of an `external_check` gate
        for the given run. The run's `projectId` is re-validated against the
        token's project. The `gateId` must identify a live, non-terminal
        `external_check` gate_result row for this run — unknown or non-external
        gate → 404.

        **Success path** (valid token, correct project, known external gate,
        valid body): the gate_result row is flipped to `passed` or `failed`,
        a `test_report` artifact is recorded (producer `gate`, locator inline),
        and the success audit row is all written in one database transaction
        (rollback-safe).

        **Failure path** (bad/expired/revoked token → 401; missing scope →
        403; cross-project → 404; non-external or unknown gate → 404; terminal run
        (`Done`/`Abandoned`/`Crashed`/`Failed`) → 409; body invalid → 422):
        only a failure audit row is written after response, and no gate or
        artifact state is mutated.

        Staleness: if `staleOnNewCommit` is set on the gate's manifest config
        and a new report arrives with a different `commitSha`, the prior passed
        report is superseded and the gate becomes stale. Concurrent reports for
        the same run are serialized so a double-delivered webhook for the same
        `commitSha` never appends duplicate superseding rows.

        Writes a `token_audit_log` row with scope `gates:report`.
      operationId: extReportGate
      security:
        - projectToken: []
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: gateId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtGateReportBody" }
      responses:
        "200":
          description: Gate report recorded, artifact created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtGateReportResponse" }
        "401":
          $ref: "#/components/responses/TokenUnauthorized"
        "403":
          $ref: "#/components/responses/HitlForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/ext/hitl:
    get:
      tags: [hitl]
      summary: (0063 Implemented) List pending human HITL across visible projects
      description: |
        Scope `hitl:inbox:read`. Returns pending human-owned HITL work across
        every project the global personal token owner can currently access.
        This route is only for global personal user tokens (`token_kind=user`,
        `project_id IS NULL`). Project tokens, project-scoped user tokens, and
        agent tokens return 403 because they do not carry a user-wide project
        set.

        Identifier labels:

        | Identifier | Source | Trust |
        | --- | --- | --- |
        | token owner | auth-context | verified bearer token row |
        | visible projects | server-state | owner membership/global-admin query |

        `*` may satisfy this read scope. The route writes a
        `token_audit_log` row with `scope_used='hitl:inbox:read'`,
        `project_id=NULL`, `endpoint='GET /api/v1/ext/hitl'`, and the returned
        HTTP status. The audit/log path must not record plaintext token, token
        hash, Authorization header, or held scope list.
      operationId: extListHitlInbox
      security:
        - projectToken: []
      responses:
        "200":
          description: Cross-project HITL inbox for the token owner.
          content:
            application/json:
              schema:
                type: object
                required: [items, count]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ExtHitlInboxItem" }
                  count:
                    type: integer
                    minimum: 0
                    description: Number of pending inbox items (equals `items.length`).
              examples:
                default:
                  value:
                    count: 1
                    items:
                      - projectId: "3f2504e0-4f89-41d3-9a0c-0305e82c3301"
                        projectSlug: "demo"
                        runId: "6ba7b810-9dad-41d1-80b4-00c04fd430c8"
                        hitlRequestId: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
                        kind: "human"
                        title: "Review deployment plan"
                        createdAt: "2026-06-23T12:00:00.000Z"
        "401":
          $ref: "#/components/responses/TokenUnauthorized"
        "403":
          $ref: "#/components/responses/HitlForbidden"

  /api/v1/ext/runs/{runId}/hitl:
    get:
      tags: [hitl]
      summary: List pending HITL requests for a run
      description: |
        Scope `hitl:read` (M17). Returns the pending (unanswered) human-in-the-
        loop requests for the run identified by `runId`. The run's `projectId`
        is server-state from the run row. Project-bound tokens must match that
        project; global personal user tokens authorize the owner against that
        project. Mismatch or inaccessible project → 404 (existence-hide).

        Identifier labels:

        | Identifier | Source | Trust |
        | --- | --- | --- |
        | runId | url-param | locator only |
        | projectId | server-state | loaded from run row |
        | token owner | auth-context | verified bearer token row |

        **Scope enforcement (D8).** This route gates on the token scope:
        `hitl:read` must be present in the token's `scopes`, or the token must
        hold `*`, else 403. The 403 body does NOT reveal which scopes the token
        holds.

        **DTO policy.** Items NEVER include `acp_session_id`, absolute worktree
        paths, supervisor-internal handles, or any other internal locator.

        Writes a `token_audit_log` row with scope `hitl:read` and the
        server-derived run project after success.
      operationId: extListRunHitl
      security:
        - projectToken: []
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Pending HITL requests for the run.
          content:
            application/json:
              schema:
                type: object
                required: [hitl]
                properties:
                  hitl:
                    type: array
                    items: { $ref: "#/components/schemas/ExtHitlRequestDTO" }
        "401":
          $ref: "#/components/responses/TokenUnauthorized"
        "403":
          $ref: "#/components/responses/HitlForbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/ext/runs/{runId}/hitl/{hitlRequestId}/respond:
    post:
      tags: [hitl]
      summary: Respond to a pending HITL request
      description: |
        Scope `hitl:respond` or exact `hitl:respond:human` (M17, 0063
        Implemented). Answers the pending HITL request identified by
        `hitlRequestId` on the run identified by `runId`. Routes through the
        SAME `respondToHitl` service (and the same two-phase commit + audit) as
        the session-auth `POST /api/runs/{runId}/hitl/{hitlRequestId}/respond`.
        The run's `projectId` is server-state from the run row. Project-bound
        tokens must match that project; global personal user tokens authorize
        the owner against that project. `hitlRow.runId` must equal the URL
        `runId`; mismatch or inaccessible project → 404 (existence-hide).

        Identifier labels:

        | Identifier | Source | Trust |
        | --- | --- | --- |
        | runId | url-param | locator only |
        | hitlRequestId | url-param | locator only |
        | projectId | server-state | loaded from run row |
        | stored HITL kind/schema/options | server-state | loaded from `hitl_requests` |
        | response payload | body-controlled | validated by kind/schema |
        | token owner | auth-context | verified bearer token row |

        **(ADR-138 Implemented) Review refusal.** Before invoking the shared
        response service, this route loads the stored schema and rejects every
        `schema.review === true` gate with `409 PRECONDITION`. External tokens
        have no authenticated code/diff/feedback-preview workspace and cannot
        submit a blind review decision. The response directs the actor to the
        session-authenticated Review Workspace. The refusal does not mutate the
        HITL row or write an audit success outcome.

        The handler otherwise dispatches on the stored `hitl_requests.kind`:

        - **permission**: supply `optionId`. Two-phase atomic claim; same
          `optionId` on retry → idempotent 200; idle-resume scheduled → 202.
        - **form**: supply `response` (validated against the row's `schema`;
          422 on failure), with optional `confidence` (`0..1`).
        - **human**: requires a global personal user token with exact
          `hitl:respond:human`; `*` alone is insufficient. The response is
          recorded as a human user action with `HitlActor.kind='user'` and
          `userId=ownerUserId`.
        - **infra_recovery / budget_breach**: not externally respondable in this
          version; use the session-auth HITL route.

        **Actor-kind gate (D7).** Project tokens, project-scoped user tokens,
        and agent tokens MAY answer only `kind ∈ {permission, form}` and return
        403 for human-only kinds. Only global personal user tokens with exact
        `hitl:respond:human` can satisfy a human gate. The token actor can
        answer a pending request but can never create one or alter gate
        placement.

        **Scope enforcement (D8).** Permission/form responses require
        `hitl:respond` or `*`. Human-only responses require exact
        `hitl:respond:human`; `*` does not satisfy it. The 403 body does NOT
        reveal which scopes the token holds.

        Writes a `token_audit_log` row with scope `hitl:respond` for
        permission/form or `hitl:respond:human` for human-only responses, and
        `project_id` equal to the server-derived run project.
      operationId: extRespondRunHitl
      security:
        - projectToken: []
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: hitlRequestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtHitlRespondBody" }
            examples:
              permission-select:
                summary: Approve a pending permission
                value:
                  optionId: "allow"
              form-typed:
                summary: Structured form response with confidence
                value:
                  response:
                    approved: true
                    comments: "lgtm"
                  confidence: 0.9
      responses:
        "200":
          description: |
            Response durably recorded. For permission, the supervisor deferred
            was resolved; for form, the input artifact was written and the
            runner was queued. The runner (not this route) owns the
            `NeedsInput → Running` transition.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtHitlRespondResponse" }
        "202":
          description: |
            Idle-resume scheduled — the run was checkpointed (`NeedsInputIdle`)
            and a fresh supervisor session was spawned to deliver against the
            new request. Same-payload retries keep returning 202 until
            auto-delivery completes, then return 200 idempotent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtHitlRespondResponse" }
        "401":
          $ref: "#/components/responses/TokenUnauthorized"
        "403":
          $ref: "#/components/responses/HitlForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            `CONFLICT` or `PRECONDITION`. In addition to existing stale/claimed
            outcomes, every `schema.review === true` request is refused before
            response delivery; use the authenticated Review Workspace to view
            code and preview verified feedback.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtErrorBody" }
        "410":
          description: |
            Terminal idle-resume failure (`HITL_TIMEOUT`/`CHECKPOINT`): the
            `NeedsInputIdle` run could not be resumed to deliver the response
            and was transitioned to a terminal state. Not retryable. Surfaced
            verbatim from the shared `respondToHitl` service (same as the
            session-auth respond route).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtErrorBody" }
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          description: |
            Retryable transient failure (`EXECUTOR_UNAVAILABLE`): the supervisor
            was unreachable for permission delivery, the idle-resume spawn
            failed retryably, or the form input artifact could not be written.
            Safe to retry. Surfaced verbatim from the shared `respondToHitl`
            service.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtErrorBody" }

  /api/v1/ext/projects/{slug}/tasks/{taskId}/human-asks:
    post:
      tags: [hitl]
      summary: Ask a human a task-bound clarification
      description: |
        **ADR-136 (Implemented).** Requires an authenticated attached agent token
        with exact `hitl:request`. `slug` derives the project; `taskId` is
        verified to belong to it. The source agent and source standalone run are
        derived from token/server state only and are never accepted in the body.

        The body is a strict object with a bounded question, the existing
        MAIster `FormSchemaV1` grammar, and optional re-trigger mode. The server
        persists a durable `pending_termination` intent before deleting the
        source supervisor session. It returns 201 only after activation has
        terminalized the source run; a same-payload active replay is 200; a
        durable still-pending or retryable activation is 202. No response,
        schema, question, or answer body is logged.
      operationId: extCreateTaskHumanAsk
      security:
        - projectToken: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtHumanAskBody" }
            examples:
              request-agent-retrigger:
                value:
                  question: "Which deployment target should this task use?"
                  schema:
                    schemaVersion: 1
                    fields:
                      - name: target
                        type: enum
                        required: true
                        options: [staging, production]
                  reTriggerMode: agent
      responses:
        "201":
          description: Fully active question; source standalone run is terminally Done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtHumanAskResponse" }
        "200":
          description: Idempotent replay of the same active request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtHumanAskResponse" }
        "202":
          description: Durable request awaits or retries source-session termination; not Inbox-visible.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtHumanAskResponse" }
        "401":
          $ref: "#/components/responses/TokenUnauthorized"
        "403":
          $ref: "#/components/responses/HitlForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          description: Retryable supervisor termination failure; intent remains durable and unactivated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtErrorBody" }

components:
  securitySchemes:
    projectToken:
      type: http
      scheme: bearer
      description: |
        External API bearer token. Format: `mai_` + base64url(randomBytes(32)).
        Stored as sha256 hex at rest; never logged or streamed. Lookup is by
        the 12-character prefix; verification uses `timingSafeEqual`.
        Project-bound tokens carry `project_id` and must match the addressed
        project. Global personal user tokens carry `project_id = NULL`, require
        an active/password-clear owner, and authorize through that owner's
        current project access. A valid, active, non-expired, non-revoked token
        must hold the route's required scope or `*`, except exact
        `hitl:respond:human`, which `*` never implies. Missing scope returns
        403 without revealing held scopes. Token failures (invalid, expired,
        revoked, wrong-project, inaccessible-project) map to 401 or 404 per
        the existence-hide policy.

  responses:
    TokenUnauthorized:
      description: |
        Missing, invalid, expired, revoked, ownerless, inactive-owner, or
        password-change-required bearer token. Invalid prefix/hash mismatch,
        expired, revoked, and unusable-owner failures return 401.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ExtErrorBody" }
    NotFound:
      description: |
        Resource not found, or the token's project does not own the addressed
        resource. For global personal tokens, this also covers projects the
        owner cannot currently access. Existence-hide cross-project access
        returns 404, not 403.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ExtErrorBody" }
    UnprocessableEntity:
      description: Request body failed schema validation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ExtErrorBody" }
    Conflict:
      description: |
        The request conflicts with current resource state — e.g. reporting a
        gate on a run that has already finished (`Done`/`Abandoned`/`Crashed`/
        `Failed`), or a task/run create/launch precondition conflict (task not
        in `Backlog`, project archived, branch/worktree taken). Code `CONFLICT`
        or `PRECONDITION`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ExtErrorBody" }
    HitlForbidden:
      description: |
        Access refused (`UNAUTHORIZED`). Common cases:

          - **Missing scope** — the token lacks the route's required scope and
            does not hold `*`. The body NEVER reveals which scopes the token
            holds.
          - **Exact human scope** — `hitl:respond:human` is required for
            `human` responses; `*` alone is insufficient.
          - **Actor-kind gate (D7, respond only)** — a project token,
            project-scoped user token, or agent token attempted to answer a
            human-only request. Those token actors may answer only
            `kind ∈ {permission, form}`.
          - **Wrong token kind (inbox only)** — `/api/v1/ext/hitl` requires a
            global personal user token; project/agent/project-scoped tokens
            return 403.

        Cross-project access does NOT use 403 — it hides existence (404).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ExtErrorBody" }
    AgentMemoryForbidden:
      description: |
        (ADR-152) Access refused (`UNAUTHORIZED`). The write path fails closed on
        every authorization axis, and the body never reveals which one:

          - the token is not an agent token, or carries no `agentId`;
          - the agent has no `agent_project_links` row for the token's project
            (detached);
          - the attachment's `memory_enabled` is `false`;
          - the token lacks `agent_memory:write`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ExtErrorBody" }
    EmbeddingUnavailable:
      description: |
        (ADR-122) Transient embedding-provider outage after bounded retry
        (timeout / 429 / 5xx / network / malformed response). Code
        `EMBEDDING_UNAVAILABLE` — retryable ONLY: the caller may retry or check
        the platform embedding-provider configuration. A deterministic provider
        4xx (400/401/403/404/422) maps to 422 `CONFIG` instead, never this
        response. Secrets are never included.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ExtErrorBody" }

  schemas:
    ExtErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code.
        message:
          type: string
          description: Human-readable error message.

    ExtAgentMemoryState:
      type: object
      description: |
        (ADR-152) The current state of one agent's `memory.md` for its bound
        project. An absent file is reported as `content: ""` with a `null`
        `hash` and `updatedAt` — the first-writer state.
      required: [content, hash, sizeChars, updatedAt]
      additionalProperties: false
      properties:
        content:
          type: string
        hash:
          type: string
          nullable: true
          description: sha256 hex over the exact content bytes; `null` when absent.
        sizeChars:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time
          nullable: true

    ExtAgentMemoryConflictBody:
      type: object
      description: (ADR-152) CAS-loss body — carries the current state to merge against.
      required: [code, message, current]
      properties:
        code:
          type: string
          enum: [CONFLICT]
        message:
          type: string
        current:
          $ref: "#/components/schemas/ExtAgentMemoryState"

    ExtEvaluationContext:
      type: object
      description: Server-derived judge attempt context (ADR-142 D10).
      required: [attempt, method, candidates, match, evidence, digests]
      properties:
        attempt:
          type: object
          required: [id, role, ordinal]
          properties:
            id: { type: string }
            role: { type: string }
            ordinal: { type: integer }
        method:
          nullable: true
          type: object
          properties:
            qualifiedId: { type: string }
            criteria:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  weight: { type: number }
                  scale:
                    type: object
                    properties:
                      min: { type: integer }
                      max: { type: integer }
        candidates:
          type: array
          description: |
            Blind candidate labels in deterministic presentation order. For a
            pairwise attempt, only the match pair's two labels.
          items: { type: string }
        match:
          nullable: true
          type: object
          description: |
            (ADR-147/150) Pairwise only — which blinded candidate is match side
            `a` and which is `b`; the submitted `winner` pick refers to these
            sides. Null for a scalar attempt.
          required: [a, b]
          properties:
            a: { type: string }
            b: { type: string }
        evidence:
          type: object
          properties:
            itemCount: { type: integer }
            readMaxBytes: { type: integer }
        digests:
          type: object
          properties:
            prompt: { type: string, nullable: true }
            schema: { type: string, nullable: true }

    ExtEvaluationEvidenceItem:
      type: object
      required: [id, kind, digest, coverageClass]
      properties:
        id: { type: string }
        candidate: { type: string, nullable: true }
        kind: { type: string }
        digest: { type: string }
        bytes: { type: integer, nullable: true }
        coverageClass: { type: string }

    ExtEvaluationEvidenceList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ExtEvaluationEvidenceItem" }
        nextCursor: { type: string, nullable: true }

    ExtEvaluationEvidenceRead:
      type: object
      required: [itemId, content, truncated, offset]
      properties:
        itemId: { type: string }
        content: { type: string }
        truncated: { type: boolean }
        offset: { type: integer }

    ExtEvaluationObjectiveResults:
      type: object
      required: [checks, metrics]
      properties:
        checks:
          type: array
          items:
            type: object
            properties:
              candidate: { type: string, nullable: true }
              checkId: { type: string }
              checkVersion: { type: string }
              status: { type: string }
              reason: { type: string, nullable: true }
        metrics:
          type: array
          items:
            type: object
            properties:
              candidate: { type: string, nullable: true }
              metricId: { type: string }
              metricVersion: { type: string }
              status: { type: string }
              value: { type: object, nullable: true }
              unit: { type: string, nullable: true }

    ExtEvaluationResultBody:
      type: object
      required: [criteria]
      additionalProperties: false
      description: |
        Strict per-criterion judge submission. Attribution is server-derived and
        MUST NOT appear in the body (ADR-142 D12).

        **(ADR-150, Implemented — Phase 1.5)** `winner` carries the head-to-head
        pick for a pairwise attempt. Its presence is validated against the
        BOUND attempt, fail-closed in both directions: supplying `winner` on a
        non-pairwise attempt is `422`, and omitting it on a pairwise attempt is
        also `422`. The pick names the attempt's own match sides — the body
        never names participant ids, because the match identity is
        server-derived from the attempt row exactly like every other
        attribution field. `criteria` stays required for pairwise attempts: the
        rubric is still scored, and the pick is the additional head-to-head
        verdict the tournament aggregates.
      properties:
        winner:
          type: string
          enum: [a, b, tie]
          description: |
            Pairwise pick, relative to the bound attempt's `match_a`/`match_b`.
            Required for a pairwise attempt, rejected for any other.
        criteria:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [criterionId]
            properties:
              criterionId: { type: string }
              state:
                type: string
                enum: [scored, insufficient_evidence, not_applicable]
              score: { type: number, nullable: true }
              rationale: { type: string, nullable: true }
              confidence: { type: number, nullable: true }
              evidenceRefs:
                type: array
                items: { type: string }
              objectiveRefs:
                type: array
                items: { type: string }

    ExtEvaluationResultResponse:
      type: object
      required: [valid, attemptId]
      properties:
        valid: { type: boolean }
        attemptId: { type: string }
        panelAdvanced: { type: boolean }
        violations:
          type: array
          items: { type: string }

    ExtMemoryItem:
      oneOf:
        - { $ref: "#/components/schemas/ExtMemoryOwnedItem" }
        - { $ref: "#/components/schemas/ExtMemoryIndexedItem" }
      discriminator:
        propertyName: tier
        mapping:
          owned: "#/components/schemas/ExtMemoryOwnedItem"
          indexed: "#/components/schemas/ExtMemoryIndexedItem"
      description: (ADR-122/127) Recalled Brain hit union.

    ExtMemoryPointer:
      type: object
      description: Canonical pointer to indexed source truth; never a file-content payload.
      required: [sourcePath, stableId]
      properties:
        sourcePath:
          type: string
          description: Repo-relative path opened through the project files API/viewer.
        stableId:
          type: string
          description: Stable chunk id inside the source.
        sourceRange:
          type: object
          nullable: true
          additionalProperties: false
          properties:
            startLine:
              type: integer
              minimum: 1
            endLine:
              type: integer
              minimum: 1

    ExtMemoryOwnedItem:
      type: object
      description: (ADR-122, Implemented) A recalled owned-tier brain item.
      required:
        [tier, itemId, kind, title, content, confidence, score, createdAt]
      properties:
        tier:
          type: string
          enum: [owned]
        itemId: { type: string }
        kind:
          type: string
          enum: [lesson, observation, state_fact, decision, direction]
        title: { type: string }
        content: { type: string }
        confidence:
          type: number
          minimum: 0
          maximum: 1
        score:
          type: number
          description: Hybrid rank score for this hit (vector + lexical + confidence terms).
        tags:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: NULL for non-decayed state_fact.
        provenance:
          type: object
          nullable: true
          description: Provenance pointers (ids only, no secrets).
          properties:
            runId: { type: string, nullable: true }
            gateKind: { type: string, nullable: true }

    ExtMemoryIndexedItem:
      type: object
      description: (ADR-127, Implemented) A recalled indexed chunk with canonical pointer.
      required:
        [tier, chunkId, kind, title, preview, confidence, score, pointer]
      properties:
        tier:
          type: string
          enum: [indexed]
        chunkId: { type: string }
        kind:
          type: string
          enum:
            - markdown_section
            - openapi_operation
            - asyncapi_operation
            - sql_statement
            - flow_node
            - package_entry
            - agent_md
            - agent_doc
            - code_symbol
            - text
        title: { type: string }
        preview:
          type: string
          maxLength: 800
          description: Capped preview of indexed content; file content opens through the project files API.
        confidence:
          type: number
          minimum: 0
          maximum: 1
        score:
          type: number
        pointer:
          $ref: "#/components/schemas/ExtMemoryPointer"

    ExtMemoryCluster:
      type: object
      description: (ADR-128, Implemented) Recurring evidence cluster for the improver.
      required: [clusterHash, kind, recurrence, evidenceItemIds, summary]
      properties:
        clusterHash: { type: string }
        kind:
          type: string
          enum: [lesson, observation, state_fact]
        recurrence:
          type: integer
          minimum: 2
        evidenceItemIds:
          type: array
          minItems: 1
          items: { type: string }
        summary:
          type: string
          maxLength: 1000
        provenance:
          type: object
          additionalProperties: true

    ExtMemoryProposalBody:
      type: object
      description: (ADR-128, Implemented) Submit an improvement proposal.
      required: [kind, draft]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [rule, skill, flow, adr, roadmap, state]
        evidenceItemIds:
          type: array
          items: { type: string }
          default: []
        draft:
          type: object
          additionalProperties: true
          description: |
            Proposed authored draft or task payload. Server autonomy may
            auto-draft low-risk catalog proposals, but this route never
            publishes or writes repo files.
        blastRadius:
          type: string
          enum: [low, medium, high]
          default: medium
        clusterHash:
          type: string
          nullable: true
        rationale:
          type: string
          maxLength: 4000

    ExtMemoryProposalResult:
      type: object
      description: (ADR-128, Implemented) Proposal result.
      required: [proposalId, status, idempotent, authoredDraftId]
      properties:
        proposalId: { type: string }
        status:
          type: string
          enum: [pending, accepted, rejected, applied]
        idempotent:
          type: boolean
          description: true when an existing `clusterHash` proposal was returned.
        authoredDraftId:
          type: string
          nullable: true
          description: Linked unpublished authored draft id when auto-drafted.

    ExtMemoryRetainBody:
      type: object
      description: |
        (ADR-122/127) Retain an owned-tier memory. The body carries NO project id —
        `projectId` is derived server-side from the token + slug. `decision` and
        `direction` are accepted only when project home-resolution says Brain is
        the home; when a canonical source covers the kind, the route refuses
        `CONFIG` and points the caller at the proposal path.
      required: [content, kind]
      additionalProperties: false
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 32000
          description: The knowledge to retain (embedded; oversize content is split).
        kind:
          type: string
          enum: [lesson, observation, state_fact, decision, direction]
        title:
          type: string
          minLength: 1
          maxLength: 512
          description: Optional short title; derived from content when omitted.
        tags:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 64

    ExtMemoryRetainResult:
      type: object
      description: (ADR-122/127, Implemented) Outcome of a retain call.
      required: [item, reinforced]
      properties:
        reinforced:
          type: boolean
          description: true = an existing near lesson/observation was reinforced; false = exact no-op, insert, or state_fact supersede-on-change.
        item:
          type: object
          required: [id, kind, status]
          properties:
            id: { type: string }
            kind:
              type: string
              enum: [lesson, observation, state_fact, decision, direction]
            status:
              type: string
              enum: [active]

    ExtTriageBody:
      type: object
      description: |
        (M34 — Implemented; ADR-112 `flag`/`enqueue` — Implemented) Triage body —
        at least one field. Every provided field is allow-list validated. A
        verdict body stamps `triage_status='triaged'`; a `flag: true` body
        stamps `triage_status='flagged'`.

        Cross-field rules (enforced server-side; OpenAPI 3.0 cannot express
        them declaratively), violations → 422 `CONFIG`:
          - `flag` is **mutually exclusive** with the verdict fields (`flowId`,
            `runnerId`, `baseBranch`, `targetBranch`, `promotionMode`).
          - `enqueue: true` is valid ONLY alongside a verdict that yields a
            `flowId` (this body's `flowId` or the task's existing
            `tasks.flow_id`); never with `flag`.
      minProperties: 1
      additionalProperties: false
      properties:
        flowId:
          type: string
          minLength: 1
          description: |
            Flow to run the task with. Accepted as EITHER the flow's `flows.id`
            UUID OR the project's human `flows.flow_ref_id` (e.g. `bugfix` — the
            value returned as `ExtFlowSummary.ref`); both resolve to the same
            flow, and the resolved UUID is what is persisted to `tasks.flow_id`.
            Must belong to the project and (ADR-112, Implemented) be launchable
            (enabled + trusted + not pin-divergent). A value matching neither
            form is refused 422 `CONFIG`.
        runnerId:
          type: string
          minLength: 1
          description: Verdict runner; must be an enabled catalog runner.
        baseBranch:
          type: string
          minLength: 1
          maxLength: 255
          description: Base branch the run worktree is created from (git ref-name shape).
        targetBranch:
          type: string
          minLength: 1
          maxLength: 255
          description: Promotion target branch (git ref-name shape).
        promotionMode:
          type: string
          enum: [local_merge, pull_request]
        flag:
          type: boolean
          description: |
            (ADR-112, Implemented) When `true`, mark the task `flagged` for human
            review (held — not launchable). Mutually exclusive with the verdict
            fields above; `flag: true` alone is a valid body.
        enqueue:
          type: boolean
          description: |
            (ADR-112, Implemented) When `true`, set the task to auto-launch after
            triage (`tasks.launch_mode = 'auto'`); the `auto_launch_triaged`
            tick performs the launch once the task is launchable. Valid only
            with a verdict that yields a `flowId`; never with `flag`.
        priority:
          type: string
          nullable: true
          enum: [low, normal, high, urgent, null]
          description: |
            (ADR-121, Implemented) Task priority backing the criticality
            dictionary. INDEPENDENT of `flag` and the verdict fields — settable
            alongside either, or alone (a body with only `priority`/`confidence`
            is a pure update that does NOT stamp `triage_status`). `null` clears
            to `'normal'`.
        confidence:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: |
            (ADR-121, Implemented) ADVISORY triage confidence (0..1) — stored,
            Observatory-fed, NEVER read by any admission/launch/routing path
            (INV-5). Out-of-range → 422 `CONFIG`. `null` clears. Independent of
            `flag`.

    ExtFlowSummary:
      type: object
      description: |
        (ADR-112, Implemented) One launchable flow available to assign in a triage
        verdict. Projected from the flow's pinned-revision manifest
        (`flow.yaml`); `metadata` carries the routing hints the triager matches
        a task against. Only flows with `enablementState ∈ {Enabled,
        UpdateAvailable}` ∧ `trustStatus ≠ untrusted` appear in the list.
      required: [id, ref]
      additionalProperties: false
      properties:
        id:
          type: string
          description: |
            The flow's UUID (`flows.id`). EITHER this or `ref` may be passed
            back as a request body's `flowId` (e.g. `ExtTriageBody.flowId`) —
            both resolve to this flow.
        ref:
          type: string
          description: |
            Package-qualified flow reference (`<flowRefId>`), stable across the
            package's revisions. Accepted interchangeably with `id` wherever a
            `flowId` is read from a request body.
        metadata:
          type: object
          description: |
            Routing metadata from the manifest `metadata` block. All fields are
            optional (a flow may declare none).
          additionalProperties: false
          properties:
            title:
              type: string
              description: Human-readable flow title.
            summary:
              type: string
              description: Short description of what the flow does.
            route_when:
              type: string
              description: Author-declared applicability hint ("use this flow when …").
            labels:
              type: array
              items: { type: string }
              description: Free-form classification labels.

    ExtRunnerSummary:
      type: object
      description: |
        (ADR-112, Implemented) One enabled platform ACP runner available to assign
        in a triage verdict. Runners are platform-scoped (not project-scoped);
        only `enabled = true` runners appear.
      required: [id, adapter, model, capabilityAgent, readinessStatus]
      additionalProperties: false
      properties:
        id:
          type: string
          description: The runner id (the value passed back as `ExtTriageBody.runnerId`).
        adapter:
          type: string
          description: The ACP adapter family backing this runner.
        model:
          type: string
          description: The model the runner targets.
        capabilityAgent:
          type: string
          description: The capability-agent identity the adapter exposes.
        readinessStatus:
          type: string
          enum: [Unknown, Ready, NotReady]
          description: Cached runner readiness from supervisor diagnostics.

    ExtRelationOpBody:
      type: object
      description: |
        (M34 — Implemented) Relation create/remove body — mirrors the web
        route: the canonical direction is `(from = URL task, kind, to)`.

        **(Implemented — ADR-155)** The target end is addressed by EXACTLY ONE of
        `toNumber` (per-project number, confined to the URL-param project) or
        `toTaskKey` (platform-unique `KEY-N`, may resolve to a DIFFERENT
        project). OpenAPI 3.0.3 has no XOR keyword, so the exclusivity is
        expressed as a `oneOf` over the two required-variants: supplying both
        matches both branches and supplying neither matches none — either way
        the document is invalid, and the route refuses `422 CONFIG`.
      required: [kind]
      additionalProperties: false
      oneOf:
        - required: [toNumber]
        - required: [toTaskKey]
      properties:
        kind:
          type: string
          enum: [blocks, depends_on, parent_of, requires, duplicate_of]
          description: |
            (ADR-112) `duplicate_of` marks the URL task a duplicate of the
            target — a non-blocking dedup annotation used by triage.

            **(Implemented — ADR-155)** `requires` is settable here. The enum is
            now the SAME five kinds on every surface (internal route, this ext
            route, and the MCP `relation_add` / `relation_remove` tools);
            because this schema is shared by POST and DELETE, the previous
            4-kind enum made an orchestrator-minted `requires` edge visible
            through `relation_list` but **unremovable** over ext/MCP.
            `requires` is **success-gated**: unlike `depends_on` it does NOT
            release when the counterpart reaches `Abandoned` or `Failed`, so a
            wrong `requires` edge blocks its dependent until a human removes
            it. Reach for `depends_on` when the self-healing kind is wanted.
        toNumber:
          type: integer
          minimum: 1
          description: |
            The other task's per-project number (`KEY-N`'s N), resolved
            strictly within the URL-param project. Mutually exclusive with
            `toTaskKey`.
        toTaskKey:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9]*-[0-9]+$'
          description: |
            **(Implemented — ADR-155)** Platform-unique `KEY-N` address
            (`projects.task_key` + `tasks.number`), case-insensitive on the key
            part. Mutually exclusive with `toNumber`. May name a task in
            ANOTHER project — see the route's 403/404 arms for the
            authorization and existence rules.

    ExtRelationView:
      type: object
      description: |
        (M34 — Implemented) One relation touching the addressed task. `role`
        says which end the URL task is; `other` is the opposite end.
      required: [kind, role, other]
      properties:
        kind:
          type: string
          enum: [blocks, depends_on, parent_of, requires, duplicate_of]
          description: |
            Any relation kind touching the task is returned unfiltered —
            including the system-created `requires` (from `run_plan`) and the
            `duplicate_of` dedup annotation.
        role:
          type: string
          enum: [from, to]
        other:
          type: object
          required: [taskId, number, title, status, redacted]
          properties:
            taskId: { type: string, format: uuid }
            number: { type: integer, minimum: 1 }
            taskKey: { type: string }
            title:
              type: string
              nullable: true
              description: |
                `null` when `redacted` is true — see below.
            status:
              type: string
              nullable: true
              enum: [Backlog, InFlight, Done, Abandoned, null]
              description: |
                `null` when `redacted` is true.
            redacted:
              type: boolean
              description: |
                (Implemented — ADR-155/156) True when this counterpart lives in
                a DIFFERENT project that the caller is not authorized to read,
                in which case `title` and `status` are `null`.

                A relation may cross projects, so this list can surface a
                foreign task. The EDGE and its address (`taskKey` + `number`)
                are always returned — ADR-155 makes the `blocked` chip's
                `KEY-N` the only mitigation for a wedged success-gated
                `requires` edge, so hiding the row would break that contract.
                The CONTENT is what is gated.

                Authorization per counterpart project: same project as the URL
                → visible; agent token → the ADR-156 reach grant evaluated for
                `relations:read`; NULL-project user token → the owner's
                `readBoard`; project-bound user/project token → always redacted
                outside its own project.

    ExtCreateCommentBody:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 10000
          description: |
            Markdown comment body. `KEY-N` tokens outside code fences,
            inline code, and existing links are expanded to task links at
            write time; unresolved tokens stay literal.

            (ADR-151, Implemented) `@<agentId>` handles follow the same
            inertness rules and expand to
            `[@<agentId>](/agents/<agentId>)`. Use the canonical
            `@<packageName>:<stem>` form; a bare `@<stem>` resolves only when
            exactly one eligible agent in this project carries that stem. A
            resolved, summonable mention launches at most one directed agent
            run on this task; the response's `mentionedAgents` reports which
            handles resolved and whether each was summonable.

    MentionedAgentDTO:
      type: object
      description: |
        (ADR-151, Implemented) One agent handle that resolved at comment-write
        time. `summonable` is the write-time truth of
        `Summonable(agent, project)`; `false` means the handle expanded to a
        chip but nothing will launch (a project `admin` enables a mention
        trigger in project settings to change that). The consumer re-checks
        eligibility at consume time, so this flag is a report, not a
        guarantee.
      required: [id, name, summonable]
      properties:
        id:
          type: string
          description: Package-qualified agent id, `<packageName>:<stem>`.
        name: { type: string }
        summonable: { type: boolean }

    CommentDTO:
      type: object
      description: |
        (ADR-078, Implemented) Comment projection. `body` is markdown with
        mentions already expanded. The actor pair is `('agent', agentId)` for
        agent tokens, `('user', id)` for
        user-owned tokens / session users, `('system', null)` for ownerless
        project tokens; `label` is resolved at read time.
      required: [id, taskId, body, actor, createdAt]
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        body:
          type: string
          description: |
            Markdown with mentions already expanded at write time.

            (ADR-151, Implemented) Two expanded forms appear here and a
            consumer MUST know them apart: `[KEY-N](/projects/<slug>/tasks/<n>)`
            is a real navigable task link, while
            `[@<agentId>](/agents/<agentId>)` is an AGENT MENTION whose href
            is a marker, NOT a route — `/agents/<agentId>` does not exist and
            `/agents` is admin-only. Render it as a chip (match `^/agents/`
            with an `@`-prefixed label) or suppress the link; following it
            lands on 404/403. The shape is stable and resolution is never
            re-run at read time.
        actor:
          type: object
          required: [type, id, label]
          properties:
            type:
              type: string
              enum: [user, agent, system]
            id:
              type: string
              nullable: true
            label:
              type: string
        createdAt: { type: string, format: date-time }

    TaskDTO:
      type: object
      description: |
        External projection of a task. Never includes `acp_session_id`,
        worktree paths, `token_hash`, or supervisor-internal handles.
      required:
        - id
        - title
        - prompt
        - status
        - stage
        - flowId
        - attemptNumber
        - createdByUserId
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          minimum: 1
          description: |
            (ADR-078, Implemented) Per-project task number; `KEY-N` =
            `taskKey` + `-` + `number`. Additive — present once migration
            `0041` lands (backfill makes it NOT NULL).
        taskKey:
          type: string
          pattern: "^[A-Z][A-Z0-9]{1,9}$"
          description: |
            (ADR-078, Implemented) The owning project's platform-unique task
            key. Additive alongside `number`.
        title:
          type: string
        prompt:
          type: string
        status:
          type: string
          description: Task lifecycle status on the board.
          enum: [Backlog, InFlight, Done]
        stage:
          type: string
          description: Finer-grained stage within the task lifecycle.
        flowId:
          type: string
          description: |
            The configured flow's UUID (`flows.id`) — always the resolved id,
            even when the task was created or triaged using a `flow_ref_id`.
        latestRunId:
          type: string
          format: uuid
          nullable: true
          description: ID of the most recent run launched for this task, if any.
        attemptNumber:
          type: integer
          minimum: 0
          description: Number of runs launched against this task (0 = never launched).
        createdByUserId:
          type: string
          format: uuid
          nullable: true
          description: Human owner attributed to a user-owned token; null for project tokens and legacy rows.
        createdAt:
          type: string
          format: date-time

    RunDTO:
      type: object
      description: |
        External projection of a run. Never includes `acp_session_id`,
        worktree paths, `token_hash`, or supervisor-internal handles.
      required:
        - id
        - taskId
        - projectId
        - status
        - flowId
        - executorId
        - startedAt
      properties:
        id:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
          nullable: true
        projectId:
          type: string
          format: uuid
        status:
          type: string
          description: Current run status.
          enum:
            - Pending
            - Running
            - NeedsInput
            - NeedsInputIdle
            - HumanWorking
            - Review
            - Crashed
            - Done
            - Abandoned
            - Failed
        flowId:
          type: string
          nullable: true
          description: Flow id used for this run (from the pinned revision at launch time).
        executorId:
          type: string
          format: uuid
          description: Resolved executor id used for this run.
        currentStepId:
          type: string
          nullable: true
          description: The id of the step currently executing, if any.
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        prState:
          type: string
          nullable: true
          enum: [open, merged, closed]
          description: Provider PR state (ADR-140); `null` = never checked or no PR.
        prHasConflicts:
          type: boolean
          nullable: true
          description: Whether the PR conflicts against its target; `null` = unknown (ADR-140).
        syncAttempt:
          type: object
          nullable: true
          description: The latest branch-sync attempt for this run (ADR-141); `null` when never synced.
          additionalProperties: false
          properties:
            attempt:
              type: integer
            strategy:
              type: string
              enum: [rebase, merge]
            mode:
              type: string
              enum: [mechanical, agent]
            phase:
              type: string
              enum:
                [
                  starting,
                  rebasing,
                  agent_running,
                  verifying,
                  pushing,
                  succeeded,
                  failed,
                  aborted,
                ]
            pushed:
              type: boolean
            errorCode:
              type: string
              nullable: true

    ExtActivitySalience:
      type: string
      description: |
        Deterministic assistant-activity salience class. `suppressed` is
        internal-only and never emitted on the wire.
