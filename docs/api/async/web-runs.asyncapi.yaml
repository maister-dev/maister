asyncapi: 2.6.0
info:
  title: MAIster Web — canonical per-run SSE
  version: "1.0.0"
  description: |
    Browser-safe run notifications delivered by
    `GET /api/runs/{runId}/stream`.

    The web tier replays manager-owned PostgreSQL `execution_events` in strict,
    exclusive `runSequence` order. A local wake signal reduces latency only;
    reconnect and correctness depend solely on the durable database sequence.
    Every canonical frame has `id: <runSequence>` and a sanitized metadata
    payload. Host payloads, prompts, content, credentials, environment values,
    and filesystem paths are never forwarded to the browser. Transcript, cost,
    lifecycle, and artifact content are read from their manager-owned projections
    or authorized runtime-object routes.

    `session.stream_ready` and `session.stream_timeout` are synthetic web-tier
    messages. They have no SSE `id` and never advance a durable replay cursor.
    New work has no legacy file-backed stream branch.
  contact:
    name: MAIster maintainers
    url: https://github.com/your-org/mAIster
  license:
    name: MIT
defaultContentType: application/json
servers:
  local:
    url: http://localhost:3000
    protocol: http
    description: Local Next.js server.
channels:
  /api/runs/{runId}/stream:
    parameters:
      runId:
        description: URL-selected run UUID. Its project or private owner is derived server-side.
        schema:
          type: string
          format: uuid
    bindings:
      http:
        type: response
        method: GET
    subscribe:
      operationId: subscribeRunEvents
      summary: Replay and follow browser-safe canonical run notifications
      description: |
        Authentication is principal-derived. Project runs require the viewer
        role on the project derived from the run row. Projectless local-package
        assistant runs are restricted to their server-derived creator.

        Enrolled native evidence runs additionally require current access to
        their complete server-recorded source union. Unavailable sources or an
        incomplete capture return HTTP 409 before streaming. Each asynchronous
        event-batch read is followed by a current source check before enqueue;
        revocation closes the stream. Consumer cancellation releases wake
        waiters. No database locks span a network wait.

        Replay is exclusive of `Last-Event-ID` or the `lastEventId` query
        fallback. Invalid, negative, leading-zero, or overlong cursors return
        HTTP 400 before streaming. A default connection replays from sequence
        zero. `?replay=false` begins at the current durable tail and first emits
        `session.stream_ready`. Terminal database run states close the stream
        after already-readable canonical rows are emitted.
        Clients request context snapshots with `?context=1`. The manager sends
        the active run snapshot and, for a Flow, may send the current attempt
        snapshot on the same connection. Snapshots do not advance replay.
        Usage-only canonical frames on that connection retain their SSE ids
        and may skip unrelated invalidations. Committed compaction marker
        mutations have their own transcript revision in the snapshot.
      message:
        oneOf:
          - $ref: "#/components/messages/CanonicalRunEvent"
          - $ref: "#/components/messages/SessionStreamReady"
          - $ref: "#/components/messages/SessionStreamTimeout"
          - $ref: "#/components/messages/ContextSnapshot"
  /api/runs/{runId}/peek/stream:
    parameters:
      runId:
        description: Authorized immutable workbench anchor.
        schema:
          type: string
    subscribe:
      operationId: subscribeRunPeekChanges
      summary: Designed — content-free workbench change notifications
      description: Active browser session. At most the anchor and admitted selected descendant receive
        run.changed ticks. No SSE id/replay cursor; ready/resync causes canonical projection reads.
        Designed (ADR-215/216) — wait or autonomy writes use the same content-free
        invalidation after commit, including waits with no execution host event.
        New metadata and final projection changes remain observable after execution settles. HTTP
        heartbeats perform no data polling.
      message:
        oneOf:
          - $ref: "#/components/messages/RunPeekReady"
          - $ref: "#/components/messages/RunPeekChanged"
          - $ref: "#/components/messages/RunPeekRunChanged"
          - $ref: "#/components/messages/RunPeekResync"
          - $ref: "#/components/messages/RunPeekSelectionUnavailable"

components:
  messages:
    ContextSnapshot:
      name: session.context_snapshot
      summary: Safe context projection sent without an SSE id.
      payload:
        $ref: "#/components/schemas/ContextSnapshotEvent"
    RunPeekReady:
      name: RunPeekReady
      payload:
        $ref: "#/components/schemas/RunPeekReady"
    RunPeekChanged:
      name: RunPeekChanged
      payload:
        $ref: "#/components/schemas/RunPeekChanged"
    RunPeekRunChanged:
      name: RunPeekRunChanged
      payload:
        $ref: "#/components/schemas/RunPeekRunChanged"
    RunPeekResync:
      name: RunPeekResync
      payload:
        $ref: "#/components/schemas/RunPeekResync"
    RunPeekSelectionUnavailable:
      name: RunPeekSelectionUnavailable
      payload:
        $ref: "#/components/schemas/RunPeekSelectionUnavailable"
    CanonicalRunEvent:
      name: canonical.run.event
      title: Manager-owned canonical run event metadata
      contentType: application/json
      payload:
        $ref: "#/components/schemas/BrowserCanonicalRunEvent"
    SessionStreamReady:
      name: session.stream_ready
      title: Synthetic live-tail readiness signal
      contentType: application/json
      payload:
        $ref: "#/components/schemas/SessionStreamReadyEvent"
    SessionStreamTimeout:
      name: session.stream_timeout
      title: Synthetic quiet-window timeout
      contentType: application/json
      payload:
        $ref: "#/components/schemas/SessionStreamTimeoutEvent"
  schemas:
    ContextSnapshotEvent:
      type: object
      additionalProperties: false
      required:
        [type, runId, runSessionId, incarnationId, nodeAttemptId, lifecycleSequence,
         contextSequence, transcriptSequence, usage, activeCompactions,
         completedCompactions, coverage, windowAdvisory]
      properties:
        type: { type: string, const: session.context_snapshot }
        runId: { type: string, format: uuid }
        runSessionId: { type: [string, "null"] }
        incarnationId: { type: [string, "null"] }
        nodeAttemptId: { type: [string, "null"] }
        lifecycleSequence: { $ref: "#/components/schemas/NullableContextSequence" }
        contextSequence: { $ref: "#/components/schemas/NullableContextSequence" }
        transcriptSequence:
          description: Greatest canonical sequence recorded for a compaction marker or its display evidence in this transcript scope.
          allOf:
            - $ref: "#/components/schemas/NullableContextSequence"
        transcriptRevision:
          description: Monotonic revision for committed compaction marker and evidence changes in the whole-run or exact-attempt transcript.
          allOf:
            - $ref: "#/components/schemas/NullableContextSequence"
        bindingObservedAt:
          type: [string, "null"]
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{6}Z$'
          description: Database observation time for physical selection, including an empty selection, with UTC microsecond precision. Used to compare different bindings. Does not advance SSE or trigger an event by itself.
        usage:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [used, size, sizeSource, observedAt, sourceSequence]
              properties:
                used: { type: integer, minimum: 0, maximum: 9007199254740991 }
                size: { type: integer, minimum: 1, maximum: 9007199254740991 }
                sizeSource: { type: string, enum: [agent_reported] }
                observedAt: { type: string, format: date-time }
                sourceSequence: { type: string, pattern: "^(0|[1-9][0-9]{0,18})$" }
        activeCompactions: { type: integer, minimum: 0 }
        completedCompactions: { type: integer, minimum: 0 }
        coverage: { type: string, enum: [from_incarnation_start, partial] }
        windowAdvisory:
          type: [string, "null"]
          enum: [window_unverified, null]
        configuredWindowTokens: { type: [integer, "null"], minimum: 1, maximum: 9007199254740991 }
      example:
        type: session.context_snapshot
        runId: 54c27b5c-509a-41a3-a143-c429389e813d
        runSessionId: rs-1
        incarnationId: inc-1
        nodeAttemptId: null
        lifecycleSequence: "38"
        contextSequence: "42"
        transcriptSequence: "40"
        transcriptRevision: "2"
        bindingObservedAt: "2026-11-20T12:00:05.628139Z"
        usage:
          used: 72000
          size: 100000
          sizeSource: agent_reported
          observedAt: "2026-11-20T12:00:00Z"
          sourceSequence: "41"
        activeCompactions: 1
        completedCompactions: 0
        coverage: from_incarnation_start
        windowAdvisory: null
    NullableContextSequence:
      type: [string, "null"]
      pattern: "^(0|[1-9][0-9]{0,18})$"
    RunPeekReady:
      type: object
      additionalProperties: false
      required:
        - type
        - anchorRunId
        - selectedRunId
        - selectionState
      properties:
        type:
          const: peek.ready
        anchorRunId:
          type: string
        selectedRunId:
          type:
            - string
            - "null"
        selectionState:
          enum:
            - none
            - ready
            - unavailable
    RunPeekChanged:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          const: peek.changed
    RunPeekRunChanged:
      type: object
      additionalProperties: false
      required:
        - type
        - runId
        - kind
      properties:
        type:
          const: run.changed
        runId:
          type: string
        kind:
          enum:
            - execution
            - summary
            - transcript
    RunPeekResync:
      type: object
      additionalProperties: false
      required:
        - type
        - reason
      properties:
        type:
          const: peek.resync
        reason:
          enum:
            - listener_reconnected
            - visibility
            - manual
            - transport
    RunPeekSelectionUnavailable:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          const: peek.selection_unavailable
    BrowserCanonicalRunEvent:
      type: object
      additionalProperties: false
      required:
        - type
        - eventId
        - runSequence
        - occurredAt
        - hostSessionId
      properties:
        type:
          type: string
          minLength: 1
          maxLength: 128
        eventId:
          type: string
          format: uuid
        runSequence:
          type: string
          pattern: "^(0|[1-9][0-9]{0,18})$"
        occurredAt:
          type: string
          format: date-time
        hostSessionId:
          type: string
          nullable: true
        contextUsageOnly:
          type: boolean
          enum: [true]
          description: On opt-in streams, preserve this frame's durable cursor without invalidating transcript or run detail.
      example:
        type: session.command
        eventId: 59d83570-19f7-4b80-9ab8-d65a22e4f244
        runSequence: "42"
        occurredAt: 2026-09-04T12:00:00.000Z
        hostSessionId: session-opaque-17
    SessionStreamReadyEvent:
      type: object
      additionalProperties: false
      required: [type, replay]
      properties:
        type:
          type: string
          const: session.stream_ready
        replay:
          type: boolean
          const: false
      example:
        type: session.stream_ready
        replay: false
    SessionStreamTimeoutEvent:
      type: object
      additionalProperties: false
      required: [type, reason]
      properties:
        type:
          type: string
          const: session.stream_timeout
        reason:
          type: string
          minLength: 1
      example:
        type: session.stream_timeout
        reason: no canonical events within keepalive window
    RuntimeOutputReferenceV2:
      x-implementation-status: Designed
      type: object
      additionalProperties: false
      required: [objectId, sizeBytes, contentAvailable]
      properties:
        objectId: { type: string, format: uuid }
        sizeBytes: { type: integer, minimum: 0, maximum: 9007199254740991 }
        contentAvailable: { type: boolean }
      description: |
        User-safe projection of host output references. No command/assignment,
        ACP/host-session identity, local path or raw object bytes reach browser
        events. Raw content requires the same project readRepoFiles authorization
        as the content route; denial preserves a contentAvailable=false projection.
        Existing escaped text consumers fetch authorized bounded ranges, never
        execute supplied MIME or treat an absent reference body as successful output.

# Implemented — ADR-200: task.launch_changed is a content-free transactional
# invalidation fact for intent state before a run exists. Existing attention.tick
# regions/counters and visibility filtering remain the browser wire contract;
# refetch the scoped intent receipt on invalidation/reconnect. Existing run
# execution frames remain run-bound. Compatibility launch requests return a JSON
# 202 union: an actual run receipt, or accepted:true/code:launch_pending with intentId
# and Location. Web SSE-accepting requests receive that JSON; no progress is invented.
# Pending 202 is a successful MCP result. A 503/lost response leaves acceptance
# uncertain; replay the original key and request to reconcile it.
