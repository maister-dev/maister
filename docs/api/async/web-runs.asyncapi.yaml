asyncapi: 2.6.0
info:
  title: MAIster Web — canonical per-run SSE
  version: "1.0.0"
  description: |
    Browser-safe run notifications delivered by
    `GET /api/runs/{runId}/stream`.

    The web tier replays manager-owned PostgreSQL `execution_events` in strict,
    exclusive `runSequence` order. A local wake signal reduces latency only;
    reconnect and correctness depend solely on the durable database sequence.
    Every canonical frame has `id: <runSequence>` and a sanitized metadata
    payload. Host payloads, prompts, content, credentials, environment values,
    and filesystem paths are never forwarded to the browser. Transcript, cost,
    lifecycle, and artifact content are read from their manager-owned projections
    or authorized runtime-object routes.

    `session.stream_ready` and `session.stream_timeout` are synthetic web-tier
    messages. They have no SSE `id` and never advance a durable replay cursor.
    New work has no legacy file-backed stream branch.
  contact:
    name: MAIster maintainers
    url: https://github.com/your-org/mAIster
  license:
    name: MIT
defaultContentType: application/json
servers:
  local:
    url: http://localhost:3000
    protocol: http
    description: Local Next.js server.
channels:
  /api/runs/{runId}/stream:
    parameters:
      runId:
        description: URL-selected run UUID. Its project or private owner is derived server-side.
        schema:
          type: string
          format: uuid
    bindings:
      http:
        type: response
        method: GET
    subscribe:
      operationId: subscribeRunEvents
      summary: Replay and follow browser-safe canonical run notifications
      description: |
        Authentication is principal-derived. Project runs require the viewer
        role on the project derived from the run row. Projectless local-package
        assistant runs are restricted to their server-derived creator.

        Replay is exclusive of `Last-Event-ID` or the `lastEventId` query
        fallback. Invalid, negative, leading-zero, or overlong cursors return
        HTTP 400 before streaming. A default connection replays from sequence
        zero. `?replay=false` begins at the current durable tail and first emits
        `session.stream_ready`. Terminal database run states close the stream
        after already-readable canonical rows are emitted.
      message:
        oneOf:
          - $ref: "#/components/messages/CanonicalRunEvent"
          - $ref: "#/components/messages/SessionStreamReady"
          - $ref: "#/components/messages/SessionStreamTimeout"
  /api/runs/{runId}/peek/stream:
    parameters:
      runId:
        description: Authorized immutable workbench anchor.
        schema:
          type: string
    subscribe:
      operationId: subscribeRunPeekChanges
      summary: Designed — content-free workbench change notifications
      description: Active browser session. At most the anchor and admitted selected descendant receive
        run.changed ticks. No SSE id/replay cursor; ready/resync causes canonical projection reads.
        New metadata and final projection changes remain observable after execution settles. HTTP
        heartbeats perform no data polling.
      message:
        oneOf:
          - $ref: "#/components/messages/RunPeekReady"
          - $ref: "#/components/messages/RunPeekChanged"
          - $ref: "#/components/messages/RunPeekRunChanged"
          - $ref: "#/components/messages/RunPeekResync"
          - $ref: "#/components/messages/RunPeekSelectionUnavailable"

components:
  messages:
    RunPeekReady:
      name: RunPeekReady
      payload:
        $ref: "#/components/schemas/RunPeekReady"
    RunPeekChanged:
      name: RunPeekChanged
      payload:
        $ref: "#/components/schemas/RunPeekChanged"
    RunPeekRunChanged:
      name: RunPeekRunChanged
      payload:
        $ref: "#/components/schemas/RunPeekRunChanged"
    RunPeekResync:
      name: RunPeekResync
      payload:
        $ref: "#/components/schemas/RunPeekResync"
    RunPeekSelectionUnavailable:
      name: RunPeekSelectionUnavailable
      payload:
        $ref: "#/components/schemas/RunPeekSelectionUnavailable"
    CanonicalRunEvent:
      name: canonical.run.event
      title: Manager-owned canonical run event metadata
      contentType: application/json
      payload:
        $ref: "#/components/schemas/BrowserCanonicalRunEvent"
    SessionStreamReady:
      name: session.stream_ready
      title: Synthetic live-tail readiness signal
      contentType: application/json
      payload:
        $ref: "#/components/schemas/SessionStreamReadyEvent"
    SessionStreamTimeout:
      name: session.stream_timeout
      title: Synthetic quiet-window timeout
      contentType: application/json
      payload:
        $ref: "#/components/schemas/SessionStreamTimeoutEvent"
  schemas:
    RunPeekReady:
      type: object
      additionalProperties: false
      required:
        - type
        - anchorRunId
        - selectedRunId
        - selectionState
      properties:
        type:
          const: peek.ready
        anchorRunId:
          type: string
        selectedRunId:
          type:
            - string
            - "null"
        selectionState:
          enum:
            - none
            - ready
            - unavailable
    RunPeekChanged:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          const: peek.changed
    RunPeekRunChanged:
      type: object
      additionalProperties: false
      required:
        - type
        - runId
        - kind
      properties:
        type:
          const: run.changed
        runId:
          type: string
        kind:
          enum:
            - execution
            - summary
            - transcript
    RunPeekResync:
      type: object
      additionalProperties: false
      required:
        - type
        - reason
      properties:
        type:
          const: peek.resync
        reason:
          enum:
            - listener_reconnected
            - visibility
            - manual
            - transport
    RunPeekSelectionUnavailable:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          const: peek.selection_unavailable
    BrowserCanonicalRunEvent:
      type: object
      additionalProperties: false
      required:
        - type
        - eventId
        - runSequence
        - occurredAt
        - hostSessionId
      properties:
        type:
          type: string
          minLength: 1
          maxLength: 128
        eventId:
          type: string
          format: uuid
        runSequence:
          type: string
          pattern: "^(0|[1-9][0-9]{0,18})$"
        occurredAt:
          type: string
          format: date-time
        hostSessionId:
          type: string
          nullable: true
      example:
        type: session.command
        eventId: 59d83570-19f7-4b80-9ab8-d65a22e4f244
        runSequence: "42"
        occurredAt: 2026-09-04T12:00:00.000Z
        hostSessionId: session-opaque-17
    SessionStreamReadyEvent:
      type: object
      additionalProperties: false
      required: [type, replay]
      properties:
        type:
          type: string
          const: session.stream_ready
        replay:
          type: boolean
          const: false
      example:
        type: session.stream_ready
        replay: false
    SessionStreamTimeoutEvent:
      type: object
      additionalProperties: false
      required: [type, reason]
      properties:
        type:
          type: string
          const: session.stream_timeout
        reason:
          type: string
          minLength: 1
      example:
        type: session.stream_timeout
        reason: no canonical events within keepalive window
    RuntimeOutputReferenceV2:
      x-implementation-status: Designed
      type: object
      additionalProperties: false
      required: [objectId, sizeBytes, contentAvailable]
      properties:
        objectId: { type: string, format: uuid }
        sizeBytes: { type: integer, minimum: 0, maximum: 9007199254740991 }
        contentAvailable: { type: boolean }
      description: |
        User-safe projection of host output references. No command/assignment,
        ACP/host-session identity, local path or raw object bytes reach browser
        events. Raw content requires the same project readRepoFiles authorization
        as the content route; denial preserves a contentAvailable=false projection.
        Existing escaped text consumers fetch authorized bounded ranges, never
        execute supplied MIME or treat an absent reference body as successful output.

# Implemented — ADR-200: task.launch_changed is a content-free transactional
# invalidation fact for intent state before a run exists. Existing attention.tick
# regions/counters and visibility filtering remain the browser wire contract;
# refetch the scoped intent receipt on invalidation/reconnect. Existing run launch
# success frames remain run-bound; compatibility launch_pending errors identify
# durable acceptance by intentId and accepted:true, never by an invented runId.
