asyncapi: 2.6.0
info:
  title: Operational agent lifecycle facts
  version: 1.0.0
  description: >-
    Implemented — transactional domain-outbox facts for operational attention and
    cleanup. No new transport, scheduler or run status. Existing terminal events
    remain authoritative for business completion. Payloads are content-free pointers.
channels:
  domain_events/operational:
    subscribe:
      operationId: observeOperationalLifecycle
      message:
        oneOf:
          - $ref: "#/components/messages/AgentActivityChanged"
          - $ref: "#/components/messages/AgentIncidentChanged"
          - $ref: "#/components/messages/TaskQualificationChanged"
          - $ref: "#/components/messages/AttentionAcknowledged"
          - $ref: "#/components/messages/CleanupChanged"
components:
  messages:
    AgentActivityChanged:
      name: agent.activity_changed
      summary: Scoped durable activity invalidation
      payload:
        type: object
        additionalProperties: false
        required:
          - projectId
          - agentId
        properties:
          projectId: &a1
            type: string
            format: uuid
          agentId:
            type: string
            minLength: 1
            maxLength: 256
            nullable: true
          runId:
            type: string
            format: uuid
          status:
            type: string
            enum:
              [
                Pending,
                Running,
                NeedsInput,
                NeedsInputIdle,
                HumanWorking,
                WaitingOnChildren,
                Review,
                Done,
                Failed,
                Crashed,
                Abandoned,
              ]
          revision: &a3
            type: integer
            minimum: 1
        oneOf:
          - required: [runId, status]
          - required: [revision]
    AgentIncidentChanged:
      name: agent.incident_changed
      summary: Implemented — episode content or actionable revision changed
      payload:
        type: object
        additionalProperties: false
        required:
          - projectId
          - agentId
          - episodeId
          - revision
        properties:
          projectId: *a1
          agentId:
            type: string
            minLength: 1
            maxLength: 256
          episodeId: *a1
          revision: *a3
    TaskQualificationChanged:
      name: task.qualification_changed
      summary: Designed — input/publication changed; not selectable as an agent trigger
      payload:
        type: object
        additionalProperties: false
        required:
          - projectId
          - taskId
          - inputRevision
          - qualificationRevision
        properties:
          projectId: *a1
          taskId: *a1
          inputRevision: *a3
          qualificationRevision:
            type: integer
            minimum: 1
            nullable: true
    AttentionAcknowledged:
      name: run.operational_attention_acknowledged
      summary: One reader acknowledged an exact failure reason revision
      payload:
        type: object
        additionalProperties: false
        required: [runId, ownerUserId, reason, revision]
        properties:
          runId: { type: string, minLength: 1 }
          ownerUserId: { type: string, minLength: 1 }
          reason: { type: string, enum: [operation_failure, cleanup_failure] }
          revision: { type: integer, minimum: 1 }
    CleanupChanged:
      name: run.operational_cleanup_changed
      summary: Cleanup reason/state changed independently of terminal business outcome
      payload:
        type: object
        additionalProperties: false
        required: [runId, revision, state]
        properties:
          runId: { type: string, minLength: 1 }
          revision: { type: integer, minimum: 1 }
          state:
            type: string
            enum:
              [retained, armed, preserving, removed, released, retry, exhausted]
