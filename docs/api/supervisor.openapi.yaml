        importId/itemId/chunkIndex and these header-derived metadata values must
        match the locally enabled frozen manifest. Request body is exact bytes;
        Content-Length and Content-Digest must agree. Supervisor-derived host and
        manifest bindings replace an active assignment, never a forged fence.
        Matching chunk/seal retries replay; changed bytes or generation is 409.
        Local OS authority, explicit enablement and revocation govern access.

x-ab-stabilization:
  status: Designed
  activation: Paired host/manager capabilities after existing commands are drained or explicitly held for repair; no indefinite legacy execution path.
  commandIdentity: ImmutablePromptRequestV2 and CommandReceiptV2 bind the URL-selected target as well as the envelope and exact result/error identity.
  readPolicy:
    contentType: application/octet-stream
    contentDisposition: attachment
    xContentTypeOptions: nosniff
    contentSecurityPolicy: "sandbox; default-src 'none'"
    cacheControl: private, no-store
    contentDigest: SHA-256 of actual 200/206 message bytes
    reprDigest: SHA-256 of the full verified representation
    etag: Strong generation and full-representation hash identity
    verification: No-follow descriptor, full streaming hash and bounded private response spool verified before success headers; manager verifies actual response bytes.
  identifiers: ../system-analytics/execution-hosts.md#identifier-classification-and-refusal-contract-designed
  refusalReasons: ../error-taxonomy.md#ab-stabilization-reasons-designed
  maintenanceImport: ../system-analytics/execution-data-cutover.md#historical-import-and-guarded-upgrade-protocol-designed
