openapi: 3.0.3
info:
  title: MAIster Supervisor HTTP API
  version: "0.8.0"
  description: |
    HTTP + SSE surface exposed by `supervisor/` (the Node daemon that owns ACP
    sessions and spawns adapter binaries. Implemented adapters are
    `claude-agent-acp` and `codex-acp`; ADR-084/ADR-085 add `gemini --acp`,
    `opencode acp`, and `mimo acp` as readiness-gated code-owned adapter
    families.
    Consumed by the Next.js web tier through `web/lib/supervisor-client.ts`.

    **Implemented contract.** The lifecycle
    (`POST` / `DELETE` `/sessions`, `GET /sessions`,
    `GET /sessions/:id/stream`), ACP prompt boundary
    (`POST /sessions/:id/prompt`), permission-only HITL input
    (`POST /sessions/:id/input`), and checkpoint endpoint
    (`POST /sessions/:id/checkpoint`) are implemented end-to-end.

    The SSE stream emitted by `GET /sessions/:id/stream` is described separately
    in `api/async/supervisor-sse.asyncapi.yaml`; as of M7 the stream
    carries `session.update`, `session.permission_request`, `session.line`,
    `session.exited`, and `session.crashed` events.

    **Execution-host contract (Implemented — ADR-166, 0.8.0).** The supervisor is
    an *execution host* with a durable identity (`GET /health` → `host`).
    Every host-bound mutating route (`POST /sessions`, every
    `/sessions/{id}/*` mutation, `DELETE /sessions/{id}`,
    `POST /workspaces/adopt`, `DELETE /workspaces/{id}`) takes a
    `CommandEnvelope` — a unique `command.id`, a `fence`
    (`hostKey`, `assignmentId`, `assignmentEpoch`, `runId`), and the
    kind-specific `payload`. The host persists a per-run epoch high-water and
    rejects stale epochs with `409 FENCED`; receipts (`GET /commands/{id}`)
    make duplicate delivery safe; `POST /workspaces/adopt` is the ONLY
    path-bearing route — session routes address the workspace through the
    opaque `executionWorkspaceId` it returns. The contract is strict: a bare
    body without an envelope is `409 PRECONDITION {reason: missing_envelope}`
    on every command route, and a `session.create` payload carrying a
    pre-ADR-166 path field (`runId`, `projectSlug`, `worktreePath`,
    `repoPath`, `confineRoot`, `contextMounts`) is
    `409 PRECONDITION {reason: legacy_field, field}`.
    Stage A is single-host, loopback, shared-filesystem, and unauthenticated —
    see [`../system-analytics/execution-hosts.md`](../system-analytics/execution-hosts.md).

    See [`../architecture.md`](../architecture.md), [`../supervisor.md`](../supervisor.md),
    and [`../decisions.md#adr-002-supervisor-runs-as-a-separate-node-daemon`](../decisions.md).
  contact:
    name: MAIster maintainers
    url: https://github.com/your-org/mAIster
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:{port}
    description: |
      Local supervisor on the operator's workstation. POC ships single-host
      docker compose; production deployments substitute their own host.
    variables:
      port:
        default: "7777"
security: []
tags:
  - name: health
    description: Supervisor readiness.
  - name: sessions
    description: ACP session lifecycle.
  - name: prompt
    description: ACP prompt boundary for Flow and scratch agent turns.
  - name: stream
    description: Per-session event stream (SSE).
  - name: hitl
    description: Permission-only human-in-the-loop input delivery.
  - name: model-catalog
    description: Model discovery resolver for a runner draft (ADR-076).
  - name: mcp-probe
    description: MCP server health probe — real `initialize` handshake (ADR-129).
  - name: execution-host
    description: |
      (Implemented — ADR-166) Execution-host contract: opaque workspace adoption
      and command receipts.
paths:
  /health:
    get:
      tags: [health]
      summary: Report supervisor readiness
      description: |
        Lightweight readiness probe for the supervisor daemon itself.
        A `200` response means the daemon is reachable and can accept
        session work. The body intentionally excludes project ids, run ids,
        executor secrets, env vars, and filesystem paths.

        (Implemented — ADR-166) The `host` object carries the durable execution-host
        identity: `hostKey` (minted into the supervisor's private state store on
        first boot, or the `MAISTER_EXECUTION_HOST_KEY` pin), the per-process
        `bootId` (changes on every restart), and `protocolVersion`. The web
        registrar upserts `execution_hosts` from it. Never a path.
      operationId: getSupervisorHealth
      responses:
        "200":
          description: Supervisor is ready to accept session work.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupervisorHealthResponse" }
  /diagnostics:
    get:
      tags: [health]
      summary: Inspect runtime launch diagnostics
      description: |
        Read-only diagnostics for remote supervisor runtime configuration:
        adapter binary availability, binary source/path/version/error,
        adapter smoke evidence, env-ref presence, and launcher version
        metadata. Does not return raw secret values. A binary that exists but
        cannot initialize its first-run writable state is reported as
        `available: false` with an adapter-specific `error`, not as a raw 500.
      operationId: getSupervisorDiagnostics
      responses:
        "200":
          description: Runtime diagnostics snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupervisorDiagnosticsResponse"
  /workspaces/adopt:
    post:
      tags: [execution-host]
      summary: Adopt a host-local path as an opaque execution workspace (Implemented — ADR-166)
      description: |
        The ONLY path-bearing route. Registers `payload.path` for
        `payload.runId` and returns a host-scoped opaque handle
        `executionWorkspaceId` (`ws_<uuid>`) that every session route then
        uses instead of raw paths. Idempotent on `(runId, realpath)`: a
        re-adoption returns the same id with `replayed: true`.

        Validation per `payload.kind` (rule token in `details.rule` on
        refusal): every kind requires an absolute path with no `..` segment
        whose realpath exists, does not escape through a symlink, and is not
        inside the host state dir; `git_worktree` additionally requires the
        realpath under `MAISTER_WORKSPACE_ROOTS`, a `.git` FILE whose
        `gitdir:` resolves under `<repoPath>/.git/worktrees/`, and `repoPath`
        to be a git repo root; `repo_checkout` requires the path to be a git
        repo root equal to `repoPath` (arbitrary location — ADR-023);
        `directory` requires the realpath under `MAISTER_WORKSPACE_ROOTS` and
        no `repoPath`. The host derives and stores `run_dir` from its runtime
        root + `projectSlug` + `runId` at adoption; later routes derive every
        path from the handle. Filesystem errors map to 409, never 500.
      operationId: adoptWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdoptWorkspaceRequest" }
            examples:
              gitWorktree:
                summary: Adopt a flow run's worktree
                value:
                  command:
                    id: "8d1a4f2e-3b6c-4e7f-9a1b-2c3d4e5f6a7b"
                    kind: "workspace.adopt"
                    issuedAt: "2026-09-02T10:00:00.000Z"
                  fence:
                    hostKey: "eh_0f1e2d3c4b5a69788796a5b4c3d2e1f0"
                    assignmentId: "6a7b8c9d-0e1f-4a2b-8c3d-4e5f6a7b8c9d"
                    assignmentEpoch: 1
                    runId: "run-abc"
                  payload:
                    runId: "run-abc"
                    projectSlug: "myapp"
                    kind: "git_worktree"
                    path: "/home/maister/.maister/worktrees/myapp/run-abc"
                    repoPath: "/repos/myapp"
      responses:
        "200":
          description: Handle minted (or replayed for the same `(runId, realpath)`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdoptWorkspaceResponse" }
              examples:
                minted:
                  value:
                    executionWorkspaceId: "ws_5f3a8a2b7e344f6d9d2c1d4e5f6a7b8c"
                    kind: "git_worktree"
                    replayed: false
        "409":
          description: |
            Fence refusal (`host_mismatch`, `assignment_mismatch`) or path
            rejection (`workspace_rejected` + `rule`); stale epoch → `FENCED`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupervisorErrorBody" }
              examples:
                outsideRoots:
                  value:
                    code: "PRECONDITION"
                    message: "workspace path rejected: outside_roots"
                    details:
                      { reason: "workspace_rejected", rule: "outside_roots" }
                fenced:
                  value:
                    code: "FENCED"
                    message: "command epoch 1 is below the host high-water 2 for run run-abc"
                    details:
                      reason: "assignment_fenced"
                      runId: "run-abc"
                      commandEpoch: 1
                      hostEpoch: 2
  /workspaces/{id}:
    get:
      tags: [execution-host]
      summary: Read an adopted workspace handle (Implemented — ADR-166)
      description: |
        Path-free projection of a handle. Used by the web reconciler to verify
        that an `active` assignment's handle still exists (a 404 logs
        `workspace-handle-lost`; the next `session.create` re-adopts).
      operationId: getWorkspace
      parameters:
        - $ref: "#/components/parameters/ExecutionWorkspaceId"
      responses:
        "200":
          description: Handle projection. Never contains a filesystem path.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceRecord" }
              examples:
                active:
                  value:
                    executionWorkspaceId: "ws_5f3a8a2b7e344f6d9d2c1d4e5f6a7b8c"
                    runId: "run-abc"
                    projectSlug: "myapp"
                    kind: "git_worktree"
                    adoptedAt: "2026-09-02T10:00:00.100Z"
                    releasedAt: null
        "404":
          description: Unknown handle.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupervisorErrorBody" }
    delete:
      tags: [execution-host]
      summary: Release an adopted workspace handle (Implemented — ADR-166)
      description: |
        Marks the handle released (a later `session.create` against it is
        refused with `workspace_released`). Issued as a `driverless`
        `workspace.release` command by the GC workspace reconciler after
        worktree removal and by run-terminal drop paths. The fence is checked
        against the handle's stored `run_id` (server state) → `run_mismatch`.
      operationId: releaseWorkspace
      parameters:
        - $ref: "#/components/parameters/ExecutionWorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReleaseWorkspaceCommand" }
            examples:
              release:
                value:
                  command:
                    id: "1b2c3d4e-5f6a-4b7c-8d9e-0f1a2b3c4d5e"
                    kind: "workspace.release"
                    issuedAt: "2026-09-09T10:00:00.000Z"
                  fence:
                    hostKey: "eh_0f1e2d3c4b5a69788796a5b4c3d2e1f0"
                    assignmentId: "6a7b8c9d-0e1f-4a2b-8c3d-4e5f6a7b8c9d"
                    assignmentEpoch: 1
                    runId: "run-abc"
                  payload: {}
      responses:
        "200":
          description: "Released (`released: false` when it already was)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseWorkspaceResponse" }
              examples:
                released:
                  value: { released: true }
        "404":
          description: Unknown handle (treated as "gone" by the web tier).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupervisorErrorBody" }
        "409":
          description: Fence refusal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupervisorErrorBody" }
  /commands/{commandId}:
    get:
      tags: [execution-host]
      summary: Read a command receipt (Implemented — ADR-166)
      description: |
        Returns the host's durable receipt for a command id: the phase
        (`accepted` for a prompt whose turn is in flight, `completed` with the
        stored response body, `rejected` with the stored error body) and the
        HTTP status that was — or will be — returned. The web tier reads it
        exactly once after an unknown-outcome transport failure on an accepted
        prompt, and during startup recovery of `delivering` / `accepted`
        ledger rows. Receipts are pruned on a 7-day TTL at boot and hourly.
      operationId: getCommandReceipt
      parameters:
        - name: commandId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The receipt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandReceipt" }
              examples:
                completedPrompt:
                  value:
                    commandId: "3d4e5f6a-7b8c-4d9e-8f0a-1b2c3d4e5f6a"
                    runId: "run-abc"
                    kind: "session.prompt"
                    assignmentEpoch: 1
                    phase: "completed"
                    httpStatus: 200
                    body: { stopReason: "end_turn", meta: null }
                    receivedAt: "2026-09-02T10:00:02.050Z"
                    completedAt: "2026-09-02T10:04:41.900Z"
        "404":
          description: No receipt for that id (never received, or pruned).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupervisorErrorBody" }
  /sessions:
    post:
      tags: [sessions]
      summary: Start a new agent session
      description: |
        Spawns the adapter binary determined by the versioned `runner.adapter`
        when present, otherwise by legacy `executor.agent` (`claude-agent-acp`
        for `claude`, `codex-acp` for `codex`), with `cwd = worktreePath`.
        ADR-084 adapters use the same registry: `gemini` launches
        `gemini --acp`; `opencode` launches `opencode acp`. Unsupported
        adapter/provider/policy combinations, missing required env refs, and
        unsupported checkpoint strategies are rejected before spawn.
        Returns after the adapter process starts and the ACP handshake returns
        an `acpSessionId`; everything after that is observable via the SSE
        stream.

        Capability launch fields are server-derived by the web tier:
        `capabilityProfilePath` points at the run-scoped profile snapshot
        materialized in the worktree/runtime area, and `adapterLaunch` carries
        only validated env/arg additions for the selected adapter. The
        supervisor does not resolve project policy or trust; it validates and
        passes these fields to the spawned child.

        ADR-085 adds `nodeAttemptId` attribution metadata for graph-runner
        sessions. The supervisor validates it as a safe id and stamps it on
        cost records; it never grants filesystem, project, or session authority.

        (Implemented — ADR-166) The body is a `CreateSessionCommand` envelope
        (`command.kind = session.create`) whose `payload` is the
        `StartSessionRequest`. The handle form (`payload.executionWorkspaceId`)
        derives `cwd`, the content-block confinement roots, the run dir, and
        the context mounts from the adopted handle (server state); the fence
        must satisfy `fence.runId === handle.runId` (`run_mismatch`). An
        unknown handle → `unknown_workspace` (the client re-adopts once and
        issues a NEW command); a released one → `workspace_released`. Handler
        order: parse envelope → fence check → receipt lookup (duplicate id →
        verbatim replay with `X-Maister-Command-Replayed: true`, in-flight →
        join) → execute → write receipt → respond. A bare body without an
        envelope is `409 PRECONDITION missing_envelope`; a payload carrying a
        pre-ADR-166 path field is `409 PRECONDITION legacy_field` naming the
        field (`details.field`).
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSessionCommand" }
            examples:
              enveloped:
                summary: Enveloped create against an adopted handle
                value:
                  command:
                    id: "2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f"
                    kind: "session.create"
                    issuedAt: "2026-09-02T10:00:01.000Z"
                  fence:
                    hostKey: "eh_0f1e2d3c4b5a69788796a5b4c3d2e1f0"
                    assignmentId: "6a7b8c9d-0e1f-4a2b-8c3d-4e5f6a7b8c9d"
                    assignmentEpoch: 1
                    runId: "run-abc"
                  payload:
                    executionWorkspaceId: "ws_5f3a8a2b7e344f6d9d2c1d4e5f6a7b8c"
                    stepId: "plan"
                    sessionName: "default"
                    executor: { agent: "claude", model: "claude-sonnet-4-6" }
      responses:
        "201":
          description: Spawn succeeded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StartSessionResponse" }
        "409":
          description: |
            Zod validation rejected the request body; or (Implemented — ADR-166)
            a fence refusal (`host_mismatch`, `assignment_mismatch`,
            `run_mismatch`), an unknown/released handle
            (`unknown_workspace` / `workspace_released`), a stale epoch
            (`FENCED`), a residual `capabilityProfilePath` outside the handle
            (`workspace_rejected` + `outside_workspace`), a missing envelope
            (`missing_envelope`), or a legacy path field (`legacy_field` +
            `details.field`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupervisorErrorBody" }
              examples:
                missingField:
                  value: { code: "PRECONDITION", message: "executor: Required" }
                unknownWorkspace:
                  value:
                    code: "PRECONDITION"
                    message: "unknown execution workspace"
                    details: { reason: "unknown_workspace" }
                fenced:
                  value:
                    code: "FENCED"
                    message: "command epoch 1 is below the host high-water 2 for run run-abc"
                    details:
                      reason: "assignment_fenced"
                      runId: "run-abc"
                      commandEpoch: 1
                      hostEpoch: 2
        "500":
          description: Spawn failed (binary missing, EACCES, first-run state failure, OOM at fork).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupervisorErrorBody" }
              examples:
                enoent:
                  value:
                    {
                      code: "SPAWN",
                      message: "spawn claude-agent-acp failed: ENOENT",
                    }
        "503":
          description: Executor unavailable (missing env ref, unsupported adapter readiness, or reserved pool exhaustion).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupervisorErrorBody" }
    get:
      tags: [sessions]
      summary: List all currently registered sessions
      description: |
        Returns the `SessionRecord[]` projection for every session the
        supervisor knows about (live, exited, crashed — kept for the
        post-terminal grace window before GC).

        (Implemented — ADR-166) The projection carries `executionWorkspaceId`,
        `assignmentId`, `assignmentEpoch`, and `createdByCommandId`. Host-private
        paths (`logPath`, `worktreePath`, `repoPath`, `confineRoot`,
        `contextMounts`) never leave the host — no web reader consumes them.
      operationId: listSessions
      responses:
        "200":
          description: Current registry contents.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SessionRecord" }
        default:
          description: Unhandled supervisor error.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupervisorErrorBody" }
  /sessions/{id}/prompt:
    post:
      tags: [prompt]
      summary: Send an ACP prompt to a live session
      description: |
        Drives the M5 Flow DSL `agent` step. The supervisor forwards the
        prompt onto the per-session `ClientSideConnection` (built on
        `@agentclientprotocol/sdk@0.22.1`) and blocks until the adapter
        returns a `stopReason`. Concurrent `agent` steps in
        `slash-in-existing` mode reuse one session across multiple prompt
        calls; `new-session` steps create a fresh session per prompt.

        Permission requests raised by the adapter mid-turn surface as
        `session.permission_request` SSE events (M7+). The supervisor
        parks the ACP deferred until the web tier resolves it via
        `POST /sessions/{id}/input`; the prompt promise stays in flight
        for the duration of the HITL turn.

        ADR-085 requires `nodeAttemptId` on graph-runner prompt sends,
        including `slash-in-existing` reused sessions, so active cost
        attribution changes at prompt time instead of relying on timestamp
        inference. Concurrent prompts in one reused session are refused by the
        web tier before they become ambiguous.

        (Implemented — ADR-166) Enveloped as a `PromptCommand`
        (`command.kind = session.prompt`). Completion rides THREE durable
        signals: the SSE `session.command {phase: accepted}` when the turn
        starts, the SSE `session.command {phase: completed, status, result}`
        plus the receipt (`GET /commands/{id}`) when it ends, and this HTTP
        response. A duplicate id while the turn is in flight JOINS the
        running turn; a duplicate after the host restarted mid-turn (receipt
        `accepted`, no in-flight promise) → `409 PRECONDITION turn_lost`. A
        session evicted by a higher epoch answers its pending prompt with
        `409 FENCED`.
      operationId: sendSessionPrompt
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromptCommand" }
            examples:
              enveloped:
                value:
                  command:
                    id: "3d4e5f6a-7b8c-4d9e-8f0a-1b2c3d4e5f6a"
                    kind: "session.prompt"
                    issuedAt: "2026-09-02T10:00:02.000Z"
                  fence:
                    hostKey: "eh_0f1e2d3c4b5a69788796a5b4c3d2e1f0"
                    assignmentId: "6a7b8c9d-0e1f-4a2b-8c3d-4e5f6a7b8c9d"
                    assignmentEpoch: 1
                    runId: "run-abc"
                  payload:
                    stepId: "plan"
                    nodeAttemptId: "na-1"
                    prompt: "/aif-plan Add a healthz route"
      responses:
        "200":
          description: |
            Prompt completed. The adapter's `stopReason` indicates whether
            the turn ended cleanly, hit a token cap, exceeded max turn
            requests, or was refused.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendPromptResponse" }
        "404":
          description: No session with that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupervisorErrorBody" }
              examples:
                unknown:
                  value: { code: "PRECONDITION", message: "unknown session" }
        "409":
          description: |
            Session exists but cannot accept the prompt — either it is no
            longer `live` (already `exited`/`crashed`), no ACP connection
            has been attached (initialization race), or a `contentBlocks`
            resource URI failed the session-bound confinement check (a remote
            scheme, or a `file:` path outside repo ∪ worktree ∪ run dir). The
            content blocks are NOT forwarded on a confinement violation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupervisorErrorBody" }
              examples:
                notLive:
                  value: { code: "PRECONDITION", message: "session not live" }
                noConnection:
                  value:
                    code: "PRECONDITION"
                    message: "session has no ACP connection"
                uriEscape:
                  value:
                    code: "PRECONDITION"
                    message: "resource URI escapes the run sandbox: file:///etc/passwd"
                zodReject:
                  value:
                    code: "PRECONDITION"
                    message: "stepId: Required"
                turnLost:
                  value:
                    code: "PRECONDITION"
                    message: "the turn for this command id was lost in a host restart"
                    details: { reason: "turn_lost" }
                fenced:
                  value:
                    code: "FENCED"
                    message: "session evicted by assignment epoch 2"
                    details:
                      reason: "assignment_fenced"
                      runId: "run-abc"
                      commandEpoch: 1
                      hostEpoch: 2
        "500":
          description: |
            Adapter returned a malformed or non-conforming ACP frame, or
            the ACP transport itself faulted mid-turn.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupervisorErrorBody" }
              examples:
                acpProtocol:
                  value: { code: "ACP_PROTOCOL", message: "prompt failed: ..." }
  /sessions/{id}:
    delete:
      tags: [sessions]
      summary: Stop a running session
      description: |
        Marks the session as an intentional shutdown then sends `SIGTERM`.
        After `MAISTER_KILL_GRACE_MS` (default 5000 ms) without exit, escalates
        to `SIGKILL`. The terminal event arrives on the SSE stream as
        `session.exited` (because the shutdown was intentional), not
        `session.crashed`, even on non-zero exit code.
      operationId: deleteSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        description: |
          (Implemented — ADR-166) `DeleteSessionCommand` envelope
          (`command.kind = session.delete`, `payload: {}`). Issued as a
          `driverless` command so startup recovery may re-deliver it.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteSessionCommand" }
            examples:
              enveloped:
                value:
                  command:
                    id: "4e5f6a7b-8c9d-4e0f-9a1b-2c3d4e5f6a7b"
                    kind: "session.delete"
                    issuedAt: "2026-09-02T10:30:00.000Z"
                  fence:
                    hostKey: "eh_0f1e2d3c4b5a69788796a5b4c3d2e1f0"
                    assignmentId: "6a7b8c9d-0e1f-4a2b-8c3d-4e5f6a7b8c9d"
                    assignmentEpoch: 1
                    runId: "run-abc"
                  payload: {}
      responses:
        "204":
          description: Termination initiated. SSE will deliver the terminal event.
        "404":
          description: No session with that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupervisorErrorBody" }
              examples:
                unknown:
                  value: { code: "PRECONDITION", message: "unknown session" }
  /sessions/{id}/stream:
    get:
      tags: [stream]
      summary: SSE event stream for a session
      description: |
        Server-Sent Events. Each child stdout line yields one `session.line`
        event; the lifecycle terminates with either `session.exited` or
        `session.crashed`. The stream closes automatically after the
        terminal event.

        Supports `Last-Event-ID` for reconnect replay from a per-session
        in-memory ring buffer (1000 entries). Older events that have
        already been GC'd are not replayable from this endpoint — the
        web tier's eventual log-file tail bridge (M7+M9) fills that gap.

        Full event schemas live in `api/async/supervisor-sse.asyncapi.yaml`.
      operationId: streamSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: Last-Event-ID
          in: header
          required: false
          description: Highest `monotonicId` already received by the client.
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: |
            text/event-stream. Each event has `id`, `event`, and `data` fields.
            See AsyncAPI for the payload union.
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  id: 1
                  event: session.line
                  data: {"type":"session.line","sessionId":"<uuid>","monotonicId":1,"line":"<JSONL>"}

                  id: 2
                  event: session.exited
                  data: {"type":"session.exited","sessionId":"<uuid>","monotonicId":2,"exitCode":0}
        "404":
          description: No session with that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupervisorErrorBody" }
  /sessions/{id}/checkpoint:
    post:
      tags: [sessions]
      summary: (M8) Graceful checkpoint of the session
      description: |
        Cancels every open `pendingPermissions` deferred for the session
        with reason `"checkpoint"`, SIGTERMs the child within
        `MAISTER_KILL_GRACE_MS`, and on graceful exit emits
        `session.exited { reason: "checkpoint" }` on the SSE stream.
        Idempotent: an already-exited session returns 200 with
        `alreadyCheckpointed: true` and the most recent `monotonicId`.
        On SIGKILL escalation returns 500 `EXECUTOR_UNAVAILABLE` — the
        web sweeper treats this as retryable.
      operationId: checkpointSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckpointCommand" }
            examples:
              enveloped:
                value:
                  command:
                    id: "5f6a7b8c-9d0e-4f1a-8b2c-3d4e5f6a7b8c"
                    kind: "session.checkpoint"
                    issuedAt: "2026-09-02T10:31:00.000Z"
                  fence:
                    hostKey: "eh_0f1e2d3c4b5a69788796a5b4c3d2e1f0"
                    assignmentId: "6a7b8c9d-0e1f-4a2b-8c3d-4e5f6a7b8c9d"
                    assignmentEpoch: 1
                    runId: "run-abc"
                  payload: {}
      responses:
        "200":
          description: Graceful checkpoint completed (or idempotent ack).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckpointResponse" }
        "404":
          description: No session with that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupervisorErrorBody" }
        "409":
          description: |
            Body validation failed (unknown keys); or (Implemented — ADR-166) a
            fence refusal / stale epoch (`FENCED`). A checkpoint arriving under
            a HIGHER epoch than the live session's evicts that session first
            (`session.exited {reason: fenced}`), then executes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupervisorErrorBody" }
        "500":
          description: SIGTERM grace expired; SIGKILL was issued. Sweeper retries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupervisorErrorBody" }
  /sessions/{id}/cancel:
    post:
      tags: [sessions]
      summary: Interrupt the in-flight prompt turn (session/cancel)
      description: |
        Sends a protocol-level ACP `session/cancel` notification to the agent
        without tearing the session down — the adapter-agnostic interrupt used
        by the composer Stop control (claude, codex, gemini, opencode all honor
        it). Sets a per-session `cancelRequested` flag so the blocked
        `POST /sessions/{id}/prompt` resolves with the `cancelled` stop reason
        as a clean turn end (the session stays live) rather than an
        `ACP_PROTOCOL` abort. Also resolves every open `pendingPermissions`
        deferred for the session with `{outcome: "cancelled"}` so a turn blocked
        on a permission HITL unblocks. Idempotent: a non-live or
        connectionless session returns 200 with `cancelled: false`.
      operationId: cancelSessionTurn
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelCommand" }
            examples:
              enveloped:
                value:
                  command:
                    id: "6a7b8c9d-0e1f-4a2b-9c3d-4e5f6a7b8c9d"
                    kind: "session.cancel"
                    issuedAt: "2026-09-02T10:32:00.000Z"
                  fence:
                    hostKey: "eh_0f1e2d3c4b5a69788796a5b4c3d2e1f0"
                    assignmentId: "6a7b8c9d-0e1f-4a2b-8c3d-4e5f6a7b8c9d"
                    assignmentEpoch: 1
                    runId: "run-abc"
                  payload: {}
      responses:
        "200":
          description: Cancel requested (or idempotent ack when no live turn).
          content:
            application/json:
              schema:
                type: object
                required: [cancelled, sessionId]
                properties:
                  cancelled:
                    type: boolean
                    description: True when a live turn was cancelled.
                  sessionId: { type: string }
        "404":
          description: No session with that id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupervisorErrorBody" }
  /sessions/{id}/input:
    post:
      tags: [hitl]
      summary: Deliver an HITL permission decision to a live session (M7)
      description: |
        Permission-only HITL surface. The body is a discriminated union on
        `action`. The supervisor never writes filesystem artifacts on this
        path — durable form/human responses are written directly by the
        web tier; this endpoint only resolves or cancels the live ACP
        `requestPermission` deferred held by the pending-permission
        registry.

        - `action: "select"` resolves the deferred with ACP
          `{outcome: "selected", optionId}`.
        - `action: "cancel"` resolves the deferred with ACP
          `{outcome: "cancelled"}` and records `reason` in supervisor
          logs.
      operationId: deliverInput
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InputCommand" }
            examples:
              envelopedSelect:
                summary: Enveloped approve
                value:
                  command:
                    id: "7b8c9d0e-1f2a-4b3c-8d4e-5f6a7b8c9d0e"
                    kind: "session.input"
                    issuedAt: "2026-09-02T10:05:00.000Z"
                  fence:
                    hostKey: "eh_0f1e2d3c4b5a69788796a5b4c3d2e1f0"
                    assignmentId: "6a7b8c9d-0e1f-4a2b-8c3d-4e5f6a7b8c9d"
                    assignmentEpoch: 1
                    runId: "run-abc"
                  payload:
                    kind: "permission"
                    action: "select"
                    requestId: "8a4a7b9d-0d6b-4b27-a09c-0a3f4f1e1d8e"
                    optionId: "allow"
              select:
                summary: Approve a pending permission
                value:
                  kind: "permission"
                  action: "select"
                  requestId: "8a4a7b9d-0d6b-4b27-a09c-0a3f4f1e1d8e"
                  optionId: "allow"
              cancel:
                summary: Cancel a pending permission
                value:
                  kind: "permission"
                  action: "cancel"
                  requestId: "8a4a7b9d-0d6b-4b27-a09c-0a3f4f1e1d8e"
                  reason: "DB_PERSIST_FAILED"
      responses:
        "200":
          description: Deferred resolved (or cancelled).
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, enum: [true] }
        "404":
          description: |
            No session with that id, OR no pending permission with that
            `requestId` (deferred already evicted or timed out).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupervisorErrorBody" }
              examples:
                missing:
                  value:
                    code: "NEEDS_INPUT"
                    message: "no pending permission with that requestId"
        "409":
          description: Body validation failure (`PRECONDITION`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupervisorErrorBody" }
              examples:
                refine:
                  value:
                    code: "PRECONDITION"
                    message: "optionId: optionId is required when action='select'"
  /model-catalog/resolve:
    post:
      tags: [model-catalog]
      summary: Resolve the model catalog for a runner draft
      description: |
        Discovers valid model ids for a runner **draft** (adapter + provider)
        by fanning out across the registered
        `ModelSource`s — ACP active probe (primary), provider listing API,
        and curated GLM list — then merging and deduping by model `id` and
        caching the result in memory (TTL). A `force` flag bypasses the cache.

        Env-ref fields inside `provider` (`authTokenEnv` / `apiKeyEnv`) carry
        **bare** environment-variable names; the supervisor resolves their
        values from `process.env` and **never** returns or logs a secret. A
        single source's failure is reported in that source's `status`
        (`error` / `skipped`) and does **not** fail the resolve — the route
        still returns `200` with whatever the other sources produced.

        The only request-level rejection is `409 PRECONDITION` on a malformed
        draft (unknown adapter, an `env:`-prefixed or raw-secret value in an
        env-ref field, or a malformed provider union). See [ADR-076](../decisions.md#adr-076-acp-runner-model-discovery-resolver-on-supervisor--configured-model-application) and
        [`../system-analytics/model-catalog.md`](../system-analytics/model-catalog.md).

        **Identifiers.** Every body field is draft config (`body-controlled`),
        not a locator into live server state; env-ref values are resolved
        server-side only.
      operationId: resolveModelCatalog
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelCatalogResolveRequest" }
            examples:
              zaiEnvRouter:
                summary: claude + z.ai env-router draft (force refresh)
                value:
                  adapter: "claude"
                  provider:
                    kind: "anthropic_compatible"
                    baseUrl: "https://api.z.ai/api/anthropic"
                    authTokenEnv: "ZAI_API_KEY"
                  force: true
      responses:
        "200":
          description: |
            Resolved catalog. `models` is merged + deduped across sources;
            `sources` carries a per-source status (one may be `error`/`skipped`
            while others are `ok`).
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/ModelCatalogResolveResponse" }
        "409":
          description: Malformed draft (Zod rejection → `PRECONDITION`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupervisorErrorBody" }
              examples:
                rawSecret:
                  value:
                    code: "PRECONDITION"
                    message: "provider.authTokenEnv: must be an environment variable name"
        default:
          description: Unhandled supervisor error.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupervisorErrorBody" }
  /mcp-probe:
    post:
      tags: [mcp-probe]
      summary: Probe an MCP server with a real `initialize` handshake
      description: |
        (ADR-130 — Implemented.) Opens the MCP server per its transport
        (`stdio` spawns a child; `sse`/`http` connect), performs the MCP
        `initialize` handshake, and returns `{ ok, latencyMs, serverInfo?,
        reason? }`. Bounded by `MAISTER_MCP_PROBE_TIMEOUT_MS` (default 8000);
        the spawned child + timer are released on **every** path (success,
        handshake error, timeout, spawn error) via the MCP SDK transport's
        `close()` (SIGTERM → ~2s grace → SIGKILL) in a `finally`.

        **Identifiers & secrets.** Every body field is probe config
        (`body-controlled`), NAMES only — `envKeys`/`headerKeys` are
        environment-variable NAME references resolved server-side from
        `process.env`. The supervisor NEVER returns or logs a secret value. The
        exec-trust gate is enforced **web-side** before this call (this route
        executes what it is told, inside the trust boundary).
      operationId: probeMcpServer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [transport]
              properties:
                transport: { type: string, enum: [stdio, sse, http] }
                command:
                  type: string
                  description: Required when `transport=stdio`.
                args:
                  type: array
                  items: { type: string }
                envKeys:
                  type: array
                  items: { type: string }
                  description: Env-var NAME references (stdio). Resolved from `process.env`.
                url:
                  type: string
                  description: Required when `transport=sse`/`http`.
                headerKeys:
                  type: array
                  items: { type: string }
                  description: Header NAME references (sse/http). Resolved from `process.env`.
            examples:
              stdio:
                summary: Probe a stdio MCP
                value:
                  transport: stdio
                  command: npx
                  args: ["-y", "@modelcontextprotocol/server-filesystem", "."]
                  envKeys: []
      responses:
        "200":
          description: Probe completed (ok true/false; never a secret).
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  latencyMs: { type: integer }
                  serverInfo:
                    type: object
                    additionalProperties: true
                    nullable: true
                  reason: { type: string, nullable: true }
        "409":
          description: Malformed body (Zod rejection → `PRECONDITION`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupervisorErrorBody" }
        default:
          description: Unhandled supervisor error.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupervisorErrorBody" }
components:
  parameters:
    ExecutionWorkspaceId:
      name: id
      in: path
      required: true
      description: Opaque host-scoped workspace handle (`ws_<uuid>`).
      schema:
        type: string
        pattern: "^ws_[0-9a-f]{32}$"
    SessionId:
      name: id
      in: path
      required: true
      description: |
        Supervisor-assigned session id (UUID v4 generated at spawn time),
        returned as `sessionId` in `StartSessionResponse`. This is the
        path key for every `/sessions/{id}/...` endpoint.

        **Not** the ACP `acpSessionId` — that field is the adapter's
        resume handle (used in `resumeSessionId` on `POST /sessions`
        and in `StartSessionResponse.acpSessionId` /
        `SessionRecord.acpSessionId`). Calling
        `POST /sessions/{acpSessionId}/prompt` with that handle will
        return 404 even when the underlying ACP session is live.
      schema:
        type: string
        format: uuid
        minLength: 1
        maxLength: 128
  schemas:
    SupervisorHealthResponse:
      type: object
      required: [status, version, uptimeMs, sessions, checkedAt, host]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ready]
        host: { $ref: "#/components/schemas/ExecutionHostIdentity" }
        version:
          type: string
          minLength: 1
          description: Supervisor package version.
        uptimeMs:
          type: integer
          minimum: 0
          description: Milliseconds since this supervisor process started.
        sessions:
          $ref: "#/components/schemas/SupervisorSessionCounts"
        checkedAt:
          type: string
          format: date-time
    SupervisorDiagnosticsResponse:
      type: object
      required: [status, version, checkedAt, adapters, envRefs]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ready]
        version:
          type: string
          minLength: 1
        checkedAt:
          type: string
          format: date-time
        adapters:
          type: array
          items:
            type: object
            required:
              [id, binary, source, path, available, version, error, smoke]
            additionalProperties: false
            properties:
              id: { $ref: "#/components/schemas/ExecutorAgent" }
              binary: { type: string, minLength: 1 }
              source:
                type: string
                enum: [path, override]
                description: |
                  `path` = resolved from supervisor PATH; `override` = explicit
                  supervisor-side adapter binary override.
              path:
                type: string
                nullable: true
                description: Resolved executable path when known. Never a secret.
              available: { type: boolean }
              version:
                type: string
                nullable: true
                description: Cheap version probe result when available.
              error:
                type: string
                nullable: true
                description: |
                  Redacted operator-visible diagnostic such as `ENOENT`,
                  `EACCES`, version-probe failure, or adapter first-run
                  writable-state failure. Must not contain env values.
              smoke:
                type: object
                required:
                  [
                    status,
                    reason,
                    checkedAt,
                    protocolVersion,
                    readOnlySession,
                    capabilityEnforcement,
                  ]
                additionalProperties: false
                properties:
                  status:
                    type: string
                    enum: [not_required, pending, ok, skipped, error]
                    description: |
                      Cached generic ACP compatibility smoke state. Pending or
                      skipped generic smoke is advisory for normal readiness;
                      explicit `error` makes the adapter unavailable. Read-only
                      standalone launches use `readOnlySession` below.
                  reason:
                    type: string
                    nullable: true
                  checkedAt:
                    type: string
                    format: date-time
                    nullable: true
                  protocolVersion:
                    type: integer
                    minimum: 1
                    nullable: true
                  readOnlySession:
                    description: |
                      Cached adapter-specific evidence that `readOnlySession`
                      permission arbitration behaves safely for standalone
                      read-only agent workspaces. `ok` must come from a probe
                      that exercised the adapter prompt/permission wire; generic
                      initialize/newSession smoke is not enough and remains
                      `skipped` for this dimension. `ok` is required for
                      adapters whose descriptor marks read-only-session smoke as
                      required; descriptors marked `not_required` skip this
                      evidence gate.
                    oneOf:
                      - type: object
                        required:
                          [
                            status,
                            reason,
                            checkedAt,
                            protocolVersion,
                            probeVersion,
                            staleReason,
                          ]
                        additionalProperties: false
                        properties:
                          status:
                            type: string
                            enum: [stale]
                          reason:
                            type: string
                            nullable: true
                          checkedAt:
                            type: string
                            format: date-time
                            nullable: true
                          protocolVersion:
                            type: integer
                            minimum: 1
                            nullable: true
                          probeVersion:
                            type: integer
                            minimum: 1
                            nullable: true
                            description: |
                              Read-only probe contract version. Null for cache-v1,
                              not-required, missing, and unprobed evidence. A value
                              different from the current supervisor probe version
                              yields diagnostic status `stale`.
                          staleReason:
                            type: string
                            enum: [probe_contract, freshness]
                            description: |
                              Required machine-readable stale classification for
                              diagnostic status `stale`. The non-stale branch
                              still requires this field and fixes it to `null`;
                              clients localize from it rather than matching prose
                              `reason`.
                      - type: object
                        required:
                          [
                            status,
                            reason,
                            checkedAt,
                            protocolVersion,
                            probeVersion,
                            staleReason,
                          ]
                        additionalProperties: false
                        properties:
                          status:
                            type: string
                            enum: [not_required, pending, ok, skipped, error]
                          reason:
                            type: string
                            nullable: true
                          checkedAt:
                            type: string
                            format: date-time
                            nullable: true
                          protocolVersion:
                            type: integer
                            minimum: 1
                            nullable: true
                          probeVersion:
                            type: integer
                            minimum: 1
                            nullable: true
                          staleReason:
                            type: string
                            nullable: true
                            enum: [null]
                  capabilityEnforcement:
                    type: object
                    required: [status, reason, checkedAt, protocolVersion]
                    additionalProperties: false
                    description: |
                      (Implemented — ADR-130) Cached adapter-specific evidence that
                      `capability_guard` enforcement behaves safely at the ACP
                      seam: the probe proved `requestPermission` fires for every
                      write-class tool call under `permissionPolicy=default` and
                      that `params.toolCall` carries a stable tool name (+ a
                      resolvable MCP server namespace). `ok` must come from that
                      probe; generic initialize/newSession smoke is not enough
                      and remains `skipped`. `ok` is required (the launch
                      evidence gate refuses a strict `tools`/`mcps` enforcement
                      launch otherwise); the demote-to-generic rule mirrors
                      `readOnlySession`.
                    properties:
                      status:
                        type: string
                        enum: [not_required, pending, ok, skipped, error]
                      reason:
                        type: string
                        nullable: true
                      checkedAt:
                        type: string
                        format: date-time
                        nullable: true
                      protocolVersion:
                        type: integer
                        nullable: true
        envRefs:
          type: array
          items:
            type: object
            required: [name, present]
            additionalProperties: false
            properties:
              name:
                type: string
                pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
              present: { type: boolean }
    SupervisorSessionCounts:
      type: object
      required: [live, exited, crashed]
      additionalProperties: false
      properties:
        live:
          type: integer
          minimum: 0
        exited:
          type: integer
          minimum: 0
        crashed:
          type: integer
          minimum: 0
    ExecutorAgent:
      type: string
      enum: [claude, codex, gemini, opencode, mimo]
      description: |
        Identity dispatch — picks the code-owned adapter family. `gemini`,
        `opencode`, and `mimo` are implemented adapter ids, but workflow
        readiness remains launch-gated by diagnostics and adapter-specific
        smoke evidence.
    Executor:
      type: object
      required: [agent, model]
      properties:
        agent: { $ref: "#/components/schemas/ExecutorAgent" }
        model:
          type: string
          minLength: 1
          description: |
            Free-form. The adapter validates against its own provider.
            Examples: `claude-sonnet-4-6`, `gpt-5-codex`, `glm-4.6`.
          example: "claude-sonnet-4-6"
        env:
          type: object
          additionalProperties: { type: string }
          description: |
            Env vars overlaid on the supervisor's process env when spawning
            the child. Per-executor env wins over the supervisor's env. Used
            for env-router routing (e.g. `ANTHROPIC_BASE_URL`,
            `ANTHROPIC_AUTH_TOKEN`).
    RunnerProvider:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: { type: string, enum: [anthropic] }
        - type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: { type: string, enum: [anthropic_compatible] }
            baseUrl: { type: string, format: uri }
            authTokenEnv:
              type: string
              pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
        - type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: { type: string, enum: [openai] }
        - type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: { type: string, enum: [openai_compatible] }
            baseUrl: { type: string, format: uri }
            apiKeyEnv:
              type: string
              pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
            wireApi: { type: string, enum: [responses] }
        - type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: { type: string, enum: [google_gemini] }
            apiKeyEnv:
              type: string
              pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
        - type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: { type: string, enum: [google_vertex] }
            projectId: { type: string, minLength: 1 }
            location: { type: string, minLength: 1 }
            apiKeyEnv:
              type: string
              pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
        - type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: { type: string, enum: [google_gateway] }
            baseUrl: { type: string, format: uri }
            apiKeyEnv:
              type: string
              pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
        - type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: { type: string, enum: [agent_native] }
      description: |
        Versioned runner provider intent. Secret fields are env variable names
        already resolved by the web tier from `env:NAME` references; raw secret
        values are not accepted. `google_gemini`, `google_vertex`,
        `google_gateway`, and `agent_native` are implemented provider intents
        for the Gemini/OpenCode/MiMo adapter families and remain adapter-readiness
        gated until the selected workflow is smoke-proven.
    RunnerLaunch:
      type: object
      additionalProperties: false
      required:
        - version
        - runnerId
        - adapter
        - capabilityAgent
        - model
        - provider
        - permissionPolicy
      properties:
        version: { type: integer, enum: [1] }
        runnerId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._-]+$"
        adapter: { $ref: "#/components/schemas/ExecutorAgent" }
        capabilityAgent: { $ref: "#/components/schemas/ExecutorAgent" }
        model:
          type: string
          minLength: 1
        provider: { $ref: "#/components/schemas/RunnerProvider" }
        permissionPolicy:
          type: string
          enum: [default, dangerously_skip_permissions]
        env:
          type: object
          additionalProperties: { type: string }
          description: |
            Child-process env overrides, keyed by target env var name. Raw
            values are passed as-is; values with `env:NAME` form are resolved
            from `process.env` immediately before spawning the ACP adapter.
      description: |
        Platform ACP runner launch intent. When present, the supervisor maps it
        through allow-listed provisioners and overwrites the legacy `executor`
        shape before spawning. `executor` stays required temporarily for
        backward compatibility.
    StartSessionRequest:
      type: object
      required: [executionWorkspaceId, stepId, executor]
      additionalProperties: false
      description: |
        (Implemented — ADR-166) The `session.create` payload. `executionWorkspaceId`
        names an adopted workspace; the host derives `cwd`, the content-block
        confinement roots, the run dir, `runId`, `projectSlug`, and the context
        mounts from the handle (server state). The pre-ADR-166 path fields
        (`runId`, `projectSlug`, `worktreePath`, `repoPath`, `confineRoot`,
        `contextMounts`) are refused by name: their presence is
        `409 PRECONDITION {reason: legacy_field, field}`. Context mounts travel
        on the `workspace.adopt` payload (`AdoptWorkspacePayload.contextMounts`).
      example:
        executionWorkspaceId: "ws_5f3a8a2b7e344f6d9d2c1d4e5f6a7b8c"
        stepId: "plan"
        sessionName: "default"
        nodeAttemptId: "na-1"
        executor: { agent: "claude", model: "claude-sonnet-4-6" }
        runner:
          version: 1
          runnerId: "claude-code-default"
          adapter: "claude"
          capabilityAgent: "claude"
          model: "claude-sonnet-4-6"
          provider: { kind: "anthropic" }
          permissionPolicy: "default"
      properties:
        executionWorkspaceId:
          type: string
          pattern: "^ws_[0-9a-f]{32}$"
          description: |
            (Implemented — ADR-166) Opaque host-scoped handle returned by
            `POST /workspaces/adopt`. The handle form of this request. Unknown
            → `409 PRECONDITION unknown_workspace`; released →
            `workspace_released`; the fence's `runId` must equal the handle's
            run → `run_mismatch`.
        stepId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._-]+$"
          description: |
            Graph node id carried under the stable `stepId` wire name. The node
            log lands at `<runId>/<stepId>.log`. Constrained to safe filesystem
            characters.
        sessionName:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._-]+$"
          description: |
            (M42 — Implemented, ADR-114) Logical Flow session this ACP process
            serves (`default` | solo node id | named session). Stamped onto
            `cost.jsonl` and `run.events.jsonl` so spend and events are
            attributable per logical session, not only per supervisor
            `sessionId`. Absent → treated as `default` (single-session run).
        nodeAttemptId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._-]+$"
          description: |
            ADR-085 graph-runner attribution id. Required by the web tier for
            graph sessions and stamped on cost records when present. Metadata
            only; it never authorizes access to a run or filesystem path.
        executor: { $ref: "#/components/schemas/Executor" }
        runner: { $ref: "#/components/schemas/RunnerLaunch" }
        capabilityProfilePath:
          type: string
          minLength: 1
          maxLength: 4096
          description: |
            Absolute filesystem path to the web-materialized, run-scoped
            capability profile. Must start with `/` and must not contain `..`
            segments. The supervisor passes it only through validated
            `adapterLaunch` env/args; it does not inspect policy. (Implemented —
            ADR-166) The one residual path in the handle form: it MUST resolve
            inside the handle's path → otherwise `409 PRECONDITION
            {reason: workspace_rejected, rule: outside_workspace}`. It leaves
            with Stage C materialization.
        adapterLaunch:
          $ref: "#/components/schemas/AdapterLaunch"
        resumeSessionId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._-]+$"
          description: |
            Optional checkpoint-resume handle (M8). When set, the supervisor
            restores the prior conversation via the ACP `session/resume`
            protocol call on this id (no history replay). It is NOT passed as a
            CLI flag — the adapters ignore `--resume` on argv.
        readOnlySession:
          type: boolean
          default: false
          description: |
            (M34 — Implemented, ADR-090 L1.) Session-scoped generalization of the
            per-prompt `readOnlyTurn` (ADR-078): for the whole session the ACP
            permission handler auto-DENIES write-class tool permission
            requests and auto-APPROVES an allow-list of read-safe kinds. No
            pending-permission deferreds are created — the session never
            surfaces HITL permission requests. Used for `none`/`repo_read`
            platform-agent runs; incompatible with
            `permission_policy=dangerously_skip_permissions` (the web tier
            refuses that combination before calling this endpoint).
        reapOnEndTurn:
          type: boolean
          default: false
          description: |
            (M34 lifecycle.) One-shot standalone agent session flag. A
            non-persistent standalone agent has no external driver that acts on
            a clean `end_turn` (a flow session is driven by the flow runner; a
            persistent agent parks + re-messages). When set, the supervisor
            reaps the now-idle adapter on `end_turn` so the heartbeat emits a
            bare `session.exited` (exitCode 0, no reason) and the web consumer
            finalizes the run — otherwise it lingers `live`/`Running` and leaks
            a concurrency slot.
        hooksConfig:
          type: object
          additionalProperties: false
          description: |
            (Designed — ADR-108) Resolved, materialized guardrail-rule set for the
            declarative hook engine. Each rule key is optional; an absent key means
            that rule is not armed. Composes with `readOnlySession` (both are
            pre-hoc denies; `readOnlySession` is the stricter superset, left
            intact). The supervisor enforces exactly what it is given. See
            `system-analytics/guardrail-hooks.md`.
          properties:
            repetition:
              type: object
              additionalProperties: false
              required: [max]
              properties:
                max:
                  type: integer
                  minimum: 1
                  description: Consecutive-identical tool-call cap before halt.
            noProgress:
              type: object
              additionalProperties: false
              required: [maxTurns]
              properties:
                maxTurns:
                  type: integer
                  minimum: 1
                  description: |
                    Turns since the last edit/diff-producing tool call before halt.
            pathGuard:
              type: object
              additionalProperties: false
              required: [allowedPaths]
              properties:
                allowedPaths:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    minLength: 1
                  description: |
                    Glob writable set (non-empty; the resolver fills at least
                    `["**"]`); a write-class tool call outside it is denied
                    (deny-and-continue).
        enforcementProfile:
          type: object
          additionalProperties: false
          required: [enforcedClasses, escalationThreshold]
          description: |
            (Implemented — ADR-130) Resolved, derived capability-enforcement set for the
            `capability_guard` seam interceptor. Present iff the resolved node/agent
            declares `enforcement.tools: strict` and/or `enforcement.mcps: strict` on
            an enforceable adapter. Seeded onto the in-memory SessionRecord like
            `hooksConfig`; distinct from `capabilityProfilePath` (child-env only).
            Each class key is present iff that class is strict-enforced; an
            out-of-profile tool call is denied at the seam (deny-and-continue) and the
            Nth consecutive deny halts. See `system-analytics/guardrail-hooks.md`.
          properties:
            tools:
              type: object
              additionalProperties: false
              required: [allow]
              description: |
                Present iff `tools` is strict-enforced. Allow-list of tool NAMES for
                the resolved adapter; a tool call whose extracted identity is not in
                `allow` is denied. Never empty (a strict class with no declared
                allow-set is a launch-time `CONFIG` refusal).
              properties:
                allow:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    minLength: 1
                  description: Allowed tool names (allow-list, never a deny-list).
            mcps:
              type: object
              additionalProperties: false
              required: [allowServers]
              description: |
                Present iff `mcps` is strict-enforced. Allow-list of MCP server
                namespaces; a `mcp__<server>__<tool>` call whose server is not in
                `allowServers` is denied.
              properties:
                allowServers:
                  type: array
                  items:
                    type: string
                    minLength: 1
                  description: Allowed MCP server namespaces.
            enforcedClasses:
              type: array
              minItems: 1
              items:
                type: string
                enum: [tools, mcps]
              description: |
                Audit list of the classes this profile enforces (folded into the
                enforcement snapshot + logs).
            escalationThreshold:
              type: integer
              minimum: 1
              description: |
                N — the number of consecutive out-of-profile denials before the seam
                halts the session and escalates a `hook_trip` HITL. Web-resolved from
                `MAISTER_CAPABILITY_DENY_ESCALATION_THRESHOLD` (default 3) and
                delivered on the profile so the supervisor stays config-free.
    AdapterLaunch:
      type: object
      additionalProperties: false
      description: |
        Constrained launch additions produced by the web capability
        materializer. It cannot override the adapter binary, `cwd`, run id,
        project slug, worktree path, session id, or ACP session id.
      properties:
        env:
          type: object
          maxProperties: 64
          additionalProperties:
            type: string
            maxLength: 4096
          description: |
            Extra environment variables for the spawned adapter. Values are
            never logged. Applied after `executor.env` so run-scoped materialized
            paths can win on collision.
        preArgs:
          type: array
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 1024
          description: Adapter arguments inserted before supervisor-managed args.
        postArgs:
          type: array
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 1024
          description: Adapter arguments appended after supervisor-managed args.
    StartSessionResponse:
      type: object
      required: [sessionId, pid, acpSessionId]
      properties:
        sessionId:
          type: string
          format: uuid
          description: Supervisor-assigned session id (path key for subsequent calls).
        pid:
          type: integer
          minimum: 1
          description: OS pid of the spawned adapter.
        acpSessionId:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            ACP session id surfaced by `session/new` (or the SAME
            `resumeSessionId`, echoed back unchanged, on a `session/resume`).
            It is the M8 checkpoint/resume handle. Cached at
            `run_sessions.acp_session_id` (per logical session) by the web tier.
    SendPromptRequest:
      type: object
      required: [stepId, prompt]
      properties:
        stepId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._-]+$"
          description: |
            Graph node id this prompt belongs to, carried under the stable
            `stepId` wire name. Echoed in supervisor logs and used to attribute
            `session.update` events back to a node in the web tier.
        nodeAttemptId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._-]+$"
          description: |
            ADR-085 active prompt attribution id for graph runs. On
            `slash-in-existing` sessions this updates the cost-record context
            for the duration of the prompt response.
        prompt:
          type: string
          maxLength: 1000000
          description: |
            Rendered Mustache prompt for the step. Sent verbatim as the
            ACP `prompt` parameter; the supervisor does not re-template.
        contentBlocks:
          type: array
          maxItems: 64
          description: |
            (Implemented, T5.4 — capability composer, FR-D5) Optional
            pre-assembled ACP content blocks (a `text` block plus
            `resource_link`/`resource` blocks). When present the supervisor
            forwards them **verbatim** as
            the ACP `prompt` content array — it does NOT re-template or rewrite;
            `prompt` stays the plain-text equivalent/fallback. The web tier has
            already normalized capability tokens to wire form (FR-E) and confined
            resource URIs to the run worktree before this call.
          items:
            type: object
            required: [type]
            additionalProperties: true
            properties:
              type: { type: string, enum: [text, resource_link, resource] }
              text: { type: string }
              uri: { type: string }
              name: { type: string }
              mimeType: { type: string }
    SendPromptStopReason:
      type: string
      enum: [end_turn, max_tokens, max_turn_requests, refusal, cancelled]
      description: |
        ACP `stopReason` from `session/prompt`. `cancelled` is a SUCCESS
        response only after `POST /sessions/{id}/cancel` set the session's
        `cancelRequested` flag (a clean user interrupt — the turn ends, the
        session stays live). An unsolicited `cancelled` from the adapter is
        still mapped to `500 ACP_PROTOCOL`. Graceful stop/checkpoint use the
        DELETE/checkpoint paths.
    SendPromptResponse:
      type: object
      required: [stopReason]
      properties:
        stopReason: { $ref: "#/components/schemas/SendPromptStopReason" }
        meta:
          type: object
          additionalProperties: true
          nullable: true
          description: |
            ACP `_meta` passthrough (opaque object provided by the
            adapter; shape is provider-specific). May be `null` or
            omitted when the adapter sent no `_meta`.
    SessionStatus:
      type: string
      enum: [live, exited, crashed]
    SessionRecord:
      type: object
      required:
        [
          sessionId,
          runId,
          projectSlug,
          stepId,
          status,
          pid,
          startedAt,
          monotonicId,
        ]
      properties:
        sessionId: { type: string, format: uuid }
        runId: { type: string }
        projectSlug: { type: string }
        stepId: { type: string }
        status: { $ref: "#/components/schemas/SessionStatus" }
        pid: { type: integer, minimum: 1 }
        startedAt: { type: string, format: date-time }
        exitedAt: { type: string, format: date-time, nullable: true }
        exitCode: { type: integer, nullable: true }
        signal: { type: string, nullable: true, example: "SIGTERM" }
        monotonicId:
          {
            type: integer,
            minimum: 0,
            description: Highest event id emitted so far for this session.,
          }
        executionWorkspaceId:
          type: string
          pattern: "^ws_[0-9a-f]{32}$"
          description: (Implemented — ADR-166) The adopted handle this session runs in (handle-form sessions only).
        assignmentId:
          type: string
          format: uuid
          description: (Implemented — ADR-166) `fence.assignmentId` of the `session.create` that spawned this session.
        assignmentEpoch:
          type: integer
          minimum: 1
          description: (Implemented — ADR-166) `fence.assignmentEpoch` of the `session.create` that spawned this session.
        createdByCommandId:
          type: string
          format: uuid
          description: (Implemented — ADR-166) `command.id` of the `session.create` that spawned this session.
        acpSessionId:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            ACP session id once `session/new` has been observed (or
            echoed from `resumeSessionId`). Absent during the brief
            window between spawn and ACP handshake.
        sessionName:
          type: string
          description: |
            (M42 — Implemented, ADR-114) Logical Flow session name this record
            serves (`default` for a single-session run), echoed from
            `StartSessionRequest.sessionName`.
    SupervisorErrorCode:
      type: string
      enum:
        - PRECONDITION
        - SPAWN
        - EXECUTOR_UNAVAILABLE
        - ACP_PROTOCOL
        - CHECKPOINT
        - CRASH
        - HITL_TIMEOUT
        - NEEDS_INPUT
        - FENCED
      description: |
        Subset of the web-tier `MaisterErrorCode`. The web client translates
        this body into `MaisterError({ code })` at the boundary.

        `HITL_TIMEOUT` (M7+) is raised when a pending permission deferred
        ages past `MAISTER_KEEPALIVE_MINUTES`. `NEEDS_INPUT` (M7+) is
        returned by `POST /sessions/{id}/input` when no matching pending
        permission exists for the given `(sessionId, requestId)`.

        `FENCED` (Implemented — ADR-166, HTTP 409) is returned when
        `fence.assignmentEpoch` is below the host's persisted high-water for
        that run, or when a session evicted by a higher epoch answers its
        pending prompt. It is NOT a `MaisterErrorCode`: the web client maps
        it to `MaisterError("CONFLICT")` with
        `details.reason = "assignment_fenced"`.
    ReasonToken:
      type: string
      enum:
        - host_mismatch
        - assignment_mismatch
        - run_mismatch
        - assignment_fenced
        - turn_lost
        - unknown_workspace
        - workspace_released
        - workspace_rejected
        - legacy_field
        - missing_envelope
      description: |
        (Implemented — ADR-166) Machine-readable refusal discriminator carried in
        `SupervisorErrorBody.details.reason`. Tests assert the token, never
        the message text.
    WorkspaceRule:
      type: string
      enum:
        - relative_path
        - parent_segment
        - not_found
        - outside_roots
        - symlink_escape
        - gitdir_mismatch
        - not_a_repo
        - repo_path_mismatch
        - inside_state_dir
        - outside_workspace
      description: |
        (Implemented — ADR-166) Which adoption rule rejected a path; present
        iff `details.reason = workspace_rejected`.
    SupervisorErrorDetails:
      type: object
      additionalProperties: false
      description: |
        (Implemented — ADR-166) Typed error details. Passed through verbatim to
        the web-tier `MaisterError.details`.
      properties:
        reason: { $ref: "#/components/schemas/ReasonToken" }
        rule: { $ref: "#/components/schemas/WorkspaceRule" }
        runId: { type: string }
        commandEpoch: { type: integer, minimum: 0 }
        hostEpoch: { type: integer, minimum: 0 }
    SupervisorErrorBody:
      type: object
      required: [code, message]
      properties:
        code: { $ref: "#/components/schemas/SupervisorErrorCode" }
        message: { type: string }
        details: { $ref: "#/components/schemas/SupervisorErrorDetails" }
    ExecutionHostIdentity:
      type: object
      required: [hostKey, bootId, protocolVersion]
      additionalProperties: false
      description: |
        (Implemented — ADR-166) Durable execution-host identity reported on
        `GET /health`.
      properties:
        hostKey:
          type: string
          pattern: "^[A-Za-z0-9_-]{8,64}$"
          description: |
            Stable across restarts — minted as `eh_<uuid-without-dashes>` into
            the host state store on first boot, or the
            `MAISTER_EXECUTION_HOST_KEY` pin. A pin that conflicts with the
            stored key refuses boot.
        bootId:
          type: string
          format: uuid
          description: Per-process id; a change means the supervisor restarted.
        protocolVersion:
          type: integer
          enum: [1]
    CommandKind:
      type: string
      enum:
        - workspace.adopt
        - workspace.release
        - session.create
        - session.prompt
        - session.input
        - session.cancel
        - session.checkpoint
        - session.delete
      description: (Implemented — ADR-166) Must match the route the envelope is posted to.
    CommandFence:
      type: object
      required: [hostKey, assignmentId, assignmentEpoch, runId]
      additionalProperties: false
      description: |
        (Implemented — ADR-166) The placement fence. Checked in order: `hostKey`
        vs the host's own key (`host_mismatch`); `assignmentEpoch` vs the
        persisted per-run high-water (`< → FENCED`, `= with a different
        assignmentId → assignment_mismatch`, `> → persist + evict lower-epoch
        sessions of the run`); `runId` vs the session's / handle's run
        (`run_mismatch`).
      properties:
        hostKey:
          type: string
          pattern: "^[A-Za-z0-9_-]{8,64}$"
        assignmentId:
          type: string
          format: uuid
        assignmentEpoch:
          type: integer
          minimum: 1
        runId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._-]+$"
    CommandEnvelope:
      type: object
      required: [command, fence, payload]
      description: |
        (Implemented — ADR-166) The JSON body of every host-bound mutating route;
        the session id stays in the URL. `command.id` is the receipt dedup key.
      example:
        command:
          id: "5f6a7b8c-9d0e-4f1a-8b2c-3d4e5f6a7b8c"
          kind: "session.checkpoint"
          issuedAt: "2026-09-02T10:31:00.000Z"
        fence:
          hostKey: "eh_0f1e2d3c4b5a69788796a5b4c3d2e1f0"
          assignmentId: "6a7b8c9d-0e1f-4a2b-8c3d-4e5f6a7b8c9d"
          assignmentEpoch: 1
          runId: "run-abc"
        payload: {}
      properties:
        command:
          type: object
          required: [id, kind, issuedAt]
          additionalProperties: false
          properties:
            id: { type: string, format: uuid }
            kind: { $ref: "#/components/schemas/CommandKind" }
            issuedAt: { type: string, format: date-time }
        fence: { $ref: "#/components/schemas/CommandFence" }
        payload:
          type: object
          description: Kind-specific; each per-kind command schema narrows it.
    WorkspaceKind:
      type: string
      enum: [git_worktree, repo_checkout, directory]
      description: |
        (Implemented — ADR-166) `git_worktree` — a run worktree under
        `MAISTER_WORKSPACE_ROOTS` whose `.git` file points into
        `<repoPath>/.git/worktrees/`; `repo_checkout` — a git repo root equal
        to `repoPath` (arbitrary location); `directory` — a plain directory
        under the roots (local-package assistant, ephemeral read-only
        checkouts, agent `none`).
    AdoptWorkspacePayload:
      type: object
      required: [runId, projectSlug, kind, path]
      additionalProperties: false
      properties:
        runId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._-]+$"
          description: Stored on the handle; becomes server state for every later route.
        projectSlug:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          description: Stored on the handle; the host derives `run_dir` from it.
        kind: { $ref: "#/components/schemas/WorkspaceKind" }
        path:
          type: string
          minLength: 1
          maxLength: 4096
          description: Absolute, no `..`; the ONLY path the web sends to a session-facing route.
        repoPath:
          type: string
          minLength: 1
          maxLength: 4096
          description: Required for `git_worktree` and `repo_checkout`; forbidden for `directory`.
        contextMounts:
          type: array
          maxItems: 8
          description: (ADR-157) Read-only sibling mounts, same items as the legacy `StartSessionRequest.contextMounts`; stored on the handle.
          items:
            type: object
            additionalProperties: false
            required: [slug, path, ref, commit]
            properties:
              slug:
                {
                  type: string,
                  minLength: 1,
                  maxLength: 64,
                  pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$",
                }
              path: { type: string, minLength: 1, maxLength: 4096 }
              ref: { type: string, minLength: 1, maxLength: 255 }
              commit: { type: string, minLength: 7, maxLength: 64 }
    AdoptWorkspaceRequest:
      type: object
      required: [command, fence, payload]
      additionalProperties: false
      description: (Implemented — ADR-166) `POST /workspaces/adopt` body.
