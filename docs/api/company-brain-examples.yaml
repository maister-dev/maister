    valid: false
    value:
      runId: "retained_run_example"
      revision: 1
      validity: "invalid"
      schemaRef: "pinned-package@aaaaaaaaaaaa:summary.v1"
      schemaSha256: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
