# The FLAT baseline arm of the Evaluation Lab comparison (ADR-165 §9): one
# agent, no delegation, no research phase. Everything the harness arms add must
# earn its cost against this.
schemaVersion: 1
name: single-agent
compat:
  engine_min: 3.7.0
metadata:
  title: Single agent (flat baseline)
  summary: One ai_coding node and a human review. No delegation.
nodes:
  - id: implement
    type: ai_coding
    action:
      prompt: "{{ task.prompt }}\n\n{{ review_comments }}"
    transitions:
      success: review
  - id: review
    type: human
    finish:
      human:
        decisions: [approve, rework]
    transitions:
      approve: done
      rework: implement
    rework:
      allowedTargets: [implement]
      workspacePolicies: [keep]
      maxLoops: 3
      commentsVar: review_comments
