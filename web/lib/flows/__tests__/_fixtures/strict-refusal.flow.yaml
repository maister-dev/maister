schemaVersion: 1
name: Strict Refusal (fixture)
# ADR-130: an ai_coding node declaring `enforcement: strict` on a capability class
# the ENFORCEABILITY_BY_AGENT table can only INSTRUCT (skills has no tool-identity
# seam mechanism). Launch MUST be refused with MaisterError("CONFIG"). Drives
# Verify #2/#3 + e2e. (tools/mcps flipped to enforced — they launch; skills does not.)
compat:
  engine_min: 1.1.0
nodes:
  - id: implement
    type: ai_coding
    action:
      prompt: "/aif-implement"
    settings:
      skills: [aif-implement]
      enforcement:
        skills: strict
    transitions:
      success: review
  - id: review
    type: human
    finish:
      human:
        role: maintainer
        decisions: [approve]
    transitions:
      approve: done
